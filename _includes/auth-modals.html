<div class="fn-modal-backdrop" id="loginBackdrop">
  <div class="fn-modal">
    <button type="button" class="fn-modal-close" data-close>&times;</button>
    <h2 id="authTitle">Login</h2>
    <form id="fnLoginForm">
      <div class="fn-field"><label>Email</label><input type="email" id="fnLoginEmail" required></div>
      <div class="fn-field"><label>Password</label><input type="password" id="fnLoginPassword" required></div>
      <button type="submit" class="fn-primary-btn">Login</button>
      <div class="fn-modal-alt"><a href="forgot-password">Forgot password?</a></div>
    </form>
    <form id="fnSignupForm" style="display:none;">
      <div class="fn-field"><label>Email</label><input type="email" id="fnSignupEmail" required></div>
      <div class="fn-field"><label>Password</label><input type="password" id="fnSignupPassword" required></div>
      <button type="submit" class="fn-primary-btn">Create account</button>
    </form>
    <div class="fn-msg" id="fnAuthMsg"></div>
    <div class="fn-modal-alt" id="fnAuthToggle">Don't have an account? <a data-auth-toggle>Sign up</a></div>
  </div>
</div>

<div class="fn-modal-backdrop" id="profileBackdrop">
  <div class="fn-modal wide">
    <button type="button" class="fn-modal-close" data-close>&times;</button>
    <h2>My Profile</h2>
    <p style="text-align:center; color:#666; font-size:13px; margin:-10px 0 18px;" id="fnProfileEmail"></p>
    <form id="fnProfileForm">
      <div class="fn-row2">
        <div class="fn-field"><label>Full Name</label><input type="text" id="fp_name"></div>
        <div class="fn-field"><label>Cell Phone</label><input type="tel" id="fp_cell_phone"></div>
      </div>
      <div class="fn-field"><label>Location</label><input type="text" id="fp_location"></div>
      <div class="fn-section-label">Social Media</div>
      <div class="fn-row2">
        <div class="fn-field"><label>X (Twitter)</label><input type="text" id="fp_x_handle" placeholder="@username"></div>
        <div class="fn-field"><label>Bluesky</label><input type="text" id="fp_bluesky_handle" placeholder="username.bsky.social"></div>
      </div>
      <div class="fn-field"><label>Discord</label><input type="text" id="fp_discord_handle" placeholder="username#0000"></div>
      <div class="fn-section-label">Fantasy Football</div>
      <div class="fn-row2">
        <div class="fn-field"><label>Sleeper Handle</label><input type="text" id="fp_sleeper_handle"></div>
        <div class="fn-field"><label>MFL Handle</label><input type="text" id="fp_mfl_handle"></div>
      </div>
      <button type="submit" class="fn-primary-btn">Save changes</button>
      <div class="fn-msg" id="fnProfileMsg"></div>
    </form>
    <div class="fn-section-label">Sleeper Leagues</div>
    <button type="button" class="fn-primary-btn" style="background:#06192b;" onclick="syncMySleeperLeagues()">Sync my Sleeper leagues</button>
    <div id="sleeperResult" style="margin-top:14px; font-size:14px; color:#333;"></div>
    <button type="button" class="fn-primary-btn" style="background:#999; margin-top:18px;" data-logout>Log out</button>
  </div>
</div>
