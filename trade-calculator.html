---
layout: null
---
{% include header.html css="trade-calculator" %}
{% include back-to-tools.html %}


<main class="tc-wrap">
  <div class="tc-head">
    <h1>Trade Calculator</h1>
    <p class="tc-sub">Value any trade on FantasyNow+ rankings — players and rookie picks.</p>
  </div>

  <div class="tc-fmt">
    <button class="tc-fmt-btn active" data-fmt="dynasty">Dynasty</button>
    <button class="tc-fmt-btn" data-fmt="redraft">Redraft</button>
  </div>

  <div id="tc-status" class="tc-status">Loading rankings…</div>

  <div class="tc-grid">
    <div class="tc-side">
      <div class="tc-side-head">Side A <span class="tc-total" id="tc-total-A">0</span></div>
      <div class="tc-searchwrap"><input class="tc-search" id="tc-search-A" data-side="A" placeholder="Search a player…" autocomplete="off"><div class="tc-results" id="tc-results-A"></div></div>
      <div class="tc-pickadd" id="tc-pickadd-A"></div>
      <div class="tc-list" id="tc-list-A"></div>
    </div>
    <div class="tc-side">
      <div class="tc-side-head">Side B <span class="tc-total" id="tc-total-B">0</span></div>
      <div class="tc-searchwrap"><input class="tc-search" id="tc-search-B" data-side="B" placeholder="Search a player…" autocomplete="off"><div class="tc-results" id="tc-results-B"></div></div>
      <div class="tc-pickadd" id="tc-pickadd-B"></div>
      <div class="tc-list" id="tc-list-B"></div>
    </div>
  </div>

  <div class="tc-verdict" id="tc-verdict"></div>
</main>

<script src="javascript/trade-calculator.js"></script>

{% include footer.html %}
