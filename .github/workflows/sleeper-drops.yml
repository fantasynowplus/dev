name: Sleeper waiver drops

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleeper-drops
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch trending drops
        env:
          SLEEPER_LOOKBACK_HOURS: '48'
          SLEEPER_TRENDING_LIMIT: '300'
        run: python scripts/sleeper_drops.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sleeper-drops.json data/sleeper-players.json
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "Update Sleeper waiver drops"
            git push
          fi