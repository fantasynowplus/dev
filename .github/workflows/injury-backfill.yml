name: Injury Report Backfill

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (e.g. 2025)"
        required: true
      start_week:
        description: "First week to backfill (e.g. 1)"
        required: true
      end_week:
        description: "Last week to backfill (e.g. 3)"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @supabase/supabase-js ws

      - name: Run injury backfill
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FP_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/injury-backfill.js "${{ inputs.season }}" "${{ inputs.start_week }}" "${{ inputs.end_week }}"
