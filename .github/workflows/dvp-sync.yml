name: Sync defense vs position

on:
  schedule:
    - cron: '20 9 * * *'      # 09:20 UTC daily (after Monday night games settle)
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to build (blank = current)'
        required: false

permissions:
  contents: write

jobs:
  dvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build data/dvp.json
        env:
          SEASON: ${{ github.event.inputs.season }}
        run: node scripts/dvp-sync.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/dvp.json)" ]; then
            git add data/dvp.json
            git commit -m "chore: update defense vs position data"
            git push
          else
            echo "No change."
          fi
