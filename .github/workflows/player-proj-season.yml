name: Season Projections

on:
  schedule:
    - cron: "40 13 * * 2"
  workflow_dispatch:

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install numpy

      - name: Run season projections
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python run_season.py \
            --season 2026 \
            --weeks 4 \
            --sims 2000 \
            --prior-season-fallback 2025 \
            --out "${RUNNER_TEMP}/player-proj-season.json"
