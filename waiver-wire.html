---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantasyNow+ Waiver Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stream-bg:#001738;
    --header-bg:#002863;
    --card-bg:#00204d;
    --panel:rgba(255,255,255,.035);
    --panel-hi:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.09);
    --orange:#FFA515;
    --aqua:#42F4B0;
    --redorange:#EA4E3D;
    --text:#EAF1FF;
    --muted:#8FA4C6;

    --t1:#EA4E3D; --t2:#FFA515; --t3:#F5C518;
    --t4:#42F4B0; --t5:#3DA5EA; --t6:#B07BEA;

    --qb:var(--t1); --rb:var(--t4); --wr:var(--t5); --te:var(--t6);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:var(--stream-bg)}
  body{
    background:var(--stream-bg);
    color:var(--text);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-variant-numeric:tabular-nums;
  }
  body.locked{overflow:hidden}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 64px}

  .topbar{
    display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px;margin-right:auto}
  .brand img{height:42px;width:auto;display:block}
  .brand .report-title{
    font-family:"Oswald";font-weight:600;text-transform:uppercase;
    letter-spacing:.12em;font-size:16px;color:#fff;
    padding-left:16px;border-left:1px solid var(--line);
  }
  .title{
    font-family:"Oswald";font-weight:600;text-transform:uppercase;
    letter-spacing:.16em;font-size:13px;color:var(--muted);
    margin-top:6px;
  }
  .title .pos{color:var(--orange)}

  .toggle{display:inline-flex;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:5px}
  .toggle button{
    font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    font-size:14px;color:var(--muted);background:transparent;border:0;cursor:pointer;
    padding:8px 18px;border-radius:999px;transition:color .15s, background .15s;
  }
  .toggle button.active{background:var(--orange);color:#04122b}
  .toggle button:not(.active):hover{color:#fff}
  .toggle button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

  .meta{display:flex;align-items:center;gap:14px;margin-top:6px}
  .updated{font-size:12px;color:var(--muted);letter-spacing:.02em}
  .refresh{background:transparent;border:1px solid var(--line);color:var(--muted);
    font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer}
  .refresh:hover{color:#fff;border-color:var(--muted)}

  .filters{
    display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-bottom:18px;
  }
  .field{display:flex;flex-direction:column;gap:7px}
  .field > label{
    font-family:"Oswald";font-weight:600;text-transform:uppercase;
    letter-spacing:.1em;font-size:11px;color:var(--muted);
  }
  .field .val{color:var(--orange)}

  .search input{
    background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--text);
    font-family:"Inter",sans-serif;font-size:14px;padding:8px 12px;border-radius:8px;
    width:210px;
  }
  .search input::placeholder{color:#5d719a}
  .search input:focus{outline:none;border-color:var(--aqua)}

  select.pick{
    background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--text);
    font-family:"Inter",sans-serif;font-size:14px;padding:8px 12px;border-radius:8px;
    cursor:pointer;
  }
  select.pick:focus{outline:none;border-color:var(--aqua)}

  input[type=range]{width:170px;accent-color:var(--orange);cursor:pointer}

  .stepper{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.25);
    border:1px solid var(--line);border-radius:8px;padding:3px}
  .stepper button{
    background:transparent;border:0;color:var(--muted);cursor:pointer;
    font-size:16px;line-height:1;width:26px;height:26px;border-radius:6px;
  }
  .stepper button:hover{color:#fff;background:var(--panel-hi)}
  .stepper span{min-width:22px;text-align:center;font-size:14px;font-weight:600}

  .check{display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    font-size:13px;color:var(--text);padding-bottom:9px}
  .check input{accent-color:var(--orange);width:16px;height:16px;cursor:pointer}

  .reset{background:transparent;border:1px solid var(--line);color:var(--muted);
    font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;margin-left:auto}
  .reset:hover{color:#fff;border-color:var(--muted)}

  .count{font-size:12px;color:var(--muted);margin:0 0 12px 2px;letter-spacing:.02em}
  .count b{color:#fff;font-weight:600}

  .scroller{overflow-x:auto;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.02)}
  table{border-collapse:collapse;width:100%;min-width:940px}

  thead th{
    position:sticky;top:0;z-index:3;
    background:var(--header-bg);
    border-bottom:2px solid var(--orange);
    padding:12px 10px;font-family:"Oswald";font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);
    text-align:center;white-space:nowrap;cursor:pointer;user-select:none;
  }
  thead th:hover{color:#fff}
  thead th.pos{width:62px}
  thead th.player{text-align:left;padding-left:16px;min-width:180px}
  thead th.key{color:var(--aqua)}
  thead th .arrow{opacity:.45;font-size:10px;margin-left:4px}
  thead th.sorted{color:#fff}
  thead th.sorted .arrow{opacity:1;color:var(--orange)}

  tbody td{padding:9px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);
    font-size:15px;color:#D8E3F7}
  tbody td.player{text-align:left;padding-left:16px;font-weight:600;color:#fff;
    font-size:15px;letter-spacing:.01em}
  tbody td.key{color:var(--aqua);font-weight:700}
  tbody td.dim{color:#4a5c7d}
  tbody tr.row{cursor:pointer}
  tbody tr.row:hover td{background:rgba(255,255,255,.05)}
  tbody tr.row:hover td.player{color:var(--orange)}
  tbody td.thin{color:var(--t3)}

  .pospill{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:34px;height:24px;padding:0 8px;border-radius:7px;
    font-family:"Oswald";font-weight:700;font-size:13px;color:#04122b;
  }
  .byetag{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;height:22px;padding:0 7px;border-radius:6px;
    background:rgba(234,78,61,.16);color:var(--redorange);
    font-weight:700;font-size:13px;
  }

  .state{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px}
  .state b{color:#fff;font-weight:600}
  .state code{color:var(--aqua);background:rgba(66,244,176,.08);padding:2px 6px;border-radius:5px}

  .backdrop{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(0,8,22,.78);
    align-items:flex-start;justify-content:center;
    padding:40px 20px;overflow-y:auto;
  }
  .backdrop.open{display:flex}

  .card{
    width:100%;max-width:760px;background:var(--card-bg);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }

  .cardtop{display:flex;gap:20px;padding:22px 24px;align-items:center;
    background:var(--header-bg);border-bottom:2px solid var(--orange);position:relative}
  .shot{
    width:96px;height:96px;border-radius:12px;flex:none;overflow:hidden;
    background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;
  }
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .shot .initials{font-family:"Oswald";font-weight:700;font-size:30px;color:var(--muted)}

  .who{min-width:0;flex:1}
  .who h2{
    margin:0 0 4px;font-family:"Oswald";font-weight:700;font-size:30px;
    line-height:1.1;color:#fff;letter-spacing:.01em;
  }
  .who .sub{font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .who .sub .dot{opacity:.4;margin:0 7px}

  .closex{
    position:absolute;top:14px;right:16px;background:transparent;border:0;
    color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px;
  }
  .closex:hover{color:#fff;background:rgba(255,255,255,.08)}

  .ranks{display:flex;flex-wrap:wrap;gap:26px;padding:18px 24px;
    border-bottom:1px solid var(--line)}
  .rank{display:flex;flex-direction:column;gap:3px}
  .rank .n{font-family:"Oswald";font-weight:700;font-size:24px;color:#fff;line-height:1}
  .rank .n .u{font-size:14px;color:var(--muted);margin-left:3px}
  .rank .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .rank.hi .n{color:var(--aqua)}

  .logwrap{padding:0}
  .logtitle{
    padding:16px 24px 10px;font-family:"Oswald";font-weight:600;
    text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);
  }
  .logscroll{overflow-x:auto;max-height:46vh;overflow-y:auto}
  table.log{border-collapse:collapse;width:100%;min-width:520px}
  table.log th{
    position:sticky;top:0;z-index:2;background:#001a40;
    padding:9px 10px;font-family:"Oswald";font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);
    text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);
  }
  table.log th.wk{width:46px}
  table.log th.pts,table.log td.pts{color:var(--aqua);font-weight:700}
  table.log td{
    padding:8px 10px;text-align:center;font-size:14px;color:#D8E3F7;
    border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;
  }
  table.log td.wk{color:var(--muted);font-weight:600}
  table.log tr.byerow td{color:var(--redorange);font-weight:600;letter-spacing:.1em;
    background:rgba(234,78,61,.07);text-transform:uppercase;font-size:12px}
  table.log tr.dnp td{color:#4a5c7d}
  .cardnote{padding:16px 24px;color:var(--muted);font-size:13px;text-align:center}

  @media (max-width:640px){
    .wrap{padding:18px 12px 48px}
    .filters{gap:16px;padding:14px}
    .search input{width:100%}
    .reset{margin-left:0}
    .backdrop{padding:16px 10px}
    .cardtop{gap:14px;padding:18px}
    .shot{width:68px;height:68px}
    .who h2{font-size:23px}
    .ranks{gap:18px;padding:14px 18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <img src="assets/logos/fantasynowplus.png" alt="FantasyNow+" onerror="this.remove()">
      <span class="report-title">Waiver Wire Board</span>
    </div>
    <div>
      <div class="toggle" role="tablist" aria-label="Position">
        <button id="tab-ALL" class="active" role="tab" aria-selected="true" onclick="setPos('ALL')">All</button>
        <button id="tab-QB" role="tab" aria-selected="false" onclick="setPos('QB')">QB</button>
        <button id="tab-RB" role="tab" aria-selected="false" onclick="setPos('RB')">RB</button>
        <button id="tab-WR" role="tab" aria-selected="false" onclick="setPos('WR')">WR</button>
        <button id="tab-TE" role="tab" aria-selected="false" onclick="setPos('TE')">TE</button>
      </div>
      <div class="meta">
        <span class="updated" id="updated"></span>
        <button class="refresh" onclick="reload()">Refresh</button>
      </div>
    </div>
    <div class="title">Waiver Targets &middot; <span class="pos" id="weekLabel">&mdash;</span></div>
  </div>

  <div class="filters">
    <div class="field">
      <label for="limit">Show</label>
      <select class="pick" id="limit" onchange="draw()">
        <option value="10" selected>10 players</option>
        <option value="15">15 players</option>
        <option value="20">20 players</option>
        <option value="25">25 players</option>
        <option value="50">50 players</option>
        <option value="0">All</option>
      </select>
    </div>

    <div class="field search">
      <label for="q">Search</label>
      <input id="q" type="search" placeholder="Player or team" autocomplete="off" oninput="draw()">
    </div>

    <div class="field">
      <label for="rost">Max roster % <span class="val" id="rostVal">60%</span></label>
      <input id="rost" type="range" min="0" max="100" step="5" value="60" oninput="draw()">
    </div>

    <div class="field">
      <label>Min games (L3)</label>
      <div class="stepper">
        <button type="button" onclick="bumpGP(-1)" aria-label="Decrease">&minus;</button>
        <span id="gpVal">1</span>
        <button type="button" onclick="bumpGP(1)" aria-label="Increase">+</button>
      </div>
    </div>

    <label class="check" id="byeWrap">
      <input id="hideBye" type="checkbox" checked onchange="draw()">
      <span id="byeLabel">Hide players on bye</span>
    </label>

    <button class="reset" onclick="resetFilters()">Reset filters</button>
  </div>

  <p class="count" id="count"></p>

  <div class="scroller">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"><tr><td class="state">Loading waiver board&hellip;</td></tr></tbody>
    </table>
  </div>

</div>

<div class="backdrop" id="backdrop" onclick="if(event.target===this) closeCard()">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardName">
    <div class="cardtop">
      <div class="shot" id="cardShot"></div>
      <div class="who">
        <h2 id="cardName">&nbsp;</h2>
        <div class="sub" id="cardSub"></div>
      </div>
      <button class="closex" onclick="closeCard()" aria-label="Close">&times;</button>
    </div>
    <div class="ranks" id="cardRanks"></div>
    <div class="logwrap">
      <div class="logtitle" id="cardLogTitle">Game Log</div>
      <div class="logscroll" id="cardLog"></div>
    </div>
  </div>
</div>

<script>

const CONFIG = {
  WEB_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPaCNSMYNkNavyamJOZh6RZb4G7UFMRp6h-BO2KJKj3t821H0-dTWzxo6qLhr6Nrh2U9BN2OQLfwOl/pubhtml?gid=1131935259&single=true"
};

const COL = { pos:0, player:1, team:2, bye:3, rost:4,
              lwPts:5, lwRank:6, l3Ppg:7, l3Rank:8, l3Gp:9,
              season:10, week:11, sleeperId:12 };

const POS_COLOR = { QB:"var(--qb)", RB:"var(--rb)", WR:"var(--wr)", TE:"var(--te)" };

const COLUMNS = [
  { key:"pos",    label:"Pos",     cls:"pos",    type:"str" },
  { key:"player", label:"Player",  cls:"player", type:"str" },
  { key:"team",   label:"Team",    cls:"",       type:"str" },
  { key:"bye",    label:"Bye",     cls:"",       type:"num" },
  { key:"rost",   label:"Rost %",  cls:"",       type:"num" },
  { key:"lwPts",  label:"LW Pts",  cls:"",       type:"num" },
  { key:"lwRank", label:"LW Rank", cls:"",       type:"num" },
  { key:"l3Ppg",  label:"L3 PPG",  cls:"key",    type:"num" },
  { key:"l3Rank", label:"L3 Rank", cls:"",       type:"num" },
  { key:"l3Gp",   label:"L3 GP",   cls:"",       type:"num" }
];

const LOG_COLUMNS = {
  QB:[ {k:"pass_cmp",l:"C"},{k:"pass_att",l:"Att"},{k:"pass_yd",l:"Yds"},
       {k:"pass_td",l:"TD"},{k:"pass_int",l:"Int"},
       {k:"rush_att",l:"Car"},{k:"rush_yd",l:"RuYd"},{k:"rush_td",l:"RuTD"} ],
  RB:[ {k:"rush_att",l:"Car"},{k:"rush_yd",l:"Yds"},{k:"rush_td",l:"TD"},
       {k:"rec_tgt",l:"Tar"},{k:"rec",l:"Rec"},{k:"rec_yd",l:"ReYd"},{k:"rec_td",l:"ReTD"},
       {k:"fum_lost",l:"FL"} ],
  WR:[ {k:"rec_tgt",l:"Tar"},{k:"rec",l:"Rec"},{k:"rec_yd",l:"Yds"},{k:"rec_td",l:"TD"},
       {k:"rush_att",l:"Car"},{k:"rush_yd",l:"RuYd"},{k:"rush_td",l:"RuTD"} ],
  TE:[ {k:"rec_tgt",l:"Tar"},{k:"rec",l:"Rec"},{k:"rec_yd",l:"Yds"},{k:"rec_td",l:"TD"},
       {k:"fum_lost",l:"FL"} ]
};

let ALL = [];
let upcomingWeek = null;
let season = "";
let pos = "ALL";
let minGP = 1;
let sort = { key:"l3Ppg", dir:-1 };
let schedule = null;
const logCache = {};

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===",") { row.push(cur); cur=""; }
      else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=="\r") cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function num(v){
  const s=String(v==null?"":v).replace(/,/g,"").trim();
  if(s==="") return null;
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}

function pct(v){
  const s=String(v==null?"":v).replace(/,/g,"").trim();
  if(s==="") return null;
  const hasSign=s.indexOf("%")>-1;
  const n=parseFloat(s.replace("%",""));
  if(isNaN(n)) return null;
  if(hasSign) return n/100;
  return n>1 ? n/100 : n;
}

function toRows(raw){
  const out=[];
  raw.forEach((r,i)=>{
    if(i===0) return;
    const p=(r[COL.player]||"").trim();
    const ps=(r[COL.pos]||"").trim().toUpperCase();
    if(!p || !POS_COLOR[ps]) return;
    out.push({
      pos:ps,
      player:p,
      team:(r[COL.team]||"").trim(),
      bye:num(r[COL.bye]),
      rost:pct(r[COL.rost]),
      lwPts:num(r[COL.lwPts]),
      lwRank:num(r[COL.lwRank]),
      l3Ppg:num(r[COL.l3Ppg]),
      l3Rank:num(r[COL.l3Rank]),
      l3Gp:num(r[COL.l3Gp]),
      season:(r[COL.season]||"").trim(),
      week:num(r[COL.week]),
      sleeperId:(r[COL.sleeperId]||"").trim()
    });
  });
  out.slice().sort((a,b)=>(b.l3Ppg||0)-(a.l3Ppg||0)).forEach((r,i)=>{ r.ovr=i+1; });
  return out;
}

function buildHead(){
  let h="";
  COLUMNS.forEach(c=>{
    const on = sort.key===c.key;
    const arrow = on ? (sort.dir===1?"&#9650;":"&#9660;") : "&#9670;";
    h += '<th class="'+c.cls+(on?" sorted":"")+'" onclick="setSort(\''+c.key+'\')">'
       + c.label + '<span class="arrow">'+arrow+'</span></th>';
  });
  document.getElementById("head").innerHTML=h;
}

function setSort(key){
  const c=COLUMNS.find(x=>x.key===key);
  if(sort.key===key){ sort.dir=-sort.dir; }
  else { sort.key=key; sort.dir = c.type==="str" ? 1 : -1; }
  buildHead(); draw();
}

function setPos(p){
  pos=p;
  ["ALL","QB","RB","WR","TE"].forEach(x=>{
    const b=document.getElementById("tab-"+x);
    const on=x===p;
    b.classList.toggle("active",on);
    b.setAttribute("aria-selected",on);
  });
  draw();
}

function bumpGP(d){
  minGP=Math.max(0,Math.min(3,minGP+d));
  document.getElementById("gpVal").textContent=minGP;
  draw();
}

function resetFilters(){
  document.getElementById("q").value="";
  document.getElementById("rost").value=60;
  document.getElementById("limit").value="10";
  document.getElementById("hideBye").checked=true;
  minGP=1;
  document.getElementById("gpVal").textContent="1";
  sort={key:"l3Ppg",dir:-1};
  buildHead();
  setPos("ALL");
}

let shownRows=[];

function draw(){
  const body=document.getElementById("body");
  if(!ALL.length){
    body.innerHTML='<tr><td class="state" colspan="'+COLUMNS.length+'">'
      +'The CSV loaded, but no player rows were recognized. Check that <code>Web_Data</code> '
      +'is the sheet selected in Publish to web, and that its column A reads QB / RB / WR / TE.'
      +'</td></tr>';
    return;
  }

  const q=document.getElementById("q").value.trim().toLowerCase();
  const maxRost=parseInt(document.getElementById("rost").value,10)/100;
  const limit=parseInt(document.getElementById("limit").value,10);
  const hideBye=document.getElementById("hideBye").checked;
  document.getElementById("rostVal").textContent=Math.round(maxRost*100)+"%";

  const rows=ALL.filter(r=>{
    if(pos!=="ALL" && r.pos!==pos) return false;
    if(r.rost!=null && r.rost>maxRost) return false;
    if(minGP>0 && (r.l3Gp==null || r.l3Gp<minGP)) return false;
    if(hideBye && upcomingWeek!=null && r.bye!=null && r.bye===upcomingWeek) return false;
    if(q){
      const hay=(r.player+" "+r.team).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });

  const c=COLUMNS.find(x=>x.key===sort.key);
  rows.sort((a,b)=>{
    let x=a[sort.key], y=b[sort.key];
    if(c.type==="str"){
      x=String(x||""); y=String(y||"");
      return x.localeCompare(y)*sort.dir;
    }
    if(x==null && y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    return (x-y)*sort.dir;
  });

  shownRows = limit>0 ? rows.slice(0,limit) : rows;

  document.getElementById("count").innerHTML =
    "Showing <b>"+shownRows.length+"</b> of "+rows.length+" matching"
    + (rows.length!==ALL.length ? " &middot; "+ALL.length+" total" : "");

  if(!shownRows.length){
    body.innerHTML='<tr><td class="state" colspan="'+COLUMNS.length+'">'
      +'No players match these filters. Try raising <b>max roster %</b> or clearing the search.</td></tr>';
    return;
  }

  let html="";
  shownRows.forEach((r,i)=>{
    const onBye = upcomingWeek!=null && r.bye!=null && r.bye===upcomingWeek;
    const byeCell = r.bye==null ? '<td class="dim">&ndash;</td>'
      : (onBye ? '<td><span class="byetag">'+r.bye+'</span></td>' : '<td>'+r.bye+'</td>');

    html += '<tr class="row" onclick="openCard('+i+')">'
      + '<td><span class="pospill" style="background:'+POS_COLOR[r.pos]+'">'+r.pos+'</span></td>'
      + '<td class="player">'+escapeHtml(r.player)+'</td>'
      + '<td>'+escapeHtml(r.team)+'</td>'
      + byeCell
      + '<td>'+(r.rost==null?'<span class="dim">&ndash;</span>':(r.rost*100).toFixed(1)+"%")+'</td>'
      + '<td'+(r.lwPts?'':' class="dim"')+'>'+(r.lwPts==null?"&ndash;":r.lwPts.toFixed(1))+'</td>'
      + '<td'+(r.lwRank?'':' class="dim"')+'>'+(r.lwRank==null?"&ndash;":r.pos+r.lwRank)+'</td>'
      + '<td class="key">'+(r.l3Ppg==null?"&ndash;":r.l3Ppg.toFixed(1))+'</td>'
      + '<td'+(r.l3Rank?'':' class="dim"')+'>'+(r.l3Rank==null?"&ndash;":r.pos+r.l3Rank)+'</td>'
      + '<td'+(r.l3Gp!=null && r.l3Gp<3?' class="thin"':'')+'>'+(r.l3Gp==null?"&ndash;":r.l3Gp)+'</td>'
      + '</tr>';
  });
  body.innerHTML=html;
}

function initials(name){
  const p=name.split(/\s+/).filter(Boolean);
  return ((p[0]||"")[0]||"")+((p[p.length-1]||"")[0]||"");
}

function openCard(i){
  const r=shownRows[i];
  if(!r) return;

  document.getElementById("cardName").textContent=r.player;
  document.getElementById("cardSub").innerHTML=
    escapeHtml(r.team||"FA")+'<span class="dot">&middot;</span>'+r.pos
    +(r.bye!=null?'<span class="dot">&middot;</span>Bye '+r.bye:"");

  const shot=document.getElementById("cardShot");
  if(r.sleeperId){
    shot.innerHTML='<img src="https://sleepercdn.com/content/nfl/players/'+encodeURIComponent(r.sleeperId)
      +'.jpg" alt="" onerror="this.parentNode.innerHTML=\'<span class=&quot;initials&quot;>'
      +escapeHtml(initials(r.player))+'</span>\'">';
  }else{
    shot.innerHTML='<span class="initials">'+escapeHtml(initials(r.player))+'</span>';
  }

  document.getElementById("cardRanks").innerHTML=
      rankBlock(r.l3Rank!=null?r.pos+r.l3Rank:"\u2014", "Pos rank (L3)", true)
    + rankBlock(r.ovr?"#"+r.ovr:"\u2014", "Overall (L3)", false)
    + rankBlock(r.rost!=null?(r.rost*100).toFixed(0)+'<span class="u">%</span>':"\u2014", "Rostered", false)
    + rankBlock(r.l3Ppg!=null?r.l3Ppg.toFixed(1):"\u2014", "L3 PPG", true)
    + rankBlock(r.lwPts!=null?r.lwPts.toFixed(1):"\u2014", "Last game", false);

  document.getElementById("cardLogTitle").textContent =
    (r.season?r.season+" ":"")+"Game Log";
  document.getElementById("cardLog").innerHTML=
    '<div class="cardnote">Loading game log&hellip;</div>';

  document.getElementById("backdrop").classList.add("open");
  document.body.classList.add("locked");

  loadLog(r);
}

function rankBlock(value,label,hi){
  return '<div class="rank'+(hi?" hi":"")+'"><span class="n">'+value+'</span>'
       + '<span class="l">'+label+'</span></div>';
}

function closeCard(){
  document.getElementById("backdrop").classList.remove("open");
  document.body.classList.remove("locked");
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeCard(); });

function normalizeLog(raw){
  const out=[];
  const push=(k,entry)=>{
    if(!entry||typeof entry!=="object") return;
    const stats=entry.stats||entry;
    const wk=parseInt(entry.week!=null?entry.week:k,10);
    if(!wk) return;
    const opp=entry.opponent||entry.opp||null;
    out.push({week:wk,opp:opp,stats:stats||{}});
  };
  if(Array.isArray(raw)) raw.forEach((e,i)=>push(i+1,e));
  else if(raw&&typeof raw==="object") Object.keys(raw).forEach(k=>push(k,raw[k]));
  return out.filter(x=>x.stats).sort((a,b)=>a.week-b.week);
}

async function getSchedule(yr){
  if(schedule!==null) return schedule;
  try{
    const res=await fetch("https://api.sleeper.app/schedule/nfl/regular/"+yr);
    if(!res.ok) throw 0;
    const games=await res.json();
    const map={};
    (Array.isArray(games)?games:[]).forEach(g=>{
      const wk=g.week, h=g.home||g.home_team, a=g.away||g.away_team;
      if(!wk||!h||!a) return;
      map[h+"|"+wk]="vs "+a;
      map[a+"|"+wk]="@ "+h;
    });
    schedule=map;
  }catch(e){ schedule={}; }
  return schedule;
}

async function loadLog(r){
  const target=document.getElementById("cardLog");
  if(!r.sleeperId){
    target.innerHTML='<div class="cardnote">Game log unavailable for this player.</div>';
    return;
  }
  const yr=r.season||new Date().getFullYear();
  const key=r.sleeperId+"|"+yr;

  try{
    if(!logCache[key]){
      const url="https://api.sleeper.com/stats/nfl/player/"+encodeURIComponent(r.sleeperId)
              + "?season="+encodeURIComponent(yr)+"&season_type=regular&grouping=week";
      const res=await fetch(url);
      if(!res.ok) throw new Error("HTTP "+res.status);
      logCache[key]=normalizeLog(await res.json());
    }
    const log=logCache[key];
    const sched=await getSchedule(yr);
    renderLog(r,log,sched);
  }catch(e){
    target.innerHTML='<div class="cardnote">Couldn\'t load the game log from Sleeper.</div>';
  }
}

function renderLog(r,log,sched){
  const target=document.getElementById("cardLog");
  const cols=LOG_COLUMNS[r.pos]||LOG_COLUMNS.WR;
  const byWeek={};
  log.forEach(e=>{ byWeek[e.week]=e; });

  const maxWeek=Math.max(
    upcomingWeek||0,
    log.length?log[log.length-1].week:0,
    r.bye||0
  );
  if(!maxWeek){
    target.innerHTML='<div class="cardnote">No games played yet this season.</div>';
    return;
  }

  let head='<tr><th class="wk">Wk</th><th>Opp</th><th class="pts">Pts</th>';
  cols.forEach(c=>{ head+='<th>'+c.l+'</th>'; });
  head+='</tr>';

  let rows="";
  for(let w=1; w<=maxWeek; w++){
    if(r.bye!=null && w===r.bye){
      rows+='<tr class="byerow"><td class="wk">'+w+'</td>'
           +'<td colspan="'+(cols.length+2)+'">Bye</td></tr>';
      continue;
    }
    const e=byWeek[w];
    const opp=(e&&e.opp) ? e.opp : (sched[(r.team||"")+"|"+w]||"\u2014");
    if(!e){
      rows+='<tr class="dnp"><td class="wk">'+w+'</td><td>'+escapeHtml(opp)+'</td>'
           +'<td class="pts">&ndash;</td>';
      cols.forEach(()=>{ rows+='<td>&ndash;</td>'; });
      rows+='</tr>';
      continue;
    }
    const s=e.stats||{};
    const pts=(s.pts_ppr!=null)?(+s.pts_ppr).toFixed(1):"&ndash;";
    rows+='<tr><td class="wk">'+w+'</td><td>'+escapeHtml(opp)+'</td>'
         +'<td class="pts">'+pts+'</td>';
    cols.forEach(c=>{
      const v=s[c.k];
      rows+='<td>'+(v==null||v===0?(v===0?"0":"&ndash;"):(Math.round(v*10)/10))+'</td>';
    });
    rows+='</tr>';
  }

  target.innerHTML='<table class="log"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>';
}

function stamp(){
  const d=new Date();
  document.getElementById("updated").textContent=
    "Updated "+d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}

async function load(force){
  const url=CONFIG.WEB_URL;
  const body=document.getElementById("body");
  if(!url || url.indexOf("PASTE_")===0){
    body.innerHTML='<tr><td class="state" colspan="'+COLUMNS.length+'">'
      +'Add your published-CSV link in the <b>CONFIG</b> block (<code>WEB_URL</code>) to load the board.</td></tr>';
    return;
  }
  body.innerHTML='<tr><td class="state" colspan="'+COLUMNS.length+'">Loading waiver board&hellip;</td></tr>';
  try{
    const res=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now());
    if(!res.ok) throw new Error("HTTP "+res.status);
    const grid=parseCSV(await res.text());
    ALL=toRows(grid);
    if(!ALL.length){
      console.log("Web_Data header row:", grid[0]);
      console.log("Web_Data first data row:", grid[1]);
    }
    if(ALL.length){
      upcomingWeek=ALL[0].week;
      season=ALL[0].season;
    }
    const wk = upcomingWeek!=null ? "Week "+upcomingWeek : "";
    document.getElementById("weekLabel").textContent=[season,wk].filter(Boolean).join(" \u00b7 ") || "\u2014";
    const byeWrap=document.getElementById("byeWrap");
    if(upcomingWeek==null){ byeWrap.style.display="none"; }
    else { document.getElementById("byeLabel").textContent="Hide players on bye (Wk "+upcomingWeek+")"; }
    stamp();
    draw();
  }catch(e){
    body.innerHTML='<tr><td class="state" colspan="'+COLUMNS.length+'">'
      +'Couldn\'t load the waiver data. Check that the <b>Web_Data</b> sheet is '
      +'<b>published to the web</b> and the link in <code>WEB_URL</code> is correct.</td></tr>';
  }
}

function reload(){ load(true); }

buildHead();
load();
