<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — FantasyNow+</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth-pages.css"> 
</head>
<body>
  <div class="login-container">
    <h1>Set a new password</h1>
    <p class="login-sub" id="sub">Choose a new password for your account.</p>

    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit">Update password</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="alt-link"><a href="login">Back to login</a></div>
  </div>

  <script src="javascript/auth.js"></script>
  <script src="javascript/reset-password.js"></script>
</body>
</html>
