<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — FantasyNow+</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container { max-width: 420px; margin: 60px auto; padding: 40px; border: 1px solid #FFA515; border-radius: 8px; background: #f9f7f4; }
    .login-container h1 { color: #06192b; margin-bottom: 10px; text-align: center; }
    .login-sub { color: #555; font-size: 14px; text-align: center; margin-bottom: 26px; line-height: 1.5; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #06192b; font-size: 14px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; font-family: inherit; }
    input:focus { outline: none; border-color: #e26f0f; box-shadow: 0 0 0 2px rgba(226,111,15,0.1); }
    button { width: 100%; padding: 12px; background: #FFA515; color: #fff; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 16px; transition: background 0.2s; }
    button:hover { background: #ED9405; }
    .msg { margin-top: 14px; font-size: 14px; padding: 10px; border-radius: 4px; display: none; }
    .msg.show { display: block; }
    .msg.error { color: #dc2626; background: #fee2e2; }
    .msg.success { color: #16a34a; background: #dcfce7; }
    .alt-link { text-align: center; margin-top: 20px; font-size: 14px; color: #06192b; }
    .alt-link a { color: #FFA515; font-weight: 600; text-decoration: none; }
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Set a new password</h1>
    <p class="login-sub" id="sub">Choose a new password for your account.</p>

    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit">Update password</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="alt-link"><a href="login.html">Back to login</a></div>
  </div>

  <script src="javascript/auth.js"></script>
  <script>
    function hashParams() {
      var h = (location.hash || '').replace(/^#/, '');
      var out = {};
      h.split('&').forEach(function (p) {
        var i = p.indexOf('=');
        if (i > -1) out[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1));
      });
      return out;
    }

    var params = hashParams();
    var accessToken = params.access_token;
    var isRecovery = params.type === 'recovery' && !!accessToken;

    var form = document.getElementById('reset-form');
    var msg = document.getElementById('msg');
    var sub = document.getElementById('sub');

    if (!isRecovery) {
      form.style.display = 'none';
      sub.textContent = 'This reset link is invalid or has expired.';
      msg.textContent = 'Request a new link from the reset password page.';
      msg.className = 'msg show error';
      var back = document.querySelector('.alt-link');
      back.innerHTML = '<a href="forgot-password.html">Request a new link</a>';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = form.querySelector('button');
      var pw = document.getElementById('password').value;
      var confirm = document.getElementById('confirm').value;
      msg.className = 'msg';
      if (pw !== confirm) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'msg show error';
        return;
      }
      btn.classList.add('loading');
      try {
        await auth.setNewPassword(accessToken, pw);
        form.style.display = 'none';
        sub.textContent = 'Your password has been updated.';
        msg.textContent = 'You can now log in with your new password.';
        msg.className = 'msg show success';
      } catch (err) {
        msg.textContent = err.message || 'Could not update password. The link may have expired.';
        msg.className = 'msg show error';
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
