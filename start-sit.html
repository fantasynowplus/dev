---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantasyNow+ Start/Sit Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --stream-bg:#001738;
    --header-bg:#002863;
    --panel:rgba(255,255,255,.035);
    --panel-hi:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.09);
    --orange:#FFA515;
    --aqua:#42F4B0;
    --redorange:#EA4E3D;
    --text:#EAF1FF;
    --muted:#8FA4C6;

    --QB:#EA4E3D; --RB:#42F4B0; --WR:#3DA5EA; --TE:#FFA515;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:var(--stream-bg)}
  body{
    background:var(--stream-bg);
    color:var(--text);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-variant-numeric:tabular-nums;
  }

  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 64px}

  /* ---------- topbar (matches weekly-rankings) ---------- */
  .topbar{
    display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px;margin-right:auto}
  .brand img{height:42px;width:auto;display:block}
  .brand .report-title{
    font-family:"Oswald";font-weight:600;text-transform:uppercase;
    letter-spacing:.12em;font-size:16px;color:#fff;
    padding-left:16px;border-left:1px solid var(--line);
  }
  .title{
    font-family:"Oswald";font-weight:600;text-transform:uppercase;
    letter-spacing:.16em;font-size:13px;color:var(--muted);margin-top:6px;
  }
  .title .pos{color:var(--orange)}

  .toggle{display:inline-flex;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:5px}
  .toggle button{
    font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    font-size:14px;color:var(--muted);background:transparent;border:0;cursor:pointer;
    padding:8px 20px;border-radius:999px;transition:color .15s, background .15s;
  }
  .toggle button.active{background:var(--orange);color:#04122b}
  .toggle button:not(.active):hover{color:#fff}
  .toggle button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

  .meta{display:flex;align-items:center;gap:14px;margin-top:6px}
  .updated{font-size:12px;color:var(--muted)}
  .refresh{background:transparent;border:1px solid var(--line);color:var(--muted);
    font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer}
  .refresh:hover{color:#fff;border-color:var(--muted)}
  .oplamp{display:none;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:#04122b;background:var(--aqua);padding:4px 10px;border-radius:999px}
  body.op .oplamp{display:inline-block}

  /* ---------- duel ---------- */
  .duel{display:grid;grid-template-columns:1fr 150px 1fr;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}

  .side{position:relative;padding:32px 30px 26px;display:flex;flex-direction:column;
    min-height:430px;overflow:hidden;transition:background .25s}
  .side .logo{position:absolute;top:-40px;width:340px;height:340px;object-fit:contain;
    opacity:.08;pointer-events:none}
  .side.a .logo{right:-70px}
  .side.b .logo{left:-70px}
  .side.win{background:linear-gradient(180deg,rgba(66,244,176,.12),transparent 65%)}
  .side.lose{opacity:.45}

  .idrow{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
  .side.b .idrow{flex-direction:row-reverse;text-align:right}
  .shot{width:118px;height:118px;flex:0 0 118px;border-radius:50%;
    background:rgba(255,255,255,.05);border:2px solid var(--line);
    object-fit:cover;object-position:top center}
  .pname{font-family:"Oswald";font-weight:600;font-size:40px;line-height:1.02;margin:0;color:#fff}
  .pmeta{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin:8px 0 0}
  .opp{display:inline-block;margin-top:10px;font-family:"Oswald";font-weight:600;font-size:16px;
    letter-spacing:.1em;text-transform:uppercase;color:#fff;
    background:var(--panel-hi);border:1px solid var(--line);padding:5px 13px;border-radius:8px}

  .stats{display:flex;gap:9px;margin-top:22px;position:relative;z-index:1;flex-wrap:wrap}
  .side.b .stats{justify-content:flex-end}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 12px;min-width:76px;text-align:center}
  .chip b{display:block;font-family:"Oswald";font-weight:600;font-size:20px;color:#fff}
  .chip span{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-top:3px}

  .dvp{margin-top:16px;position:relative;z-index:1;font-size:13px;color:var(--muted);line-height:1.5}
  .side.b .dvp{text-align:right}
  .dvp b{color:#fff}
  .dvp .rk{font-weight:800;padding:2px 7px;border-radius:5px;margin-left:7px;font-size:12px}
  .dvp .rk.soft{background:rgba(66,244,176,.16);color:var(--aqua)}
  .dvp .rk.tough{background:rgba(234,78,61,.18);color:#ff8b7d}
  .dvp .rk.mid{background:rgba(255,165,21,.16);color:var(--orange)}

  .final{position:absolute;bottom:24px;font-family:"Oswald";font-weight:700;font-size:52px;
    line-height:1;z-index:1;color:var(--muted)}
  .side.a .final{right:30px}
  .side.b .final{left:30px}
  .side.win .final{color:var(--aqua)}

  .picks{margin-top:auto;padding-top:22px;display:flex;gap:9px;flex-wrap:wrap;
    align-items:center;position:relative;z-index:1;min-height:44px}
  .side.b .picks{justify-content:flex-end}
  .abadge{font-family:"Oswald";font-weight:600;font-size:17px;letter-spacing:.1em;
    text-transform:uppercase;background:var(--orange);color:#04122b;
    padding:8px 16px;border-radius:8px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .crowd{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:10px;
    width:100%;position:relative;z-index:1}
  .side.b .crowd{justify-content:flex-end}
  .av{width:30px;height:30px;border-radius:50%;background:var(--panel-hi);
    border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#cfe0fb}
  .crowd-n{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  .opbar{display:none;gap:8px;margin-top:14px;position:relative;z-index:2;flex-wrap:wrap}
  .side.b .opbar{justify-content:flex-end}
  body.op .opbar{display:flex}
  .opbtn{font-family:"Oswald";font-weight:600;font-size:14px;letter-spacing:.1em;
    text-transform:uppercase;background:transparent;color:var(--muted);
    border:1px solid var(--line);padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s}
  .opbtn:hover{color:#fff;border-color:var(--muted)}
  .opbtn.on{background:var(--aqua);border-color:var(--aqua);color:#04122b}
  .opbtn:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#000E22;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:20px 8px}
  .vs{font-family:"Oswald";font-weight:700;font-size:30px;letter-spacing:.06em;color:var(--orange)}
  .posmark{font-family:"Oswald";font-weight:700;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;padding:5px 12px;border-radius:999px;color:#04122b}
  .waiting{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);text-align:center;line-height:1.6}

  .scroller{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
  table{border-collapse:collapse;width:100%}
  thead th{position:sticky;top:0;background:var(--header-bg);border-bottom:2px solid var(--orange);
    padding:12px 14px;font-family:"Oswald";font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;font-size:12px;color:var(--muted);text-align:center}
  thead th.who{text-align:left;padding-left:18px}
  tbody td{padding:11px 14px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);
    font-size:16px;color:#D8E3F7}
  tbody td.who{text-align:left;padding-left:18px;font-family:"Oswald";font-weight:600;
    font-size:21px;color:#fff}
  tbody tr:hover td{background:rgba(255,255,255,.035)}
  tbody tr.analyst td.who{color:var(--orange)}
  tbody td.pct{color:var(--aqua);font-weight:700}

  .state{padding:70px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6}
  .state b{color:#fff}
  [hidden]{display:none!important}

  @media (max-width:900px){
    .duel{grid-template-columns:1fr}
    .center{flex-direction:row;border-left:0;border-right:0;
      border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px}
    .side{min-height:0;padding:24px 20px}
    .side.b .idrow{flex-direction:row;text-align:left}
    .side.b .stats,.side.b .picks,.side.b .crowd,.side.b .opbar{justify-content:flex-start}
    .side.b .dvp{text-align:left}
    .pname{font-size:30px}
    .final{position:static;margin-top:14px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <img src="assets/logos/fantasynowplus.png" alt="FantasyNow+" onerror="this.remove()">
      <span class="report-title">Start/Sit Showdown</span>
    </div>
    <div>
      <div class="toggle" role="tablist" aria-label="Position">
        <button id="tab-QB" class="active" role="tab" aria-selected="true" onclick="show('QB')">QB</button>
        <button id="tab-RB" role="tab" aria-selected="false" onclick="show('RB')">RB</button>
        <button id="tab-WR" role="tab" aria-selected="false" onclick="show('WR')">WR</button>
        <button id="tab-TE" role="tab" aria-selected="false" onclick="show('TE')">TE</button>
        <button id="tab-ST" role="tab" aria-selected="false" onclick="show('ST')">Standings</button>
      </div>
      <div class="meta">
        <span class="updated" id="updated"></span>
        <button class="refresh" onclick="reload()">Refresh</button>
        <span class="oplamp">Live control</span>
      </div>
    </div>
    <div class="title" id="subTitle">Loading&hellip;</div>
  </div>

  <div id="stage"><div class="state">Loading the board&hellip;</div></div>

</div>

<script src="javascript/auth.js"></script>
<script src="javascript/start-sit.js"></script>
</body>
</html>
