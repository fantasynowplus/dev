---
layout: null
---

{% include header.html %}

<style>
  body {
    background-color: var(--bg-dark) !important;
    color: var(--text-light) !important;
  }

  /* ── Page wrapper ── */
  .fn-feed-page {
    min-height: 100vh;
    background-color: var(--bg-dark);
    padding: 0 0 80px;
  }

  /* ── Orange accent bar ── */
  .fn-feed-bar {
    width: 100%;
    height: 3px;
    background: var(--bright-orange);
    margin-bottom: 0;
  }

  /* ── Hero ── */
  .fn-feed-hero {
    background: linear-gradient(
      180deg,
      rgba(7, 26, 61, 0.85) 0%,
      var(--bg-dark) 100%
    );
    padding: 40px 24px 32px;
    text-align: center;
    position: relative;
  }

  .fn-feed-hero::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      var(--bright-orange),
      transparent
    );
  }

  .fn-feed-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    color: var(--pure-white);
    margin: 0 0 8px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  .fn-feed-title span {
    color: var(--bright-orange);
  }

  .fn-feed-subtitle {
    font-size: 14px;
    color: rgba(244, 244, 244, 0.55);
    margin: 0 0 24px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* ── Subnav Tabs (based on user example) ── */
  .tools-subnav {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tools-subnav button {
    padding: 10px 20px;
    border-radius: 0;
    background: #071a3d;
    color: #9ca3af;
    font-family: 'Barlow Condensed', 'Inter', sans-serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.95rem;
    text-decoration: none;
    border: 1px solid #14294d;
    cursor: pointer;
    transition: 0.2s;
  }
  .tools-subnav button:hover {
    background: #002863;
    color: #fff;
  }
  .tools-subnav button.active {
    background: #002863;
    color: #fff;
    border: 1px solid #ffa515;
  }

  /* ── Tab Content Panels ── */
  .fn-tab-content {
    display: none;
  }
  .fn-tab-content.active {
    display: block;
  }

  /* ── Widget container ── */
  .fn-widget-wrap {
    max-width: 980px;
    margin: 40px auto 0;
    padding: 0 16px;
  }

  /* ── Tallysight CSS variable overrides for Dark Mode Readability ── */
  .fn-widget-wrap span[data-tallysight-widget-type] {
    --background-primary:   #0a0f1a;
    --background-secondary: #071a3d;
    --background-tertiary:  #0d2147;
    --background-accent:    rgba(255, 165, 21, 0.12);

    --text-primary:         #FFFFFF;
    --text-secondary:       #F4F4F4;
    --text-tertiary:        #B0BEC5;
    --text-accent:          #FFA515;

    --border-primary:       #14294d;
    --border-secondary:     rgba(255, 165, 21, 0.2);
    --border-tertiary:      rgba(20, 41, 77, 0.4);
    --border-accent:        #FFA515;

    display: block;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-primary);
    box-shadow:
      0 0 0 1px rgba(255, 165, 21, 0.08),
      0 12px 40px rgba(0, 0, 0, 0.6);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .fn-feed-hero { padding: 28px 16px 24px; }
    .fn-widget-wrap { margin-top: 24px; padding: 0 12px; }
  }
</style>

<div class="fn-feed-page">

  <div class="fn-feed-bar"></div>

  <div class="fn-feed-hero">
    <h1 class="fn-feed-title">Fantasy <span>Now+</span></h1>
    <p class="fn-feed-subtitle">Live analytics, consensus boards, and verified picks</p>
    
    <!-- Tab navigation buttons -->
    <div class="tools-subnav">
      <button class="active" onclick="switchTab('picks', this)">Live Picks</button>
      <button onclick="switchTab('rankings', this)">Rankings</button>
    </div>
  </div>

  <!-- Live Picks Tab Panel -->
  <div id="tab-picks" class="fn-tab-content active">
    <div class="fn-widget-wrap">
      <span
        data-tallysight-widget-type="feed"
        data-tallysight-widget-id="all,all,fantasy-now"
        data-tallysight-widget-config-theme="dark"
      ></span>
    </div>
  </div>

  <!-- Rankings Tab Panel -->
  <div id="tab-rankings" class="fn-tab-content">
    <div class="fn-widget-wrap">
      <!-- Replace YOUR_RANKINGS_WIDGET_ID with your specific rankings/tile widget ID from your Tallysight dashboard -->
      <span
        data-tallysight-widget-type="tile"
        data-tallysight-widget-id="YOUR_RANKINGS_WIDGET_ID"
        data-tallysight-widget-config-theme="dark"
      ></span>
    </div>
  </div>

</div>

<script>
  function switchTab(tabName, btnElement) {
    // Hide all tab contents
    const contents = document.querySelectorAll('.fn-tab-content');
    contents.forEach(content => content.classList.remove('active'));

    // Remove active class from all buttons
    const buttons = document.querySelectorAll('.tools-subnav button');
    buttons.forEach(btn => btn.classList.remove('active'));

    // Show selected tab content and highlight button
    document.getElementById('tab-' + tabName).classList.add('active');
    btnElement.classList.add('active');
  }
</script>
