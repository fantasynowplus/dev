---
layout: null
---

{% include header.html %}

<style>
  /* ── Brand tokens ── */
  :root {
    --fn-orange:        #FFA515;
    --fn-orange-dim:    rgba(255, 165, 21, 0.15);
    --fn-orange-glow:   rgba(255, 165, 21, 0.35);
    --fn-blue-deep:     #002863;
    --fn-blue-mid:      #003580;
    --fn-blue-surface:  #04407a;
    --fn-white:         #FFFFFF;
    --fn-white-muted:   rgba(255, 255, 255, 0.6);
    --fn-white-faint:   rgba(255, 255, 255, 0.15);
  }

  /* ── Full-page dark canvas ── */
  body {
    background-color: var(--fn-blue-deep) !important;
    color: var(--fn-white) !important;
  }

  /* ── Feed page wrapper ── */
  .fn-feed-page {
    min-height: 100vh;
    background-color: var(--fn-blue-deep);
    padding: 0 0 60px;
  }

  /* ── Hero header bar ── */
  .fn-feed-hero {
    background: linear-gradient(
      135deg,
      var(--fn-blue-deep) 0%,
      var(--fn-blue-mid) 60%,
      var(--fn-blue-surface) 100%
    );
    border-bottom: 3px solid var(--fn-orange);
    padding: 36px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* Subtle radial glow behind the label */
  .fn-feed-hero::before {
    content: "";
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 200px;
    background: radial-gradient(ellipse, var(--fn-orange-glow) 0%, transparent 70%);
    pointer-events: none;
  }

  .fn-feed-eyebrow {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fn-orange);
    background: var(--fn-orange-dim);
    border: 1px solid var(--fn-orange-glow);
    border-radius: 4px;
    padding: 4px 12px;
    margin-bottom: 12px;
  }

  .fn-feed-title {
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 700;
    color: var(--fn-white);
    margin: 0 0 8px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .fn-feed-title span {
    color: var(--fn-orange);
  }

  .fn-feed-subtitle {
    font-size: 14px;
    color: var(--fn-white-muted);
    margin: 0;
    font-weight: 400;
  }

  /* ── Live indicator pill ── */
  .fn-live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fn-orange);
    margin-top: 14px;
  }

  .fn-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--fn-orange);
    animation: fn-pulse 1.8s ease-in-out infinite;
  }

  @keyframes fn-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.75); }
  }

  /* ── Widget container ── */
  .fn-widget-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 16px 0;
  }

  /* ── Tallysight CSS variable overrides (dark mode) ── */
  .fn-widget-wrap span
[data-tallysight-widget-type] {
    --background-primary:   #002863;
    --background-secondary: #003580;
    --background-tertiary:  #04407a;
    --background-accent:    rgba(255, 165, 21, 0.12);

    --text-primary:         #FFFFFF;
    --text-secondary:       rgba(255, 255, 255, 0.65);
    --text-tertiary:        rgba(255, 255, 255, 0.35);
    --text-accent:          #FFA515;

    --border-primary:       rgba(255, 255, 255, 0.12);
    --border-secondary:     rgba(255, 255, 255, 0.07);
    --border-tertiary:      rgba(255, 255, 255, 0.04);
    --border-accent:        #FFA515;

    display: block;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.07),
      0 8px 32px rgba(0, 0, 0, 0.45);
  }

  /* ── Responsive tweaks ── */
  @media (max-width: 600px) {
    .fn-feed-hero {
      padding: 28px 16px 22px;
    }
    .fn-widget-wrap {
      padding: 20px 12px 0;
    }
  }
</style>

<div class="fn-feed-page">

  <!-- Hero -->
  <div class="fn-feed-hero">
    <div class="fn-feed-eyebrow">Fantasy Now+</div>
    <h1 class="fn-feed-title">Fantasy <span>Feed</span></h1>
    <p class="fn-feed-subtitle">Rankings, trends, and tools — updated live, no fluff.</p>
    <div class="fn-live-badge">
      <span class="fn-live-dot"></span>
      Live Updates
    </div>
  </div>

  <!-- Tallysight Widget -->
  <div class="fn-widget-wrap">
    <span
      data-tallysight-widget-type="feed"
      data-tallysight-widget-id="all,all,fantasy-now"
    ></span>
  </div>

</div>
