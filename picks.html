---
layout: null
---

{% include header.html %}

<style>
  /* ── Use your existing CSS variables ── */
  body {
    background-color: var(--bg-dark) !important;
    color: var(--text-light) !important;
  }

  /* ── Feed page wrapper ── */
  .fn-feed-page {
    min-height: 100vh;
    background-color: var(--bg-dark);
    padding: 0 0 80px;
  }

  /* ── Orange accent bar ── */
  .fn-feed-bar {
    width: 100%;
    height: 3px;
    background: var(--bright-orange);
    margin-bottom: 0;
  }

  /* ── Hero ── */
  .fn-feed-hero {
    background: linear-gradient(
      180deg,
      rgba(7, 26, 61, 0.85) 0%,
      var(--bg-dark) 100%
    );
    padding: 40px 24px 32px;
    text-align: center;
    position: relative;
  }

  .fn-feed-hero::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      var(--bright-orange),
      transparent
    );
  }

  .fn-feed-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    color: var(--pure-white);
    margin: 0 0 8px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  .fn-feed-title span {
    color: var(--bright-orange);
  }

  .fn-feed-subtitle {
    font-size: 14px;
    color: rgba(244, 244, 244, 0.55);
    margin: 0;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* ── Live badge ── */
  .fn-live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--bright-orange);
    margin-top: 16px;
  }

  .fn-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bright-orange);
    animation: fn-pulse 1.8s ease-in-out infinite;
  }

  @keyframes fn-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.35; transform: scale(0.7); }
  }

  /* ── Widget container ── */
  .fn-widget-wrap {
    max-width: 980px;
    margin: 40px auto 0;
    padding: 0 16px;
  }

  /* ── Tallysight CSS variable overrides for Dark Mode Readability ── */
  .fn-widget-wrap span[data-tallysight-widget-type] {
    --background-primary:   #0a0f1a;
    --background-secondary: #071a3d;
    --background-tertiary:  #0d2147;
    --background-accent:    rgba(255, 165, 21, 0.12);

    --text-primary:         #FFFFFF;
    --text-secondary:       #F4F4F4;
    --text-tertiary:        #B0BEC5;
    --text-accent:          #FFA515;

    --border-primary:       #14294d;
    --border-secondary:     rgba(255, 165, 21, 0.2);
    --border-tertiary:      rgba(20, 41, 77, 0.4);
    --border-accent:        #FFA515;

    display: block;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-primary);
    box-shadow:
      0 0 0 1px rgba(255, 165, 21, 0.08),
      0 12px 40px rgba(0, 0, 0, 0.6);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .fn-feed-hero { padding: 28px 16px 24px; }
    .fn-widget-wrap { margin-top: 24px; padding: 0 12px; }
  }
</style>

<div class="fn-feed-page">

  <div class="fn-feed-bar"></div>

  <div class="fn-feed-hero">
    <h1 class="fn-feed-title">Picks <span>Feed</span></h1>
    <p class="fn-feed-subtitle">Moneyline, spread, and over/unders</p>
    <div class="fn-live-badge">
      <span class="fn-live-dot"></span>
      Live Updates
    </div>
  </div>

  <div class="fn-widget-wrap">
    <span
      data-tallysight-widget-type="feed"
      data-tallysight-widget-id="all,all,fantasy-now"
      data-tallysight-widget-config-theme="dark"
    ></span>
  </div>

</div>
