---
layout: null
---

{% include header.html css="picks" %}


<div class="fn-feed-page">

  <div class="fn-feed-bar"></div>

  <div class="fn-feed-hero">
    <h1 class="fn-feed-title">Fantasy <span>Now+</span></h1>
    <p class="fn-feed-subtitle">Live analytics, consensus boards, and verified picks</p>
    
    <div class="tools-subnav" style="display: none;">
      <button class="active" onclick="switchTab('picks', this)">Live Picks</button>
      <button onclick="switchTab('rankings', this)">Rankings</button>
    </div>
  </div>

  <div id="tab-picks" class="fn-tab-content active">
    <div class="fn-widget-wrap">
      <span
        data-tallysight-widget-type="feed"
        data-tallysight-widget-id="all,all,fantasy-now"
        data-tallysight-widget-config-theme="dark"
        data-tallysight-widget-loading="eager"
      ></span>
    </div>
  </div>

  <div id="tab-rankings" class="fn-tab-content">
    <div class="fn-widget-wrap" id="rankings-wrap">
      <span
        id="rankings-widget"
        data-tallysight-widget-type="tile"
        data-tallysight-widget-id="all,all,fantasy-now"
        data-tallysight-widget-config-theme="dark"
        data-tallysight-widget-loading="eager"
      ></span>
    </div>
  </div>

</div>

<script>
  function switchTab(tabName, btnElement) {
    const contents = document.querySelectorAll('.fn-tab-content');
    contents.forEach(content => content.classList.remove('active'));

    const buttons = document.querySelectorAll('.tools-subnav button');
    buttons.forEach(btn => btn.classList.remove('active'));

    const targetTab = document.getElementById('tab-' + tabName);
    targetTab.classList.add('active');
    btnElement.classList.add('active');

    const widget = targetTab.querySelector('[data-tallysight-widget-type]');
    if (widget && window.Tallysight && typeof window.Tallysight.init === 'function') {
      window.Tallysight.init();
    }

    window.dispatchEvent(new Event('resize'));
  }
</script>
