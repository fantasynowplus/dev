---
layout: null
---
{% include show-header.html title="FantasyNow+ Consensus Rankings" css="weekly-rankings" %}
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <img src="assets/logos/fantasynowplus.png" alt="FantasyNow+" onerror="this.remove()">
      <span class="report-title">Weekly Rankings Report</span>
    </div>
    <div>
      <div class="toggle" role="tablist" aria-label="Position">
        <button id="tab-RB" class="active" role="tab" aria-selected="true" onclick="show('RB')">RB</button>
        <button id="tab-WR" role="tab" aria-selected="false" onclick="show('WR')">WR</button>
      </div>
      <div class="meta">
        <span class="updated" id="updated"></span>
        <button class="refresh" onclick="reload()">Refresh</button>
      </div>
    </div>
    <div class="title">Consensus Redraft &middot; <span class="pos" id="posLabel">RB</span></div>
  </div>

  <div class="scroller">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"><tr><td class="state">Loading rankings&hellip;</td></tr></tbody>
    </table>
  </div>

</div>

<script src="javascript/weekly-rankings.js"></script>
</body>
</html>
