<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FantasyNow+ | Bet Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/bets-board.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <img src="assets/logos/fantasynowplus.png" alt="FantasyNow+">
      <div class="bt">Beat the <span>Bookie</span></div>
    </div>
    <div class="toggle" id="tabs">
      <button data-tab="card" class="on">This Week</button>
      <button data-tab="season">Season</button>
      <button data-tab="board">Leaderboard</button>
    </div>
      <div class="meta">
        <label class="wkpick">Week <select id="weekSel"></select></label>
        <span id="updated">—</span><button id="refresh">Refresh</button>
    </div>
  </div>
  <div class="title" id="subtitle">Loading…</div>
  <div id="stage"><div class="state">Loading the card…</div></div>
</div>
<script src="javascript/auth.js"></script>
<script src="javascript/bets-board.js"></script>
</body>
</html>
