---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FantasyNow+ | Bet Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stream-bg:#001738; --header-bg:#002863; --panel:#0a2450; --line:#123566;
  --orange:#FFA515; --aqua:#42F4B0; --red:#EA4E3D; --muted:#8FA8CC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--stream-bg);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1760px;margin:0 auto;padding:24px 28px 40px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:52px;width:auto;display:block}
.brand .bt{font-family:Oswald,sans-serif;font-size:30px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.brand .bt span{color:var(--orange)}

.toggle{display:flex;gap:8px;background:rgba(0,0,0,.22);padding:6px;border-radius:999px}
.toggle button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:9px 20px;border-radius:999px;cursor:pointer;letter-spacing:.02em}
.toggle button:hover{color:#fff}
.toggle button.on{background:var(--orange);color:#001738}

.meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
.meta button{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer}
.meta button:hover{border-color:var(--orange);color:var(--orange)}
.title{font-family:Oswald,sans-serif;font-size:19px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:20px 0 14px}

/* ---- summary strip ---- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.scard .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scard .v{font-family:Oswald,sans-serif;font-size:42px;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.scard .s{font-size:13px;color:var(--muted);margin-top:2px}
.up{color:var(--aqua)} .down{color:var(--red)}

/* ---- bet rows ---- */
.bets{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}
.bet{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:15px 18px;display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center}
.bet.win{border-left-color:var(--aqua);background:linear-gradient(90deg,rgba(66,244,176,.10),transparent 55%),var(--panel)}
.bet.loss{border-left-color:var(--red);opacity:.62}
.bet.push{border-left-color:var(--muted)}
.bet.pending{border-left-color:var(--orange)}
.bet .who{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.bet .desc{font-family:Oswald,sans-serif;font-size:25px;font-weight:500;line-height:1.24;margin-top:3px}
.bet .sub{font-size:13px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bet .sub b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:4px;height:4px;border-radius:50%;background:var(--line);display:inline-block}
.right{text-align:right}
.odds{font-family:Oswald,sans-serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.net{font-size:16px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:6px}
.tag.pending{background:rgba(255,165,21,.18);color:var(--orange)}
.tag.win{background:rgba(66,244,176,.18);color:var(--aqua)}
.tag.loss{background:rgba(234,78,61,.18);color:var(--red)}
.tag.push{background:rgba(143,168,204,.16);color:var(--muted)}
.tag.void{background:rgba(143,168,204,.12);color:var(--muted)}

/* ---- leaderboard ---- */
.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:2px solid var(--line)}
.lb td{padding:16px;border-bottom:1px solid var(--line);font-size:22px}
.lb .rank{font-family:Oswald,sans-serif;font-size:26px;color:var(--muted);width:56px}
.lb tr:nth-child(1) .rank{color:var(--orange)}
.lb .nm{font-family:Oswald,sans-serif;font-size:26px;font-weight:500}
.lb .r{text-align:right}
.lb .big{font-family:Oswald,sans-serif;font-size:28px;font-weight:600}

.state{padding:60px 20px;text-align:center;color:var(--muted);font-size:17px}
@media (max-width:1100px){.strip{grid-template-columns:repeat(2,1fr)}.bets{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <img src="assets/logos/fantasynowplus.png" alt="FantasyNow+">
      <div class="bt">Bet <span>Card</span></div>
    </div>
    <div class="toggle" id="tabs">
      <button data-tab="card" class="on">This Week</button>
      <button data-tab="season">Season</button>
      <button data-tab="board">Leaderboard</button>
    </div>
    <div class="meta"><span id="updated">—</span><button id="refresh">Refresh</button></div>
  </div>
  <div class="title" id="subtitle">Loading…</div>
  <div id="stage"><div class="state">Loading the card…</div></div>
</div>
<script src="javascript/auth.js"></script>
<script src="javascript/bets-board.js"></script>
</body>
</html>
