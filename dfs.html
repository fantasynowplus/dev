---
layout: null
---
{% include show-header.html title="FantasyNow+ DFS Lineup Builder" css="dfs" %}
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <img src="assets/logos/fantasynowplus.png" alt="FantasyNow+" onerror="this.remove()">
      <span class="report-title">DFS Lineup Builder</span>
    </div>
    <div class="toggle-row">
      <div class="toggle" role="tablist" aria-label="Contest type">
        <button id="type-classic" class="active" role="tab" aria-selected="true" onclick="setType('classic')">Classic</button>
        <button id="type-showdown" role="tab" aria-selected="false" onclick="setType('showdown')">Showdown</button>
      </div>
    </div>
    <div class="title"><span class="pos" id="slateSummary">&mdash;</span></div>
  </div>

  <div class="meta">
    <label class="slatepick">Slate
      <select id="slateSel" onchange="onSlateChange()"></select>
    </label>
    <span class="updated" id="updated"></span>
    <button class="refresh" onclick="reload()">Refresh</button>
  </div>

  <div class="filters">
    <div class="field">
      <label for="posFilter">Position</label>
      <select class="pick" id="posFilter" onchange="draw()">
        <option value="ALL">All</option>
        <option value="QB">QB</option>
        <option value="RB">RB</option>
        <option value="WR">WR</option>
        <option value="TE">TE</option>
        <option value="DST">DST</option>
      </select>
    </div>
    <div class="field">
      <label for="gameFilter">Game</label>
      <select class="pick" id="gameFilter" onchange="draw()">
        <option value="ALL">All Games</option>
      </select>
    </div>
    <div class="field search">
      <label for="q">Search</label>
      <input id="q" type="search" placeholder="Player or team" autocomplete="off" oninput="draw()">
    </div>
    <div class="field salary">
      <label>Salary <span class="val" id="salVal">&mdash;</span></label>
      <div class="dualrange">
        <input type="range" id="salMin" oninput="onSalaryRange()">
        <input type="range" id="salMax" oninput="onSalaryRange()">
      </div>
    </div>
    <div class="field ownpills">
      <label>Ownership</label>
      <div class="toggle" role="tablist" aria-label="Ownership tier">
        <button data-tier="ALL" class="active" role="tab" aria-selected="true" onclick="setOwnFilter('ALL')">All</button>
        <button data-tier="chalk" role="tab" aria-selected="false" onclick="setOwnFilter('chalk')">Chalk</button>
        <button data-tier="moderate" role="tab" aria-selected="false" onclick="setOwnFilter('moderate')">Moderate</button>
        <button data-tier="low" role="tab" aria-selected="false" onclick="setOwnFilter('low')">Low-Owned</button>
        <button data-tier="contrarian" role="tab" aria-selected="false" onclick="setOwnFilter('contrarian')">Contrarian</button>
      </div>
    </div>
    <button class="reset" onclick="clearRoster()">Clear roster</button>
  </div>

  <div class="board">
    <div class="playerpane">
      <p class="count" id="count"></p>
      <div class="scroller">
        <table>
          <thead>
            <tr>
              <th class="pos">Pos</th><th class="player">Player</th><th>Team</th><th>Opp</th>
              <th>Salary</th><th>Proj</th><th>Own%</th><th class="act"></th>
            </tr>
          </thead>
          <tbody id="body"><tr><td class="state" colspan="8">Loading players&hellip;</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="rosterpane">
      <div class="rosterhead">
        <div class="rtitle">Your Roster</div>
        <div class="capnums"><span id="capUsed">$0</span> <span class="capof">of</span> <span id="capTotal">$50,000</span></div>
        <div class="capfill"><div id="capBar"></div></div>
      </div>
      <div id="rosterSlots"></div>
    </div>
  </div>

</div>

<div class="backdrop" id="backdrop" onclick="if(event.target===this) closeCard()">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardName">
    <div class="cardtop">
      <div class="shot"><img id="cardShot" alt=""><span class="initials" id="cardInitials"></span></div>
      <div class="who">
        <h2 id="cardName">&nbsp;</h2>
        <div class="sub" id="cardSub"></div>
      </div>
      <button class="closex" onclick="closeCard()" aria-label="Close">&times;</button>
    </div>
    <div class="ranks" id="cardRanks"></div>
    <div class="logwrap">
      <div class="logtitle">Season Log</div>
      <div class="logscroll"><table class="log">
        <thead id="cardLogHead"><tr><th class="wk">Wk</th><th>Opp</th><th class="pts">Pts</th></tr></thead>
        <tbody id="cardLog"><tr><td class="state" colspan="3">Loading&hellip;</td></tr></tbody>
      </table></div>
    </div>
    <div class="cardaction">
      <button class="addbtn big" id="cardActionBtn" onclick="toggleFromCard()"></button>
    </div>
  </div>
</div>

<script src="javascript/auth.js"></script>
<script src="javascript/dfs.js"></script>
</body>
</html>
