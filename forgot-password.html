<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — FantasyNow+</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth-pages.css">
</head>
<body>
  <div class="login-container">
    <h1>Reset your password</h1>
    <p class="login-sub">Enter your account email and we'll send you a link to set a new password. Played in Super League? Use the same email you registered there.</p>
    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit">Send reset link</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="alt-link"><a href="login">Back to login</a></div>
  </div>

  <script src="javascript/auth.js"></script>
  <script>
    var form = document.getElementById('forgot-form');
    var msg = document.getElementById('msg');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = form.querySelector('button');
      var email = document.getElementById('email').value.trim();
      var redirectTo = new URL('reset-password.html', location.href).href;
      msg.className = 'msg';
      btn.classList.add('loading');
      try {
        await auth.requestPasswordReset(email, redirectTo);
        msg.textContent = 'Check your email for a link to reset your password. It may take a minute to arrive.';
        msg.className = 'msg show success';
        form.querySelector('input').value = '';
      } catch (err) {
        msg.textContent = err.message || 'Something went wrong. Please try again.';
        msg.className = 'msg show error';
      } finally {
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
