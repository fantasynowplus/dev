<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — FantasyNow+</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth-pages.css">
</head>
<body>
  <div class="login-container">
    <h1>Reset your password</h1>
    <p class="login-sub">Enter your account email and we'll send you a link to set a new password. Played in Super League? Use the same email you registered there.</p>
    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit">Send reset link</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="alt-link"><a href="login">Back to login</a></div>
  </div>

  <script src="javascript/auth.js"></script>
  <script src="javascript/forgot-password.js"></script>
</body>
</html>
