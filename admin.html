<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — FantasyNow+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="gate">
  <div class="card">
    <span class="mark">FantasyNow+</span>
    <h1 id="gateTitle">Admin access required</h1>
    <p id="gateMsg">You need to be signed in as an admin to view this portal.</p>
    <div class="gate-login">
      <input id="gEmail" type="email" placeholder="Email" autocomplete="username">
      <input id="gPass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateLogin()">
      <div id="gErr" class="gate-err"></div>
      <button id="gBtn" class="btn" onclick="gateLogin()">Sign in</button>
    </div>
    <a class="gate-alt" href="/">Or sign in on the main site &rarr;</a>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="logo" src="assets/logos/FantasyNow%2B.png" alt="FantasyNow+">
      <div><div style="font-size:14px;font-weight:800;font-family:'Archivo';color:#fff;line-height:1">STAFF</div>
      <div class="sub">Portal</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">Overview</div>
      <button data-go="dashboard" class="active">Dashboard</button>
      <div class="nav-label">People</div>
      <button data-go="subscribers">Subscribers</button>
      <button data-go="logins">Last Login</button>
      <button class="nav-link" data-go="recruitment" onclick="go('recruitment')">Recruitment</button>
      <button data-go="onboarding">Onboarding</button>
      <button data-go="staff">Staff</button>
      <button data-go="org">Org Chart</button>
      <button data-go="my_onboarding" id="navMyOnboarding" style="display:none">My Onboarding</button>
      <div class="nav-label">Content</div>
      <button data-go="channels">Channels</button>
      <button data-go="shows">Shows</button>
      <button data-go="calendar">Content Calendar</button>
      <button data-go="gamepicks">Game Picks</button>
      <button data-go="startsit">Start/Sit Showdown</button>
      <button data-go="bets">Sports Betting Tracker</button>
      <button data-go="rankings">Rankings Display</button>
      <div class="nav-label">Work</div>
      <button data-go="board">Project Board</button>
      <button data-go="youtube">YouTube Stats</button>
      <button data-go="tools">Tools &amp; links</button>
      <div class="nav-label">Access</div>
      <button data-go="roles">Roles &amp; permissions</button>
    </nav>
    <div class="side-foot">
      <div class="who">
        <div class="avatar" id="meAvatar">?</div>
        <div><div class="name" id="meName">—</div></div>
      </div>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="toast"></div>

<script src="javascript/auth.js"></script>
<script src="javascript/admin-gamepicks-section.js"></script>
<script src="javascript/admin-core.js"></script>
<script src="javascript/admin-shell.js"></script>
<script src="javascript/admin-dashboard.js"></script>
<script src="javascript/admin-roles.js"></script>
<script src="javascript/admin-staff.js"></script>
<script src="javascript/admin-subscribers.js"></script>
<script src="javascript/admin-shows.js"></script>
<script src="javascript/admin-calendar.js"></script>
<script src="javascript/admin-tools.js"></script>
<script src="javascript/admin-bets.js"></script>
<script src="javascript/admin-rankings.js"></script>
<script src="javascript/admin-channels.js"></script>
<script src="javascript/admin-youtube.js"></script>
<script src="javascript/admin-logins.js"></script>
<script src="javascript/admin-startsit.js"></script>
<script src="javascript/admin-board.js"></script>
<script src="javascript/admin-recruitment.js"></script>
<script src="javascript/admin-org.js"></script>
<script src="javascript/admin-onboarding.js"></script>

<script src="javascript/admin-boot.js"></script>
</body>
</html>
