<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — FantasyNow+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002863; --navy-2:#001a42; --navy-3:#0a3a80;
    --orange:#FFA515; --orange-2:#ED9405;
    --white:#ffffff; --paper:#F4F4F4; --ink:#111418; --muted:#606060;
    --line:#e7eaf1; --line-2:#dfe3ec;
    --red:#EA4E3D; --aqua:#42F4B0; --violet:#7C5CFC; --pink:#FF4D8D;
    --yellow:#FFD23F; --sky:#22C3E6; --green:#22C55E;
    --shadow:0 1px 2px rgba(0,40,99,.06), 0 8px 24px rgba(0,40,99,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Archivo',sans-serif;margin:0}
  .mono{font-family:'IBM Plex Mono',monospace}
  a{color:inherit}
  button{font-family:inherit}

  #gate{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;text-align:center;
    background:radial-gradient(120% 120% at 50% -10%, var(--navy-3), var(--navy) 55%, var(--navy-2));
    color:#fff;
  }
  #gate .card{max-width:420px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius);padding:36px 30px;backdrop-filter:blur(6px)}
  #gate h1{font-size:26px;letter-spacing:.02em}
  #gate .mark{display:inline-block;font-family:'Archivo';font-weight:800;font-size:15px;
    letter-spacing:.04em;background:var(--orange);color:var(--navy);padding:6px 12px;border-radius:8px;margin-bottom:18px}
  #gate p{color:#cdd7ea;line-height:1.55;margin:12px 0 22px}
  #gate a.btn{display:inline-block;background:var(--orange);color:var(--navy);font-weight:700;
    text-decoration:none;padding:11px 20px;border-radius:10px}

  #app{display:none;min-height:100vh}

  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:248px;
    background:var(--navy);color:#dbe4f4;display:flex;flex-direction:column;
    border-right:1px solid var(--navy-2);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px}
  .brand .logo{font-family:'Archivo';font-weight:800;font-size:16px;letter-spacing:.03em;
    background:var(--orange);color:var(--navy);padding:6px 11px;border-radius:9px}
  .brand .sub{font-size:11px;color:#8ea3c9;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .nav{flex:1;overflow-y:auto;padding:8px 12px}
  .nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6f86b3;
    padding:16px 12px 8px;font-weight:700}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:#c3d0e8;font-size:14px;font-weight:500;
    padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px;transition:.12s;
  }
  .nav button:hover{background:var(--navy-3);color:#fff}
  .nav button.active{background:var(--orange);color:var(--navy);font-weight:700}
  .nav button .ic{width:18px;height:18px;flex:none}
  .side-foot{border-top:1px solid var(--navy-2);padding:14px 16px}
  .side-foot .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Archivo';flex:none}
  .side-foot .name{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
  .side-foot .lvl{font-size:11px;color:#8ea3c9}
  .logout{width:100%;background:rgba(234,78,61,.14);color:#ffb3ab;border:1px solid rgba(234,78,61,.3);
    padding:8px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .logout:hover{background:var(--red);color:#fff}

  .main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:10;background:rgba(244,244,244,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-2);padding:16px 30px;display:flex;align-items:center;gap:16px;
  }
  .topbar h1{font-size:22px;color:var(--navy);letter-spacing:.01em}
  .topbar .spacer{flex:1}
  .content{padding:26px 30px 60px;max-width:1280px;width:100%}

  .btn{border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
  .btn-primary{background:var(--orange);color:var(--navy)}
  .btn-primary:hover{background:var(--orange-2)}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-navy:hover{background:var(--navy-3)}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line-2)}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c9c4}
  .btn-danger:hover{background:var(--red);color:#fff}
  .btn-sm{padding:6px 11px;font-size:12.5px}
  .btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--orange);outline-offset:2px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .stat .v{font-family:'Archivo';font-weight:800;font-size:34px;color:var(--navy);line-height:1.1;margin-top:6px}
  .stat .bar{height:4px;border-radius:3px;margin-top:14px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:16px;color:var(--navy)}
  .panel-head .spacer{flex:1}
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px}
  @media(max-width:1000px){.grid-2{grid-template-columns:1fr}}

  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:220px;max-width:360px}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;background:#fff}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .count-pill{font-size:12.5px;color:var(--muted);font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);font-weight:600;padding:12px 16px;background:var(--navy);color:#b9c8e6;position:sticky;top:0}
  .panel thead th{background:#f7f8fb;color:var(--muted)}
  tbody td{padding:12px 16px;border-top:1px solid var(--line)}
  tbody tr:hover{background:#fbfcfe}
  td .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .table-wrap{overflow:auto;max-height:none}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    padding:3px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%}
  .chip{display:inline-block;font-size:12px;font-weight:600;color:var(--navy);background:#eef2fb;
    border:1px solid #dde5f6;padding:2px 8px;border-radius:7px;margin:2px 3px 2px 0}

  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .empty h4{font-size:17px;color:var(--navy);margin-bottom:6px}
  .empty p{margin:0 auto 16px;max-width:360px;line-height:1.55;font-size:14px}
  .loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,20,50,.5);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,20,50,.35);
    animation:pop .16s ease}
  .modal.wide{max-width:760px}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:18px;color:var(--navy);flex:1}
  .modal-head .x{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
  .modal-head .x:hover{background:var(--paper);color:var(--ink)}
  .modal-body{padding:22px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 16px 16px}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1 / -1}
  .field label{font-size:12px;font-weight:600;color:var(--navy)}
  .field input,.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .field textarea{resize:vertical;min-height:70px}
  .err{color:var(--red);font-size:13px;font-weight:600;margin-right:auto;align-self:center}
  .pick-list{max-height:340px;overflow-y:auto;border:1px solid var(--line-2);border-radius:11px}
  .pick{display:flex;align-items:center;gap:11px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .pick:last-child{border-bottom:0}
  .pick:hover{background:#fbfcfe}
  .pick input{width:16px;height:16px;accent-color:var(--orange);flex:none}
  .pick .pk-name{font-size:14px;font-weight:600;color:var(--ink)}
  .pick .pk-email{font-size:12.5px;color:var(--muted);margin-left:auto}
  .pk-more,.pk-empty{padding:14px;text-align:center;font-size:13px;color:var(--muted)}
  .linked-dot{color:var(--aqua);font-size:12px;margin-left:5px;cursor:default}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;
    box-shadow:0 12px 30px rgba(0,20,50,.35);opacity:0;pointer-events:none;transition:.22s;z-index:200}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--red)}

  .board-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .board-top select{padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;background:#fff;font-weight:600;color:var(--navy)}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
  .col{background:#eef1f7;border:1px solid var(--line-2);border-radius:14px;min-height:120px;display:flex;flex-direction:column}
  .col.drag-over{outline:2px dashed var(--orange);outline-offset:-2px;background:#fff5e6}
  .col-head{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:13px;color:var(--navy)}
  .col-head .n{margin-left:auto;font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);background:#fff;padding:1px 8px;border-radius:20px;border:1px solid var(--line-2)}
  .col-body{padding:4px 10px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
  .task{background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:12px;cursor:grab;box-shadow:0 1px 2px rgba(0,40,99,.05)}
  .task:hover{border-color:var(--navy-3)}
  .task.dragging{opacity:.5}
  .task .t-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
  .task .t-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .task .t-assignee{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-left:auto}
  .mini-avatar{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-family:'Archivo'}
  .add-task{background:transparent;border:1px dashed var(--line-2);color:var(--muted);border-radius:10px;padding:9px;
    font-size:13px;font-weight:600;cursor:pointer;margin:2px 10px 12px}
  .add-task:hover{border-color:var(--orange);color:var(--navy)}

  .comment{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .comment .body{flex:1}
  .comment .who{font-size:12.5px;font-weight:700;color:var(--navy)}
  .comment .when{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
  .comment p{margin:3px 0 0;font-size:13.5px;line-height:1.5}
  .comment .del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px}
  .comment .del:hover{color:var(--red)}
  .add-comment{display:flex;gap:8px;margin-top:12px}
  .add-comment input{flex:1;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;font-size:14px}

  .yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .yt-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .yt-card h4{font-size:15px;color:var(--navy);margin-bottom:2px}
  .yt-card .yt-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .yt-stats{display:flex;gap:18px;margin-bottom:12px}
  .yt-stats .s .n{font-family:'Archivo';font-weight:800;font-size:22px;color:var(--navy)}
  .yt-stats .s .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .spark{width:100%;height:44px;display:block}

  @media(max-width:820px){
    .sidebar{position:static;width:100%;flex-direction:row;align-items:center;height:auto;overflow:auto}
    .brand{padding:12px 16px}.brand .sub{display:none}
    .nav{display:flex;padding:8px;gap:4px}.nav-label{display:none}
    .nav button{white-space:nowrap;margin:0}
    .side-foot{display:none}
    .main{margin-left:0}
    .form-grid{grid-template-columns:1fr}
  }

  .perm-matrix{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
  .perm-matrix th{background:#f7f8fb;color:var(--muted);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .perm-matrix th:first-child{text-align:left}
  .perm-matrix td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .perm-matrix input{width:17px;height:17px;accent-color:var(--orange)}
  td.pm{white-space:nowrap;text-align:center}
  .pm-on{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;color:var(--green);background:color-mix(in srgb,var(--green) 14%,#fff);border:1px solid color-mix(in srgb,var(--green) 30%,#fff);border-radius:5px;padding:1px 4px;margin:0 1px}
  .pm-off{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;color:#c2c7d0;background:#f4f5f8;border:1px solid #e7eaf1;border-radius:5px;padding:1px 4px;margin:0 1px}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <span class="mark">FN+</span>
    <h1 id="gateTitle">Admin access required</h1>
    <p id="gateMsg">You need to be signed in as an admin to view this portal.</p>
    <a class="btn" href="index.html">Go to site &amp; sign in</a>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">FN+</span>
      <div><div style="font-size:14px;font-weight:800;font-family:'Archivo';color:#fff;line-height:1">Admin</div>
      <div class="sub">Portal</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">Overview</div>
      <button data-go="dashboard" class="active">Dashboard</button>
      <div class="nav-label">People</div>
      <button data-go="staff">Staff</button>
      <button data-go="subscribers">Subscribers</button>
      <div class="nav-label">Content</div>
      <button data-go="shows">Shows</button>
      <button data-go="channels">Channels</button>
      <button data-go="youtube">YouTube Stats</button>
      <div class="nav-label">Work</div>
      <button data-go="board">Project Board</button>
      <div class="nav-label">Access</div>
      <button data-go="roles">Roles &amp; permissions</button>
    </nav>
    <div class="side-foot">
      <div class="who">
        <div class="avatar" id="meAvatar">?</div>
        <div><div class="name" id="meName">—</div><div class="lvl" id="meLvl">—</div></div>
      </div>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="toast"></div>

<script src="javascript/auth.js"></script>
<script>
const GATE_LEVEL = 7;

const NAV_TITLES = {
  dashboard:'Dashboard', staff:'Staff', subscribers:'Subscribers',
  shows:'Shows', channels:'Channels', youtube:'YouTube Stats', board:'Project Board', roles:'Roles & permissions'
};
const STATUS = {
  todo:{label:'To Do',color:'var(--muted)'},
  in_progress:{label:'In Progress',color:'var(--orange)'},
  review:{label:'Review',color:'var(--violet)'},
  done:{label:'Done',color:'var(--green)'},
  blocked:{label:'Blocked',color:'var(--red)'}
};
const PRIORITY = {
  low:{label:'Low',color:'var(--sky)'}, medium:{label:'Medium',color:'var(--muted)'},
  high:{label:'High',color:'var(--orange)'}, urgent:{label:'Urgent',color:'var(--red)'}
};
const ACCENTS = ['var(--violet)','var(--pink)','var(--sky)','var(--green)','var(--yellow)','var(--red)','var(--aqua)','var(--orange)'];

let ME = null;
let ADMINS = [];
let CHANNELS_CACHE = [];

let PERMS = {};
let ROLES = [];
const RESOURCES = {
  staff:'Staff', subscribers:'Subscribers', shows:'Shows',
  channels:'Channels', youtube:'YouTube Stats', board:'Project Board', roles:'Roles & permissions'
};
function can(resource, action){
  if(ME && ME.admin_level >= 9) return true;
  const p = PERMS[resource];
  return !!(p && p[action]);
}
function ifCan(resource, action, html){ return can(resource, action) ? html : ''; }

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name){if(!name)return '?';return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function accentFor(str){let h=0;for(const c of (str||'x'))h=(h*31+c.charCodeAt(0))>>>0;return ACCENTS[h%ACCENTS.length];}
function fmtDate(d){if(!d)return '—';const dt=new Date(d);if(isNaN(dt))return '—';return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function fmtNum(n){return n==null?'—':Number(n).toLocaleString();}
function timeAgo(d){if(!d)return '';const s=(Date.now()-new Date(d))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

function toast(msg,bad){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(bad?' bad':'');setTimeout(()=>t.className='',2600);}

function sbCfg(){
  return {
    url: (typeof SUPABASE_URL!=='undefined')?SUPABASE_URL:'',
    key: (typeof SUPABASE_ANON_KEY!=='undefined')?SUPABASE_ANON_KEY:'',
    token: localStorage.getItem('sb-auth-token')
  };
}
async function api(path, opts){
  opts=opts||{};
  const {url,key,token}=sbCfg();
  const headers=Object.assign({
    'apikey':key,'Authorization':'Bearer '+(token||key),'Content-Type':'application/json'
  }, opts.headers||{});
  const res=await fetch(url+'/rest/v1/'+path, Object.assign({},opts,{headers}));
  if(!res.ok){const txt=await res.text();throw new Error(res.status+' '+txt);}
  if(res.status===204)return null;
  const txt=await res.text();return txt?JSON.parse(txt):null;
}
const dbGet   =(p)=>api(p,{method:'GET'});
const dbPost  =(p,b)=>api(p,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(b)});
const dbPatch =(p,b)=>api(p,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(b)});
const dbDel   =(p)=>api(p,{method:'DELETE'});

function gateMsg(title,msg){
  document.getElementById('gateTitle').textContent=title;
  document.getElementById('gateMsg').textContent=msg;
  document.getElementById('gate').style.display='flex';
  document.getElementById('app').style.display='none';
}
async function waitForConfig(timeout){
  timeout=timeout||5000;const start=Date.now();
  while(Date.now()-start<timeout){
    if(typeof SUPABASE_URL!=='undefined' && typeof SUPABASE_ANON_KEY!=='undefined') return true;
    await new Promise(r=>setTimeout(r,120));
  }
  return false;
}
function decodeJwt(tok){
  try{const seg=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(escape(atob(seg))));}catch(e){return null;}
}

async function boot(){
  if(!(await waitForConfig())){
    gateMsg('Auth didn\'t load',
      'This page couldn\'t find auth.js (SUPABASE_URL is undefined). Check the <script src="javascript/auth.js"> path is right for where admin.html sits, and open it through your site URL — not a local file:// path.');
    return;
  }
  const token = localStorage.getItem('sb-auth-token');
  if(!token){
    gateMsg('Admin access required',
      'No saved session on this page. Sign in on the site, then return here — and make sure both are the same address (same https:// site, not a file:// path).');
    return;
  }
  const claims = (window.auth && auth.user && auth.user.sub) ? auth.user : decodeJwt(token);
  const uid = claims && claims.sub;
  if(!uid){
    gateMsg('Session problem','Your saved sign-in couldn\'t be read. Log out and back in on the site, then return here.');
    return;
  }
  try{
    const rows = await dbGet('profiles?select=*&id=eq.'+uid);
    ME = rows && rows[0];
  }catch(e){
    gateMsg('Couldn\'t verify access','Signed in, but the profile lookup failed: '+e.message);
    return;
  }
  const lvl = ME && ME.admin_level ? ME.admin_level : 0;
  if(!ME){ gateMsg('Admin access required','Found a session but no matching profile row. Log out and back in on the site.'); return; }
  try{ if(ME.role_id){ const r = await dbGet('roles?select=permissions&id=eq.'+ME.role_id); if(r&&r[0]) PERMS = r[0].permissions||{}; } }catch(e){ PERMS = {}; }
  if(!(lvl>=9 || Object.keys(RESOURCES).some(k=>can(k,'r')))){
    gateMsg('No access yet','Your account has no dashboard permissions. Ask an owner to assign you a role.');
    return;
  }
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('meName').textContent = ME.name || ME.email || 'Admin';
  document.getElementById('meLvl').textContent = 'Level '+lvl+' admin';
  document.getElementById('meAvatar').textContent = initials(ME.name||ME.email);
  document.getElementById('logoutBtn').onclick = ()=>{ if(window.auth&&auth.logout)auth.logout(); else {localStorage.removeItem('sb-auth-token');location.href='index.html';} };

  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));

  try{ ADMINS = await dbGet('profiles?select=id,name,email&role_id=not.is.null&order=name.asc') || []; }catch(e){ ADMINS=[]; }
  try{ ROLES = await dbGet('roles?select=*&order=name.asc') || []; }catch(e){ ROLES=[]; }
  document.querySelectorAll('#nav button[data-go]').forEach(b=>{
    const k=b.dataset.go;
    if(RESOURCES[k] && !can(k,'r')) b.style.display='none';
  });

  go('dashboard');
}

function go(name){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.go===name));
  document.getElementById('pageTitle').textContent = NAV_TITLES[name] || name;
  document.getElementById('topActions').innerHTML='';
  document.getElementById('content').innerHTML='<div class="loading">Loading…</div>';
  if(RESOURCES[name] && !can(name,'r')){
    document.getElementById('content').innerHTML='<div class="empty"><h4>No access</h4><p>You don\'t have permission to view this section.</p></div>';
    return;
  }
  const fn = {dashboard:loadDashboard, staff:loadStaff, subscribers:loadSubscribers,
    shows:loadShows, channels:loadChannels, youtube:loadYouTube, board:loadBoard, roles:loadRoles}[name];
  fn().catch(err=>{
    document.getElementById('content').innerHTML =
      '<div class="empty"><h4>Couldn\'t load this</h4><p>'+esc(err.message)+'</p></div>';
  });
}

function topAction(html){document.getElementById('topActions').innerHTML=html;}

function badge(text,color){return '<span class="badge" style="color:'+color+';background:color-mix(in srgb,'+color+' 14%,#fff);border:1px solid color-mix(in srgb,'+color+' 30%,#fff)"><span class="dot" style="background:'+color+'"></span>'+esc(text)+'</span>';}

/* ---------------- MODAL ---------------- */
function modal(opts){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML =
    '<div class="modal'+(opts.wide?' wide':'')+'">'+
      '<div class="modal-head"><h3>'+esc(opts.title)+'</h3><button class="x" aria-label="Close">&times;</button></div>'+
      '<div class="modal-body">'+opts.body+'</div>'+
      (opts.footer===false?'':
        '<div class="modal-foot"><span class="err" id="mErr"></span>'+
        '<button class="btn btn-ghost" data-cancel>Cancel</button>'+
        '<button class="btn btn-primary" data-save>'+esc(opts.saveLabel||'Save')+'</button></div>')+
    '</div>';
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('.x').onclick=close;
  bg.addEventListener('click',e=>{if(e.target===bg)close();});
  const cancel=bg.querySelector('[data-cancel]');if(cancel)cancel.onclick=close;
  const saveBtn=bg.querySelector('[data-save]');
  if(saveBtn&&opts.onSave){
    saveBtn.onclick=async()=>{
      const err=bg.querySelector('#mErr');err.textContent='';
      saveBtn.disabled=true;saveBtn.textContent='Saving…';
      try{ await opts.onSave(bg); close(); }
      catch(e){ err.textContent=e.message.length>90?'Save failed — check the fields.':e.message; saveBtn.disabled=false;saveBtn.textContent=opts.saveLabel||'Save'; }
    };
  }
  if(opts.onReady)opts.onReady(bg);
  return {el:bg,close};
}
function val(bg,name){const el=bg.querySelector('[name="'+name+'"]');return el?el.value.trim():'';}
function confirmDelete(what,onYes){
  modal({title:'Delete '+what+'?',body:'<p style="margin:0;line-height:1.5;color:var(--muted)">This can\'t be undone.</p>',
    saveLabel:'Delete',onSave:async()=>{await onYes();}});
}

function roleForm(id){
  const r = id? ROLES.find(x=>x.id===id) : {permissions:{}};
  const perm = r.permissions||{};
  const rows = Object.keys(RESOURCES).map(k=>{
    const p = perm[k]||{};
    return '<tr><td style="font-weight:600">'+RESOURCES[k]+'</td>'+
      ['c','r','u','d'].map(a=>'<td style="text-align:center"><input type="checkbox" data-res="'+k+'" data-act="'+a+'"'+(p[a]?' checked':'')+'></td>').join('')+'</tr>';
  }).join('');
  modal({title:id?'Edit role':'New role',wide:true,saveLabel:id?'Save role':'Create role',
    body:'<div class="form-grid"><div class="field"><label>Role name</label><input name="name" value="'+esc(r.name||'')+'"></div>'+
      '<div class="field"><label>Description</label><input name="description" value="'+esc(r.description||'')+'"></div></div>'+
      '<table class="perm-matrix"><thead><tr><th>Section</th><th>Create</th><th>Read</th><th>Update</th><th>Delete</th></tr></thead><tbody>'+rows+'</tbody></table>',
    onSave:async(bg)=>{
      const name=val(bg,'name'); if(!name) throw new Error('Role name is required');

      const body={name,description:val(bg,'description'),permissions};
      if(id) await dbPatch('roles?id=eq.'+id,body); else await dbPost('roles',body);
      loadRoles(); toast(id?'Role updated':'Role created');
    }});
}
function roleDelete(id){const r=ROLES.find(x=>x.id===id);confirmDelete('the "'+esc(r.name)+'" role',async()=>{

      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>'+
      '<input id="pickSearch" placeholder="Search '+pool.length+' profiles by name or email…"></div>'+
      '<div id="pickList" class="pick-list">'+render(pool)+'</div>',
    onReady:(bg)=>{
      const inp=bg.querySelector('#pickSearch');
      inp.oninput=()=>{const q=inp.value.toLowerCase().trim();
        bg.querySelector('#pickList').innerHTML=render(q?pool.filter(p=>((p.name||'')+' '+(p.email||'')).toLowerCase().includes(q)):pool);};

      const ids=[...bg.querySelectorAll('#pickList input:checked')].map(c=>c.value);

      const rows=ids.map(id=>{const p=pool.find(x=>x.id===id);return {profile_id:id,name:p.name||p.email,email:p.email,is_active:true};});

      STAFF = await dbGet('staff?select=*&order=name.asc')||[];renderStaff('');

async function loadYouTube(){
  topAction(ifCan('youtube','c','<button class="btn btn-primary" onclick="snapshotForm()">+ Add snapshot</button>'));
  const channels = await dbGet('channels?select=id,name,youtube_url&order=name.asc')||[];
  if(!channels.length){document.getElementById('content').innerHTML='<div class="empty"><h4>No channels to track</h4><p>Add a channel first, then record YouTube stats for it here.</p><button class="btn btn-primary" onclick="go(\'channels\')">Go to Channels</button></div>';return;}
  const stats = await dbGet('youtube_stats?select=*&order=fetched_at.asc')||[];
  const byChan={};stats.forEach(s=>{(byChan[s.channel_id]=byChan[s.channel_id]||[]).push(s);});
  document.getElementById('content').innerHTML =
    '<div class="panel" style="margin-bottom:18px;background:#fff6e6;border-color:#ffe0a6"><div style="padding:14px 18px;font-size:13.5px;color:#7a5300;line-height:1.5">'+
    '<strong>Tip:</strong> add manual snapshots to start tracking today. The next build step is a scheduled job that pulls these numbers automatically from the YouTube Data API — one row per channel per run — so this page charts growth over time.</div></div>'+
    '<div class="yt-grid">'+channels.map(c=>{
      const rows=byChan[c.id]||[];const latest=rows[rows.length-1];
      return '<div class="yt-card"><h4>'+esc(c.name)+'</h4><div class="yt-sub">'+(rows.length?rows.length+' snapshot'+(rows.length===1?'':'s')+' · updated '+timeAgo(latest.fetched_at):'no data yet')+'</div>'+
        (latest?
          '<div class="yt-stats">'+
            '<div class="s"><div class="n">'+fmtNum(latest.subscriber_count)+'</div><div class="l">Subscribers</div></div>'+
            '<div class="s"><div class="n">'+fmtNum(latest.view_count)+'</div><div class="l">Views</div></div>'+
            '<div class="s"><div class="n">'+fmtNum(latest.video_count)+'</div><div class="l">Videos</div></div>'+
          '</div>'+sparkline(rows.map(r=>r.subscriber_count||0))
          : '<p style="font-size:13.5px;color:var(--muted);margin:0 0 4px">No snapshots yet.</p>')+
        '</div>';
    }).join('')+'</div>';
}
function sparkline(vals){
  if(vals.length<2)return '';
  const w=260,h=44,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*w,h-4-((v-min)/rng)*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

  const channels = await dbGet('channels?select=id,name&order=name.asc')||[];
  modal({title:'Add YouTube snapshot',saveLabel:'Save snapshot',
    body:'<div class="form-grid">'+

    '</div>',

function taskCard(t){
  const p=PRIORITY[t.priority]||PRIORITY.medium;
  return '<div class="task" draggable="true" data-id="'+t.id+'" onclick="taskDetail(\''+t.id+'\')">'+

let dragId=null;
function wireDnD(){
  document.querySelectorAll('.task').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('dragging');e.stopPropagation();});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      const st=col.dataset.status;const t=TASKS.find(x=>x.id===dragId);
      if(!t||t.status===st)return;
      t.status=st;
      try{await dbPatch('tasks?id=eq.'+dragId,{status:st,updated_at:new Date().toISOString()});renderBoard();}
      catch(err){toast('Could not move task',true);}
    });
  });
}
