async function guestDelete(id){
  if (!confirm('Delete this guest? They will be removed from any episodes.')) return;
  await dbDel(`guests?id=eq.${id}`);                                    // db call
  toast('Guest deleted');
  loadCalendar();
}

async function guestDetail(id){
  const [rows, apps] = await Promise.all([
    dbGet(`guests?select=*&id=eq.${id}`),
    dbGet(`event_people?select=role,event:content_events(id,title,starts_at,format,show:shows(id,name))&guest_id=eq.${id}`).catch(()=>[])
  ]);
  const g = rows[0];
  if (!g) return toast('Guest not found');
  const list = apps.filter(a=>a.event).sort((a,b)=> new Date(b.event.starts_at) - new Date(a.event.starts_at));
  const m = modal({
    title: g.name,
    footer: false,
    body: `<div>
      ${detailRow('Organization', esc(g.org||'—'))}
      ${detailRow('Handle', esc(g.handle||'—'))}
      ${detailRow('Email', esc(g.email||'—'))}
      ${detailRow('Phone', esc(g.phone||'—'))}
      ${detailRow('Notes', esc(g.notes||'—'))}
      ${detailRow('Appearances', list.length ? list.map(a=>
        `<button class="chip chip-link" onclick="calCloseThen(()=>eventDetail('${a.event.id}'))">${esc(a.event.title||a.event.show?.name||'Episode')} · ${fmtDate(a.event.starts_at)}</button>`).join(' ') : '—')}
      <div class="row-actions" style="margin-top:14px">
        ${ifCan('calendar','u',`<button class="btn btn-primary btn-sm" onclick="calCloseThen(()=>guestForm('${g.id}'))">Edit</button>`)}
      </div>
    </div>`
  });
  window.__calModal = m;
}

/* ---------------- TOOLS & LINKS ---------------- */
let TOOLS=[], TOOL_SHOWS=[], TOOL_DRAFTS=[];
const TOOL_EDITING=new Set();
const TOOL_SELECT='show_tools?select=*,show_links:show_tool_shows(show:shows(id,name))&order=sort_order.asc,name.asc';

if(!window._msWired){window._msWired=true;
  document.addEventListener('mousedown',e=>{ if(!e.target.closest('.ms')) document.querySelectorAll('.ms-panel').forEach(p=>p.style.display='none'); });}

function msField(key,selected){
  const sel=new Set(selected||[]);
  const names=TOOL_SHOWS.filter(s=>sel.has(s.id)).map(s=>s.name);
  return '<div class="ms" data-ms="'+key+'">'+
    '<button type="button" class="ms-btn" onclick="msToggle(this)"><span class="ms-label">'+esc(names.length?names.join(', '):'Select show(s)…')+'</span><span class="ms-caret">&#9662;</span></button>'+
    '<div class="ms-panel">'+(TOOL_SHOWS.length?TOOL_SHOWS.map(s=>'<label class="ms-opt"><input type="checkbox" value="'+s.id+'"'+(sel.has(s.id)?' checked':'')+' onchange="msSync(this)"><span>'+esc(s.name)+'</span></label>').join(''):'<div class="ms-empty">No shows yet — add one in the Shows section.</div>')+'</div></div>';
}
function msToggle(btn){
  const panel=btn.parentElement.querySelector('.ms-panel');
  const wasOpen=panel.style.display==='block';
  document.querySelectorAll('.ms-panel').forEach(p=>p.style.display='none');
  panel.style.display=wasOpen?'none':'block';
}
function msSync(cb){
  const ms=cb.closest('.ms');
  const names=[...ms.querySelectorAll('input:checked')].map(i=>{const s=TOOL_SHOWS.find(x=>x.id===i.value);return s?s.name:'';}).filter(Boolean);
  ms.querySelector('.ms-label').textContent=names.length?names.join(', '):'Select show(s)…';
}
function msValues(row){ return [...row.querySelectorAll('.ms input:checked')].map(i=>i.value); }

async function loadTools(){
  topAction(ifCan('tools','c','<button class="btn btn-primary" onclick="toolAddRow()">+ Add tool</button>'));
  TOOL_SHOWS = await dbGet('shows?select=id,name&order=name.asc')||[];
  TOOLS = await dbGet(TOOL_SELECT)||[];
  TOOL_DRAFTS=[]; TOOL_EDITING.clear();
  renderTools();
}
function renderTools(){
  const c=document.getElementById('content');
  if(!TOOLS.length && !TOOL_DRAFTS.length){
    c.innerHTML='<div class="empty"><h4>No tools yet</h4><p>Add links to pages like the weekly rankings or waiver wire, and tag which show each one belongs to.</p>'+ifCan('tools','c','<button class="btn btn-primary" onclick="toolAddRow()">+ Add tool</button>')+'</div>';
    return;
  }
  c.innerHTML='<div class="panel tool-panel"><div class="panel-head"><h3>Tools &amp; links</h3><span class="count-pill" style="margin-left:auto">'+TOOLS.length+' link'+(TOOLS.length===1?'':'s')+'</span></div>'+

function toolViewRow(t,i){
  const shows=(t.show_links||[]).map(l=>l.show).filter(Boolean);
  return '<div class="tool-row" data-id="'+t.id+'">'+
    '<div class="tr-main">'+
      '<div class="tr-name">'+esc(t.name)+(t.is_active===false?' '+badge('Hidden','var(--muted)'):'')+'</div>'+
      '<a class="tr-url" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.url)+'</a>'+
      (t.description?'<div class="tr-desc">'+esc(t.description)+'</div>':'')+
      '<div class="tr-chips">'+(shows.length?shows.map(s=>'<span class="chip chip-link" onclick=\'viewShow("'+s.id+'")\'>'+esc(s.name)+'</span>').join(''):'<span style="font-size:12.5px;color:var(--muted)">No show assigned</span>')+'</div>'+
    '</div>'+
    '<div class="tr-acts">'+
      ((/start-sit/i.test(t.url||'') && can('startsit','r'))?'<button class="btn btn-primary btn-sm" onclick="go(\'startsit\')">Manage</button>':'')+
      '<a class="btn btn-navy btn-sm" href="'+esc(t.url)+'" target="_blank" rel="noopener">Open</a>'+
      ifCan('tools','u','<button class="btn btn-ghost btn-sm" title="Move up"'+(i===0?' disabled':'')+' onclick=\'toolMove("'+t.id+'",-1)\'>&uarr;</button><button class="btn btn-ghost btn-sm" title="Move down"'+(i===TOOLS.length-1?' disabled':'')+' onclick=\'toolMove("'+t.id+'",1)\'>&darr;</button>')+
      ifCan('tools','u','<button class="btn btn-ghost btn-sm" onclick=\'toolEdit("'+t.id+'")\'>Edit</button>')+
      ifCan('tools','d','<button class="btn btn-danger btn-sm" onclick=\'toolDelete("'+t.id+'")\'>Delete</button>')+
    '</div></div>';
}
function toolEditRow(t,isDraft){
  const key=isDraft?t.key:t.id;
  const sel=isDraft?(t.shows||[]):(t.show_links||[]).map(l=>l.show&&l.show.id).filter(Boolean);
  return '<div class="tool-row editing" '+(isDraft?'data-draft="'+key+'"':'data-id="'+key+'"')+'>'+
    '<div class="tr-fields">'+
      '<input class="tr-in" data-f="name" placeholder="Name — e.g. Weekly Rankings" value="'+esc(t.name||'')+'">'+
      '<input class="tr-in" data-f="url" placeholder="https://fantasynowplus.com/weekly-rankings.html" value="'+esc(t.url||'')+'">'+
      '<input class="tr-in" data-f="description" placeholder="What this link is for" value="'+esc(t.description||'')+'">'+
      msField(key,sel)+
      '<label class="tr-active"><input type="checkbox" data-f="is_active"'+((isDraft||t.is_active!==false)?' checked':'')+'> Active</label>'+
    '</div>'+
    '<div class="tr-acts">'+
      '<button class="btn btn-primary btn-sm" onclick=\''+(isDraft?'toolSaveDraft("'+key+'")':'toolSave("'+key+'")')+'\'>Save</button>'+
      '<button class="btn btn-ghost btn-sm" onclick=\''+(isDraft?'toolCancelDraft("'+key+'")':'toolCancel("'+key+'")')+'\'>Cancel</button>'+
    '</div></div>';
}
function toolCaptureDrafts(){
  TOOL_DRAFTS.forEach(d=>{
    const row=document.querySelector('.tool-row[data-draft="'+d.key+'"]'); if(!row)return;
    d.name=row.querySelector('[data-f="name"]').value;
    d.url=row.querySelector('[data-f="url"]').value;
    d.description=row.querySelector('[data-f="description"]').value;
    d.shows=msValues(row);
  });
}
function toolAddRow(){
  toolCaptureDrafts();
  TOOL_DRAFTS.push({key:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:'',url:'',description:'',shows:[]});
  renderTools();
  setTimeout(()=>{const f=document.querySelectorAll('.tool-row[data-draft] [data-f="name"]');if(f.length)f[f.length-1].focus();},0);
}
function toolEdit(id){ toolCaptureDrafts(); TOOL_EDITING.add(id); renderTools(); }
function toolCancel(id){ toolCaptureDrafts(); TOOL_EDITING.delete(id); renderTools(); }
function toolCancelDraft(key){ toolCaptureDrafts(); TOOL_DRAFTS=TOOL_DRAFTS.filter(d=>d.key!==key); renderTools(); }
function toolRead(row){
  const g=f=>row.querySelector('[data-f="'+f+'"]').value.trim();
  return {name:g('name'),url:g('url'),description:g('description')||null,
    is_active:row.querySelector('[data-f="is_active"]').checked, shows:msValues(row)};
}
async function toolSave(id){
  const row=document.querySelector('.tool-row[data-id="'+id+'"]'); if(!row)return;
  const d=toolRead(row);
  if(!d.name||!d.url){ toast('Name and link are both required',true); return; }
  try{
    await dbPatch('show_tools?id=eq.'+id,{name:d.name,url:d.url,description:d.description,is_active:d.is_active});
    await dbDel('show_tool_shows?tool_id=eq.'+id);
    if(d.shows.length) await dbPost('show_tool_shows', d.shows.map(s=>({tool_id:id,show_id:s})));
    toolCaptureDrafts(); TOOL_EDITING.delete(id);
    TOOLS = await dbGet(TOOL_SELECT)||[];
    renderTools(); toast('Tool saved');
  }catch(e){ toast(e.message,true); }
}
async function toolSaveDraft(key){
  const row=document.querySelector('.tool-row[data-draft="'+key+'"]'); if(!row)return;
  const d=toolRead(row);
  if(!d.name||!d.url){ toast('Name and link are both required',true); return; }
  try{
    const r=await dbPost('show_tools',{name:d.name,url:d.url,description:d.description,is_active:d.is_active,sort_order:TOOLS.length});
    const newId=r[0].id;
    if(d.shows.length) await dbPost('show_tool_shows', d.shows.map(s=>({tool_id:newId,show_id:s})));
    toolCaptureDrafts(); TOOL_DRAFTS=TOOL_DRAFTS.filter(x=>x.key!==key);
    TOOLS = await dbGet(TOOL_SELECT)||[];
    renderTools(); toast('Tool added');
  }catch(e){ toast(e.message,true); }
}
async function toolMove(id,dir){
  const i=TOOLS.findIndex(t=>t.id===id), j=i+dir;
  if(i<0||j<0||j>=TOOLS.length)return;
  const order=TOOLS.slice(); const [m]=order.splice(i,1); order.splice(j,0,m);
  try{
    await Promise.all(order.map((t,k)=>dbPatch('show_tools?id=eq.'+t.id,{sort_order:k})));
    TOOLS = await dbGet(TOOL_SELECT)||[]; renderTools();
  }catch(e){ toast('Could not reorder',true); }
}
function toolDelete(id){
  const t=TOOLS.find(x=>x.id===id);
  confirmDelete(esc(t.name),async()=>{
    await dbDel('show_tools?id=eq.'+id);
    TOOLS=TOOLS.filter(x=>x.id!==id); renderTools(); toast('Tool removed');
  });
}

/* ---------------- YOUTUBE STATS ---------------- */
function ytSwitchTab(btn,paneId){
  const m=btn.closest('.modal');
  m.querySelectorAll('.yt-pane').forEach(p=>p.style.display='none');
  document.getElementById(paneId).style.display='';
  btn.parentElement.querySelectorAll('.yt-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}
function ytHuman(kind,label){
  const traffic={YT_SEARCH:'YouTube search',RELATED_VIDEO:'Suggested videos',BROWSE:'Browse features',NO_LINK_OTHER:'Direct or unknown',NO_LINK_EMBEDDED:'External embeds',PLAYLIST:'Playlists',YT_CHANNEL:'Channel pages',SUBSCRIBER:'Subscriptions feed',EXT_URL:'External sites',NOTIFICATION:'Notifications',SHORTS:'Shorts feed',YT_OTHER_PAGE:'Other YouTube',ADVERTISING:'Advertising',HASHTAGS:'Hashtags',END_SCREEN:'End screens',ANNOTATION:'Cards & end screens'};
  const device={MOBILE:'Mobile',DESKTOP:'Desktop',TABLET:'Tablet',TV:'TV',GAME_CONSOLE:'Game console',UNKNOWN_PLATFORM:'Unknown'};
  const subbed={SUBSCRIBED:'Subscribed',UNSUBSCRIBED:'Not subscribed'};
  if(kind==='traffic')return traffic[label]||label;
  if(kind==='device')return device[label]||label;
  if(kind==='subscribed')return subbed[label]||label;
  if(kind==='age_gender'){const p=label.split('|');return (p[0]||'').replace('age','')+' · '+({male:'M',female:'F',user_specified:'—',gender_other:'Other'}[p[1]]||p[1]);}
  return label;
}
const fmtHours=m=>Math.round((Number(m)||0)/60).toLocaleString();
const fmtDur=s=>{s=Number(s)||0;const m=Math.floor(s/60);return m+':'+String(Math.round(s%60)).padStart(2,'0');};
function sumWindow(daily,days,field){const c=new Date();c.setDate(c.getDate()-days);const cs=c.toISOString().slice(0,10);return daily.filter(r=>r.date>=cs).reduce((a,r)=>a+(Number(r[field])||0),0);}
function netSubs(daily,days){return sumWindow(daily,days,'subs_gained')-sumWindow(daily,days,'subs_lost');}
function metricBlock(label,a,b,c){return '<div class="yt-metric"><div class="m-label">'+label+'</div><div class="m-row"><span>28 days</span><span>'+a+'</span></div><div class="m-row"><span>90 days</span><span>'+b+'</span></div><div class="m-row"><span>365 days</span><span>'+c+'</span></div></div>';}
function barList(items){if(!items.length)return '<div style="color:var(--muted);font-size:13px">No data yet.</div>';const max=Math.max(...items.map(i=>i.value))||1;return '<div class="bar-list">'+items.map(i=>'<div class="bar-row"><div class="b-label" title="'+esc(i.label)+'">'+esc(i.label)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,Math.round(i.value/max*100))+'%'+(i.color?';background:'+i.color:'')+'"></div></div><div class="b-val">'+esc(i.valueLabel!=null?i.valueLabel:fmtNum(i.value))+'</div></div>').join('')+'</div>';}
function lineChart(daily,field,days){const c=new Date();c.setDate(c.getDate()-days);const cs=c.toISOString().slice(0,10);const pts=daily.filter(r=>r.date>=cs).map(r=>Number(r[field])||0);if(pts.length<2)return '<div style="color:var(--muted);font-size:13px;padding:12px 0">Not enough data to chart yet.</div>';const w=560,h=120,min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1,step=w/(pts.length-1);const coords=pts.map((v,i)=>[i*step,h-6-((v-min)/rng)*(h-16)]);const line=coords.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return '<svg class="ytchart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+line+' L '+w+' '+h+' L 0 '+h+' Z" fill="var(--orange)" opacity="0.10"/><path d="'+line+'" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';}

async function channelAnalytics(id){
  document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
  const [chRow,daily,tops,breaks,snap]=await Promise.all([
    dbGet('channels?select=name&id=eq.'+id),
    dbGet('yt_daily?select=date,views,watch_minutes,subs_gained,subs_lost&channel_id=eq.'+id+'&order=date.asc'),
    dbGet('yt_top_videos?select=*&channel_id=eq.'+id+'&order=views.desc'),
    dbGet('yt_breakdowns?select=*&channel_id=eq.'+id),
    dbGet('youtube_stats?select=subscriber_count,view_count,video_count,fetched_at&channel_id=eq.'+id+'&order=fetched_at.desc&limit=1')
  ]);
  const name=(chRow&&chRow[0]&&chRow[0].name)||'Channel', d=daily||[], latest=(snap&&snap[0])||{};
  const byKind=k=>(breaks||[]).filter(b=>b.kind===k);
  const overview='<div class="yt-metrics">'+
    metricBlock('Views',fmtNum(sumWindow(d,28,'views')),fmtNum(sumWindow(d,90,'views')),fmtNum(sumWindow(d,365,'views')))+
    metricBlock('Watch time (hrs)',fmtHours(sumWindow(d,28,'watch_minutes')),fmtHours(sumWindow(d,90,'watch_minutes')),fmtHours(sumWindow(d,365,'watch_minutes')))+
    metricBlock('Subscribers (net)',(netSubs(d,28)>=0?'+':'')+fmtNum(netSubs(d,28)),(netSubs(d,90)>=0?'+':'')+fmtNum(netSubs(d,90)),(netSubs(d,365)>=0?'+':'')+fmtNum(netSubs(d,365)))+'</div>'+
    '<div class="yt-section-title">Views — last 90 days</div>'+lineChart(d,'views',90)+
    '<div class="yt-section-title">Top videos — last 90 days</div>'+
    ((tops&&tops.length)?tops.map((v,i)=>'<div class="topvid"><span class="tv-n">'+(i+1)+'</span><a class="tv-title" href="https://www.youtube.com/watch?v='+encodeURIComponent(v.video_id)+'" target="_blank" rel="noopener" title="'+esc(v.title)+'">'+esc(v.title)+'</a><span class="tv-stat">'+fmtNum(v.views)+' views · '+fmtDur(v.avg_view_duration)+' avg</span></div>').join(''):'<div style="color:var(--muted);font-size:13px">No video data yet.</div>');
  const traffic=byKind('traffic').map(b=>({label:ytHuman('traffic',b.label),value:Number(b.views)})).sort((a,b)=>b.value-a.value);
  const content='<div class="yt-section-title">How viewers find you — last 28 days</div>'+barList(traffic)+
    '<p style="color:var(--muted);font-size:12.5px;margin-top:16px;line-height:1.5">Shorts / long-form / live splits and the impressions funnel aren\'t exposed by the API — those live only in YouTube Studio.</p>';
  const device=byKind('device').map(b=>({label:ytHuman('device',b.label),value:Number(b.views)})).sort((a,b)=>b.value-a.value);
  const subbed=byKind('subscribed').map(b=>({label:ytHuman('subscribed',b.label),value:Number(b.watch_minutes),valueLabel:fmtHours(b.watch_minutes)+' hrs'}));
  const demo=byKind('age_gender').map(b=>({label:ytHuman('age_gender',b.label),value:Number(b.percent),valueLabel:Number(b.percent).toFixed(1)+'%',color:'var(--violet)'})).sort((a,b)=>b.value-a.value).slice(0,12);
  const audience='<div class="yt-section-title">Devices — last 28 days (by views)</div>'+barList(device)+
    '<div class="yt-section-title">Watch time: subscribed vs not — last 28 days</div>'+barList(subbed)+
    '<div class="yt-section-title">Age & gender — % of views</div>'+barList(demo);
  modal({title:name+' — analytics',wide:true,footer:false,
    body:'<div class="yt-tabs"><button class="yt-tab active" onclick="ytSwitchTab(this,\'ov-'+id+'\')">Overview</button><button class="yt-tab" onclick="ytSwitchTab(this,\'co-'+id+'\')">Content</button><button class="yt-tab" onclick="ytSwitchTab(this,\'au-'+id+'\')">Audience</button></div>'+
      '<div id="ov-'+id+'" class="yt-pane">'+overview+'</div>'+
      '<div id="co-'+id+'" class="yt-pane" style="display:none">'+content+'</div>'+
      '<div id="au-'+id+'" class="yt-pane" style="display:none">'+audience+'</div>'});
}

  const cards=channels.map(c=>{const s=latest[c.id]||{};return '<div class="yt-fullcard" onclick=\'channelAnalytics("'+c.id+'")\'><div class="fc-info"><div class="fc-name">'+esc(c.name)+'</div><div class="fc-sub">'+(s.fetched_at?'Updated '+timeAgo(s.fetched_at):'No snapshot yet')+' · click for analytics</div></div><div class="fc-stat"><div class="n">'+fmtNum(s.subscriber_count)+'</div><div class="l">Subscribers</div></div><div class="fc-stat"><div class="n">'+fmtNum(s.view_count)+'</div><div class="l">Views</div></div><div class="fc-stat"><div class="n">'+fmtNum(s.video_count)+'</div><div class="l">Videos</div></div></div>';}).join('');

function sparkline(vals){
  if(vals.length<2)return '';
  const w=260,h=44,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*w,h-4-((v-min)/rng)*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
async function snapshotForm(){

      '<div class="field"><label>Subscribers</label><input name="subscriber_count" type="number"></div>'+
      '<div class="field"><label>Total views</label><input name="view_count" type="number"></div>'+
      '<div class="field"><label>Videos</label><input name="video_count" type="number"></div>'+
    '</div>',
    onSave:async(bg)=>{
      const channel_id=bg.querySelector('[name="channel_id"]').value;
      if(!channel_id)throw new Error('Pick a channel');
      await dbPost('youtube_stats',{channel_id,
        subscriber_count:val(bg,'subscriber_count')||null,

        video_count:val(bg,'video_count')||null});

    }});
}

/* ============================================================
   START/SIT SHOWDOWN 
   ============================================================ */

var SS = { season: null, week: null, weekRow: null, matchups: [], tab: 'matchups',
           staff: [], players: null, sched: null, pickers: [] };

/* ---------- small helpers ---------- */

function ssPosList() { return ['QB', 'RB', 'WR', 'TE']; }
function ssVal(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }

function ssUpsertPick(matchupId, pickerId, side) {
  return api('ss_picks?on_conflict=matchup_id,picker_id', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ matchup_id: matchupId, picker_id: pickerId, pick: side,
                           updated_at: new Date().toISOString() })
  });
}

function ssFetchState() {
  if (SS.season) return Promise.resolve();
  return fetch('https://api.sleeper.app/v1/state/nfl')
    .then(function (r) { return r.json(); })
    .catch(function () { return {}; })
    .then(function (s) {
      SS.season = Number(s.season) || new Date().getFullYear();
      SS.week = Number(s.display_week || s.week) || 1;
    });
}

/* trimmed player index, cached per session (~200KB vs the 5MB source) */
function ssPlayers() {
  if (SS.players) return Promise.resolve(SS.players);
  try {
    var cached = sessionStorage.getItem('ss_players');
    if (cached) { SS.players = JSON.parse(cached); return Promise.resolve(SS.players); }
  } catch (e) {}
  return fetch('https://api.sleeper.app/v1/players/nfl')
    .then(function (r) { return r.json(); })
    .then(function (all) {
      var out = [];
      Object.keys(all).forEach(function (id) {
        var p = all[id];
        if (!p || !p.position || ssPosList().indexOf(p.position) < 0 || !p.team) return;
        out.push({ id: id, n: p.full_name || ((p.first_name || '') + ' ' + (p.last_name || '')).trim(),
                   t: p.team, p: p.position, e: p.espn_id || '' });
      });
      out.sort(function (a, b) { return a.n.localeCompare(b.n); });
      SS.players = out;
      try { sessionStorage.setItem('ss_players', JSON.stringify(out)); } catch (e) {}
      return out;
    });
}

/* team -> opponent for the selected week */
function ssSchedule() {
  var key = SS.season + '-' + SS.week;
  if (SS.sched && SS.sched.key === key) return Promise.resolve(SS.sched.map);
  return fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=' +
               SS.season + '&seasontype=2&week=' + SS.week)
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      var map = {};
      ((j && j.events) || []).forEach(function (ev) {
        var c = ev.competitions && ev.competitions[0];
        if (!c || !c.competitors || c.competitors.length < 2) return;
        var home = c.competitors.filter(function (x) { return x.homeAway === 'home'; })[0];
        var away = c.competitors.filter(function (x) { return x.homeAway === 'away'; })[0];
        if (!home || !away) return;
        var h = (home.team.abbreviation || '').toUpperCase();
        var a = (away.team.abbreviation || '').toUpperCase();
        map[h] = 'vs ' + a; map[a] = '@ ' + h;
      });
      SS.sched = { key: key, map: map };
      return map;
    })
    .catch(function () { return {}; });
}

/* full-PPR points for one player in one week */
function ssPlayerWeekPts(playerId, season, week) {
  return fetch('https://api.sleeper.app/stats/nfl/player/' + playerId +
               '?season_type=regular&season=' + season + '&grouping=week')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      var row = j && j[String(week)];
      var st = row && (row.stats || row);
      return st && st.pts_ppr != null ? Number(st.pts_ppr) : null;
    })
    .catch(function () { return null; });
}

/* ---------- load ---------- */

function loadStartsit() {
  return ssFetchState().then(ssLoadWeek);
}

function ssLoadWeek() {
  return dbGet('ss_weeks?select=*&season=eq.' + SS.season + '&week=eq.' + SS.week)
    .then(function (rows) {
      SS.weekRow = (rows && rows[0]) || null;
      if (!SS.weekRow) { SS.matchups = []; SS.pickers = []; return; }
      return dbGet('ss_matchups?select=*,picks:ss_picks(id,picker_id,pick)&week_id=eq.' +
                   SS.weekRow.id + '&order=sort_order.asc')
        .then(function (m) {
          SS.matchups = m || [];
          return dbGet('ss_week_pickers?select=*,staff(id,name)&week_id=eq.' +
                       SS.weekRow.id + '&order=sort_order.asc');
        })
        .then(function (p) { SS.pickers = p || []; });
    })
    .then(function () { return ssLoadStaff(); })
    .then(renderStartsit)
    .catch(function (e) { console.error(e); toast('Couldn\u2019t load Start/Sit data', true); });
}

function ssLoadStaff() {
  if (SS.staff.length) return Promise.resolve();
  return dbGet('staff?select=id,name,is_showdown_analyst&order=name.asc')
    .then(function (r) { SS.staff = r || []; })
    .catch(function () { SS.staff = []; });
}

/* ---------- shell ---------- */

/* Add a year here when the time comes. */
var SS_SEASONS = [2025, 2026];

function renderStartsit() {
  var canManage = can('startsit', 'u');
  var tabs = [];
  if (canManage) tabs.push(['matchups', 'Matchups']);
  tabs.push(['pickers', 'Pickers'], ['picks', 'My picks']);
  if (canManage) tabs.push(['scoring', 'Scoring']);
  tabs.push(['standings', 'Standings']);
  if (!tabs.some(function (t) { return t[0] === SS.tab; })) SS.tab = 'picks';

  var seasons = SS_SEASONS.slice();
  if (seasons.indexOf(SS.season) < 0) seasons.push(SS.season);
  seasons.sort(function (a, b) { return b - a; });

  var weeks = [];
  for (var w = 1; w <= 18; w++) {
    weeks.push('<option value="' + w + '"' + (w === SS.week ? ' selected' : '') + '>Week ' + w + '</option>');
  }

  document.getElementById('content').innerHTML = '<div class="panel">' +
    '<div class="panel-head ss-head">' +
      '<div class="ss-tabs">' +
        '<button class="btn btn-ghost btn-sm" onclick="go(\'tools\')">&larr; Tools</button>' +
        tabs.map(function (t) {
          return '<button class="btn btn-sm' + (SS.tab === t[0] ? ' btn-primary' : ' btn-ghost') +
                 '" onclick="ssTab(\'' + t[0] + '\')">' + t[1] + '</button>';
        }).join('') +
      '</div>' +
      '<div class="ss-when">' +
        '<select id="ssSeason" onchange="ssJump()">' +
          seasons.map(function (y) {
            return '<option value="' + y + '"' + (y === SS.season ? ' selected' : '') + '>' + y + '</option>';
          }).join('') +
        '</select>' +
        '<select id="ssWeekSel" onchange="ssJump()">' + weeks.join('') + '</select>' +
        (SS.weekRow ? ssStatusPill() : '') +
      '</div>' +
    '</div>' +
    '<div id="ssBody"></div>' +
  '</div>';

  ssRenderTab();
}

function ssStatusPill() {
  var s = SS.weekRow.status;
  var color = s === 'scored' ? 'var(--green)' : (s === 'locked' ? 'var(--orange)' : 'var(--navy)');
  var next = s === 'open' ? 'locked' : (s === 'locked' ? 'scored' : 'open');
  return badge(s, color) +
    ifCan('startsit', 'u', '<button class="btn btn-sm btn-ghost" onclick="ssSetStatus(\'' + next +
      '\')">Set ' + next + '</button>') +
    (SS.weekRow.is_display
      ? badge('On site', 'var(--green)')
      : ifCan('startsit', 'u', '<button class="btn btn-sm btn-ghost" onclick="ssSetDisplay()">Show on site</button>'));
}

function ssSetDisplay() {
  rpc('ss_set_display_week', { p_week_id: SS.weekRow.id })
    .then(function () { toast('Week ' + SS.week + ' is now live on the site'); return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t set the display week', true); });
}

function ssTab(t) { SS.tab = t; renderStartsit(); }

function ssJump() {
  SS.season = Number(document.getElementById('ssSeason').value) || SS.season;
  SS.week = Number(document.getElementById('ssWeekSel').value) || SS.week;
  SS.sched = null;
  ssLoadWeek();
}

function ssRenderTab() {
  var b = document.getElementById('ssBody');
  if (!SS.weekRow) {
    b.innerHTML = '<div class="empty">No Week ' + SS.week + ' yet. ' +
      ifCan('startsit', 'c', '<button class="btn btn-primary" onclick="ssCreateWeek()">Create Week ' +
        SS.week + '</button>') + '</div>';
    return;
  }
  if ((SS.tab === 'matchups' || SS.tab === 'scoring') && !can('startsit', 'u')) {
    b.innerHTML = '<div class="empty">You don\u2019t have access to this tab.</div>';
    return;
  }
  if (SS.tab === 'matchups')  return ssRenderMatchups(b);
  if (SS.tab === 'pickers')   return ssRenderPickers(b);
  if (SS.tab === 'picks')     return ssRenderMyPicks(b);
  if (SS.tab === 'scoring')   return ssRenderScoring(b);
  if (SS.tab === 'standings') return ssRenderStandings(b);
}

function ssCreateWeek() {
  dbPost('ss_weeks', { season: SS.season, week: SS.week, status: 'open' })
    .then(function () { toast('Week created'); return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t create the week', true); });
}

function ssSetStatus(next) {
  dbPatch('ss_weeks?id=eq.' + SS.weekRow.id, { status: next })
    .then(function () { toast('Week set to ' + next); return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t change the status', true); });
}

/* ---------- tab: matchups ---------- */

function ssRenderMatchups(b) {
  var rows = ssPosList().map(function (pos) {
    var m = SS.matchups.filter(function (x) { return x.pos === pos; })[0];
    if (!m) {
      return '<tr><td><b>' + pos + '</b></td><td colspan="3" class="muted">Not set</td>' +
        '<td class="row-actions">' + ifCan('startsit', 'c',
          '<button class="btn btn-sm btn-primary" onclick="ssMatchupForm(\'' + pos + '\')">Add</button>') +
        '</td></tr>';
    }
    return '<tr>' +
      '<td><b>' + pos + '</b></td>' +
      '<td>' + esc(m.a_name) + ' <span class="muted">' + esc(m.a_team || '') + ' ' + esc(m.a_opp || '') + '</span></td>' +
      '<td class="ss-vs">vs</td>' +
      '<td>' + esc(m.b_name) + ' <span class="muted">' + esc(m.b_team || '') + ' ' + esc(m.b_opp || '') + '</span></td>' +
      '<td class="row-actions">' +
        ifCan('startsit', 'u', '<button class="btn btn-sm btn-ghost" onclick="ssMatchupForm(\'' + pos + '\',\'' + m.id + '\')">Edit</button>') +
        ifCan('startsit', 'd', '<button class="btn btn-sm btn-danger" onclick="ssMatchupDelete(\'' + m.id + '\')">Delete</button>') +
      '</td></tr>';
  }).join('');

  b.innerHTML = '<div class="table-wrap"><table><thead><tr>' +
    '<th style="width:70px">Pos</th><th>Player A</th><th style="width:44px"></th>' +
    '<th>Player B</th><th style="width:170px"></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function ssMatchupForm(pos, id) {
  var m = id ? SS.matchups.filter(function (x) { return x.id === id; })[0] : null;

  function sideFields(side, label) {
    return '<div class="field">' +
      '<label>' + label + '</label>' +
      '<input id="ss_' + side + '_q" class="ss-search" autocomplete="off" placeholder="Search players\u2026" value="' +
        (m ? esc(m[side + '_name']) : '') + '">' +
      '<div class="ss-results" id="ss_' + side + '_res"></div>' +
      '<input type="hidden" id="ss_' + side + '_id" value="' + (m ? esc(m[side + '_player_id'] || '') : '') + '">' +
      '<input type="hidden" id="ss_' + side + '_espn" value="' + (m ? esc(m[side + '_espn_id'] || '') : '') + '">' +
      '<input type="hidden" id="ss_' + side + '_team" value="' + (m ? esc(m[side + '_team'] || '') : '') + '">' +
      '<div class="ss-picked muted" id="ss_' + side + '_meta">' +
        (m ? esc((m[side + '_team'] || '') + ' ' + (m[side + '_opp'] || '')) : '') + '</div>' +
      '<input id="ss_' + side + '_opp" placeholder="Opponent (auto)" value="' + (m ? esc(m[side + '_opp'] || '') : '') + '">' +
    '</div>';
  }

  modal({
    title: (m ? 'Edit ' : 'Add ') + pos + ' matchup \u00b7 Week ' + SS.week,
    wide: true,
    saveLabel: 'Save matchup',
    body: '<div class="form-grid">' + sideFields('a', 'Player A') + sideFields('b', 'Player B') + '</div>' +
          '<p class="muted" id="ssPlayerLoad">Loading player list\u2026</p>',
    onReady: function () {
      Promise.all([ssPlayers(), ssSchedule()]).then(function (res) {
        var elLoad = document.getElementById('ssPlayerLoad');
        if (elLoad) elLoad.remove();
        ['a', 'b'].forEach(function (side) { ssBindSearch(side, pos, res[0], res[1]); });
      });
    },
    onSave: function () {
      var payload = {
        week_id: SS.weekRow.id, pos: pos, sort_order: ssPosList().indexOf(pos),
        a_player_id: ssVal('ss_a_id') || null, a_espn_id: ssVal('ss_a_espn') || null,
        a_name: ssVal('ss_a_q'), a_team: ssVal('ss_a_team') || null, a_opp: ssVal('ss_a_opp') || null,
        b_player_id: ssVal('ss_b_id') || null, b_espn_id: ssVal('ss_b_espn') || null,
        b_name: ssVal('ss_b_q'), b_team: ssVal('ss_b_team') || null, b_opp: ssVal('ss_b_opp') || null
      };
      if (!payload.a_name || !payload.b_name) throw new Error('Pick both players first.');
      var p = m ? dbPatch('ss_matchups?id=eq.' + m.id, payload) : dbPost('ss_matchups', payload);
      return p.then(function () { toast('Matchup saved'); return ssLoadWeek(); });
    }
  });
}

function ssBindSearch(side, pos, list, sched) {
  var q = document.getElementById('ss_' + side + '_q');
  var res = document.getElementById('ss_' + side + '_res');
  if (!q || !res) return;

  q.addEventListener('input', function () {
    var term = q.value.trim().toLowerCase();
    if (term.length < 2) { res.innerHTML = ''; return; }
    res.innerHTML = list.filter(function (p) {
      return p.p === pos && p.n.toLowerCase().indexOf(term) >= 0;
    }).slice(0, 8).map(function (p) {
      return '<button type="button" class="ss-hit" data-id="' + p.id + '" data-espn="' + p.e +
        '" data-team="' + p.t + '" data-name="' + esc(p.n) + '">' + esc(p.n) +
        ' <span class="muted">' + p.t + '</span></button>';
    }).join('');
  });

  res.addEventListener('click', function (e) {
    var btn = e.target.closest('.ss-hit');
    if (!btn) return;
    q.value = btn.dataset.name;
    document.getElementById('ss_' + side + '_id').value = btn.dataset.id;
    document.getElementById('ss_' + side + '_espn').value = btn.dataset.espn;
    document.getElementById('ss_' + side + '_team').value = btn.dataset.team;
    document.getElementById('ss_' + side + '_opp').value = sched[btn.dataset.team] || '';
    document.getElementById('ss_' + side + '_meta').textContent =
      btn.dataset.team + ' ' + (sched[btn.dataset.team] || '');
    res.innerHTML = '';
  });
}

function ssMatchupDelete(id) {
  confirmDelete('this matchup and every pick on it', function () {
    return dbDel('ss_matchups?id=eq.' + id).then(function () { toast('Matchup deleted'); return ssLoadWeek(); });
  });
}

/* ---------- tab: pickers ---------- */

function ssRenderPickers(b) {
  if (!SS.pickers) {
    b.innerHTML = '<div class="ss-pad"><div class="empty">SS.pickers isn\u2019t loaded.</div></div>';
    return;
  }
  var canAdd = can('startsit', 'c');
  var missing = SS.staff.filter(function (s) {
    return !SS.pickers.some(function (p) { return p.staff_id === s.id; });
  });

  var staffOpts = missing
    .map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; })
    .join('');

  var rows = SS.pickers.map(function (p) {
    var person = p.staff || { name: p.guest_name };
    return '<tr>' +
      '<td><div class="ss-who">' + avatarHtml(person, 'ss-av') +
        '<b>' + esc(person.name) + '</b></div></td>' +
      '<td>' + (p.staff_id ? badge('Staff', 'var(--navy)') : badge('Guest', 'var(--orange)')) + '</td>' +
      '<td>' + (p.on_air ? badge('On air', 'var(--green)') : '<span class="muted">Submits picks</span>') + '</td>' +
      '<td class="row-actions">' +
        ifCan('startsit', 'u', '<button class="btn btn-sm btn-ghost" onclick="ssTogglePickerAir(\'' + p.id + '\',' +
          (p.on_air ? 'false' : 'true') + ')">' + (p.on_air ? 'Take off air' : 'Put on air') + '</button>') +
        ifCan('startsit', 'd', '<button class="btn btn-sm btn-danger" onclick="ssRemovePicker(\'' + p.id + '\')">Remove</button>') +
      '</td></tr>';
  }).join('');

  b.innerHTML =
    (canAdd
      ? '<div class="ss-bar">' +
          '<select id="ssAddStaff"><option value="">Add staff picker\u2026</option>' + staffOpts + '</select>' +
          '<button class="btn btn-sm btn-primary" onclick="ssAddStaffPicker()">Add</button>' +
          '<button class="btn btn-sm btn-ghost" onclick="ssAddAllPickers()"' +
            (missing.length ? '' : ' disabled') + '>Add all' +
            (missing.length ? ' (' + missing.length + ')' : '') + '</button>' +
          '<span class="ss-sep"></span>' +
          '<input id="ssAddGuest" placeholder="Guest name" style="width:180px">' +
          '<button class="btn btn-sm btn-primary" onclick="ssAddGuestPicker()">Add guest</button>' +
          '<span class="grow"></span>' +
          '<button class="btn btn-sm btn-ghost" onclick="ssCopyPickers()">Copy from Week ' + (SS.week - 1) + '</button>' +
        '</div>'
      : '') +
    (SS.pickers.length
      ? '<div class="table-wrap"><table><thead><tr>' +
          '<th>Picker</th><th style="width:110px">Type</th><th style="width:170px">Role</th>' +
          '<th style="width:240px"></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="ss-pad"><div class="empty">No pickers set for Week ' + SS.week +
        (canAdd ? ' yet. Add staff or a guest above.' : '.') + '</div></div>') +
    '<p class="ss-note">On-air pickers appear under the VS on the stream page and pick live. ' +
      'Everyone else submits in advance. All guests share one line in the season standings.</p>';
}

function ssAddAllPickers() {
  var missing = SS.staff.filter(function (s) {
    return !SS.pickers.some(function (p) { return p.staff_id === s.id; });
  });
  if (!missing.length) { toast('Everyone is already a picker'); return; }
  var base = SS.pickers.length;
  dbPost('ss_week_pickers', missing.map(function (s, i) {
    return { week_id: SS.weekRow.id, staff_id: s.id, sort_order: base + i };
  }))
    .then(function () { toast(missing.length + ' pickers added'); return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t add everyone', true); });
}

function ssAddStaffPicker() {
  var id = document.getElementById('ssAddStaff').value;
  if (!id) { toast('Choose a staff member first', true); return; }
  dbPost('ss_week_pickers', { week_id: SS.weekRow.id, staff_id: id, sort_order: SS.pickers.length })
    .then(function () { return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t add that picker', true); });
}

function ssAddGuestPicker() {
  var nm = ssVal('ssAddGuest');
  if (!nm) { toast('Enter the guest\u2019s name', true); return; }
  dbPost('ss_week_pickers', { week_id: SS.weekRow.id, guest_name: nm, on_air: true, sort_order: SS.pickers.length })
    .then(function () { return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t add that guest', true); });
}

function ssTogglePickerAir(id, on) {
  dbPatch('ss_week_pickers?id=eq.' + id, { on_air: on })
    .then(function () { return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t change that', true); });
}

function ssRemovePicker(id) {
  confirmDelete('this picker and their picks for the week', function () {
    return dbDel('ss_week_pickers?id=eq.' + id).then(function () { return ssLoadWeek(); });
  });
}

function ssCopyPickers() {
  dbGet('ss_weeks?select=id&season=eq.' + SS.season + '&week=eq.' + (SS.week - 1))
    .then(function (rows) {
      if (!rows || !rows.length) throw new Error('no previous week');
      return rpc('ss_copy_pickers', { p_from_week: rows[0].id, p_to_week: SS.weekRow.id });
    })
    .then(function () { toast('Pickers copied'); return ssLoadWeek(); })
    .catch(function () { toast('Nothing to copy from Week ' + (SS.week - 1), true); });
}

/* ---------- tab: my picks ---------- */

function ssMyPicker() {
  return SS.pickers.filter(function (p) { return p.staff_id === MY_STAFF_ID; })[0] || null;
}

function ssRenderMyPicks(b) {
  if (!MY_STAFF_ID) {
    b.innerHTML = '<div class="ss-pad"><div class="empty">Your login isn\u2019t linked to a staff record yet.</div></div>';
    return;
  }
  var me = ssMyPicker();
  if (!me) {
    b.innerHTML = '<div class="ss-pad"><div class="empty">You\u2019re not on the picker list for Week ' +
      SS.week + '. Ask an admin to add you in the Pickers tab.</div></div>';
    return;
  }
  if (!SS.matchups.length) {
    b.innerHTML = '<div class="ss-pad"><div class="empty">No matchups set for this week yet.</div></div>';
    return;
  }
  var locked = SS.weekRow.status !== 'open';
  var made = SS.matchups.filter(function (m) {
    return (m.picks || []).some(function (p) { return p.picker_id === me.id; });
  }).length;

  b.innerHTML =
    '<div class="ss-bar">' +
      '<b style="font-size:13px;color:var(--navy)">' + made + ' of ' + SS.matchups.length + ' picks made</b>' +
      '<span class="grow"></span>' +
      (locked ? badge('Picks closed', 'var(--muted)') : badge('Open', 'var(--green)')) +
    '</div>' +
    '<div class="ss-pad"><div class="ss-picks">' +
      SS.matchups.map(function (m) {

function ssRenderScoring(b) {

        }).join('<span class="ss-vs">vs</span>') +

function ssPullPoints(id) {
  var m = SS.matchups.filter(function (x) { return x.id === id; })[0];
  if (!m) return Promise.resolve();
  return Promise.all([
    m.a_player_id ? ssPlayerWeekPts(m.a_player_id, SS.season, SS.week) : null,
    m.b_player_id ? ssPlayerWeekPts(m.b_player_id, SS.season, SS.week) : null
  ]).then(function (r) {
    if (r[0] != null) document.getElementById('pts_' + id + '_a').value = r[0].toFixed(2);
    if (r[1] != null) document.getElementById('pts_' + id + '_b').value = r[1].toFixed(2);
    var a = Number(document.getElementById('pts_' + id + '_a').value);
    var bb = Number(document.getElementById('pts_' + id + '_b').value);
    if (isFinite(a) && isFinite(bb)) {
      var pick = a === bb ? 'tie' : (a > bb ? 'a' : 'b');
      var radio = document.querySelector('input[name="w_' + id + '"][value="' + pick + '"]');
      if (radio) radio.checked = true;
    }
  });
}

function ssPullAll() {
  toast('Pulling full-PPR points\u2026');
  Promise.all(SS.matchups.map(function (m) { return ssPullPoints(m.id); }))
    .then(function () { toast('Points pulled \u2014 review, then Save results'); });
}

function ssSaveScores() {
  var jobs = SS.matchups.map(function (m) {
    var sel = document.querySelector('input[name="w_' + m.id + '"]:checked');
    var a = document.getElementById('pts_' + m.id + '_a').value;
    var b = document.getElementById('pts_' + m.id + '_b').value;
    return dbPatch('ss_matchups?id=eq.' + m.id, {
      a_points: a === '' ? null : Number(a),
      b_points: b === '' ? null : Number(b),
      winner: sel ? sel.value : null,
      scored_at: sel ? new Date().toISOString() : null,
      scored_by: MY_STAFF_ID || null
    });
  });
  Promise.all(jobs)
    .then(function () { return dbPatch('ss_weeks?id=eq.' + SS.weekRow.id, { status: 'scored' }); })
    .then(function () { toast('Results saved'); return ssLoadWeek(); })
    .catch(function () { toast('Couldn\u2019t save the results', true); });
}

/* every picker x every matchup — mirrors the old spreadsheet */
function ssRenderPickGrid() {
  var g = document.getElementById('ssGrid');
  if (!g) return;
  if (!SS.pickers.length) {
    g.innerHTML = '<div class="empty">No pickers set for this week.</div>';

  }
  var editable = can('startsit', 'u');

    return '<th>' + esc(m.pos) + '</th>';
  }).join('') + '<th style="width:80px">W-L</th></tr>';

  var rows = SS.pickers.map(function (s) {

        '<option value="b"' + (p && p.pick === 'b' ? ' selected' : '') + '>' + esc(m.b_name) + '</option>' +

function taskCard(t){
  const p=PRIORITY[t.priority]||PRIORITY.medium;
  return '<div class="task" draggable="true" data-id="'+t.id+'" onclick="taskDetail(\''+t.id+'\')">'+
    '<div class="t-title">'+esc(t.title)+'</div>'+
    '<div class="t-meta">'+badge(p.label,p.color)+
      (t.due_date?'<span class="mono" style="font-size:11px;color:var(--muted)">'+fmtDate(t.due_date)+'</span>':'')+
      (t.assignee?'<span class="t-assignee"><span class="mini-avatar">'+initials(t.assignee.name)+'</span></span>':'')+
    '</div></div>';
}
let dragId=null;
function wireDnD(){
  document.querySelectorAll('.task').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('dragging');e.stopPropagation();});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      const st=col.dataset.status;const t=TASKS.find(x=>x.id===dragId);
      if(!t||t.status===st)return;
      t.status=st;
      try{await dbPatch('tasks?id=eq.'+dragId,{status:st,updated_at:new Date().toISOString()});renderBoard();}
      catch(err){toast('Could not move task',true);}
    });
  });
}

async function convertRecruit(id){
  const rows=await dbGet('recruits?select=*&id=eq.'+id);const rec=rows&&rows[0];if(!rec)return;
  if(rec.status==='converted'){toast('Already converted',true);return;}
  let matches=[];
  try{const parts=[];if(rec.email)parts.push('email.eq.'+encodeURIComponent(rec.email));if(rec.name)parts.push('name.ilike.*'+encodeURIComponent(rec.name)+'*');if(parts.length)matches=await dbGet('profiles?select=id,name,email,slffid&or=('+parts.join(',')+')&limit=5')||[];}catch(e){}
  const exact=rec.email?matches.find(m=>(m.email||'').toLowerCase()===rec.email.toLowerCase()):null;
  const genPw=()=>Math.random().toString(36).slice(2,8)+Math.floor(10+Math.random()*90)+'!';
  const suggestedId=(exact&&exact.slffid)?exact.slffid:await nextSlffId();
  const loginOpts='<option value="create"'+(exact?'':' selected')+'>Create a new login</option>'+
    matches.map(m=>'<option value="link:'+m.id+'"'+((exact&&exact.id===m.id)?' selected':'')+'>Link existing: '+esc(m.name||m.email)+(m.email?' ('+esc(m.email)+')':'')+'</option>').join('')+
    '<option value="none">No login account</option>';
  const today=new Date().toISOString().slice(0,10);
  modal({title:'Convert '+rec.name+' to staff',wide:true,saveLabel:'Convert to staff',
    body:'<p style="margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5">'+(exact?'Found an existing login for '+esc(exact.email)+' — it will be linked instead of creating a duplicate.':'No existing login matches this recruit, so a new one will be created.')+'</p>'+
      '<div class="form-grid"><div class="field"><label>Start date</label><input name="start_date" type="date" value="'+today+'"></div>'+
      '<div class="field"><label>Department</label><select name="department"><option value="">— none —</option><option>Administration</option><option>Content</option><option>Partnership</option><option>Social Media</option></select></div>'+
      '<div class="field"><label>Login account</label><select name="login">'+loginOpts+'</select></div>'+
      '<div class="field"><label>SLFF ID</label><input name="slffid" value="'+esc(suggestedId)+'" placeholder="auto"></div>'+
      '<div class="field full"><label>Temp password (only used if creating a new login)</label><input name="password" value="'+genPw()+'"></div></div>',
    onSave:async(bg)=>{
      if(bg.dataset.busy==='1')return;
      bg.dataset.busy='1';
      try{
        const fresh=await dbGet('recruits?select=status,staff_id&id=eq.'+id);
        const cur=fresh&&fresh[0];
        if(cur&&cur.status==='converted')throw new Error('This recruit has already been converted');
        const start_date=val(bg,'start_date')||today;
        const login=bg.querySelector('[name="login"]').value;
        const slffid=(val(bg,'slffid')||'').trim();
        if(slffid&&!/^\d+$/.test(slffid))throw new Error('SLFF ID must be numeric');

        let profileId=null,pwShown=null;
        if(login.startsWith('link:')){
          profileId=login.slice(5);
          const ex=matches.find(m=>m.id===profileId);
          if(slffid&&ex&&!ex.slffid){try{await dbPatch('profiles?id=eq.'+profileId,{slffid});}catch(e){console.warn('slffid patch failed',e);}}
        }else if(login==='create'){
          if(!rec.email)throw new Error('This recruit has no email — add one before creating a login');
          const password=val(bg,'password')||genPw();
          const res=await fetch(SUPABASE_URL+'/functions/v1/create-user',{method:'POST',headers:{'Authorization':'Bearer '+localStorage.getItem('sb-auth-token'),'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:rec.email,password,name:rec.name,slffid:slffid||null})});
          const data=await res.json().catch(()=>({}));
          if(!res.ok)throw new Error(data.error||('Failed to create login ('+res.status+')'));
          const newId=data.id||data.user_id;
          if(!newId)throw new Error('create-user returned no id: '+JSON.stringify(data).slice(0,150));
          profileId=newId;
          if(!data.existing)pwShown={email:data.email||rec.email,password:data.password||password};
        }

        let staffId=cur&&cur.staff_id?cur.staff_id:null;
        if(!staffId&&rec.email){
          try{const d=await dbGet('staff?select=id&email=eq.'+encodeURIComponent(rec.email)+'&limit=1');if(d&&d[0])staffId=d[0].id;}catch(e){}
        }
        const staffBody={name:rec.name,email:rec.email,phone:rec.phone,dob:rec.dob||null,role:rec.role,
          department:val(bg,'department')||null,start_date,is_active:true,profile_id:profileId};
        if(staffId)await dbPatch('staff?id=eq.'+staffId,staffBody);
        else{const r=await dbPost('staff',staffBody);staffId=r[0].id;}

        await dbPatch('recruits?id=eq.'+id,{status:'converted',converted_at:new Date().toISOString(),staff_id:staffId});
        document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
        RECRUITS=await dbGet(RECRUIT_SELECT)||[];renderRecruits('');
        toast(rec.name+' converted to staff');
        if(pwShown)modal({title:'Login created',footer:false,body:'<p style="line-height:1.6">Share these with <strong>'+esc(rec.name)+'</strong>:</p>'+detailRow('Email',esc(pwShown.email))+detailRow('Temp password','<span class="mono">'+esc(pwShown.password)+'</span>')});
      }catch(e){ bg.dataset.busy=''; throw e; }
    }});
}

function orgChartHtml(){
  const people=ORG.filter(s=>s.is_active!==false);
  if(!people.length) return '<div class="empty"><h4>No staff to chart</h4><p>Add active staff, then set who each person reports to on their staff record.</p></div>';
  const byId={}; people.forEach(s=>byId[s.id]=s);
  const teams=ORG_TEAMS.filter(t=>t.is_active!==false);
  const teamById={}; teams.forEach(t=>teamById[t.id]=t);

  const teamsByLead={}, membersByTeam={}, reports={};
  teams.forEach(t=>{
    if(t.lead_staff_id && byId[t.lead_staff_id]) (teamsByLead[t.lead_staff_id]=teamsByLead[t.lead_staff_id]||[]).push(t);
  });
  people.forEach(s=>{
    if(s.team_id && teamById[s.team_id] && teamById[s.team_id].lead_staff_id!==s.id){
      (membersByTeam[s.team_id]=membersByTeam[s.team_id]||[]).push(s); return;
    }
    const key=(s.manager_id && byId[s.manager_id] && s.manager_id!==s.id) ? s.manager_id : '__root';
    (reports[key]=reports[key]||[]).push(s);
  });

  const seen={}, teamSeen={};
    const personNode=(s,stacked)=>{
    if(seen[s.id]) return '';
    seen[s.id]=1;
    const ch=(teamsByLead[s.id]||[]).map(t=>teamNode(t)).join('')+(reports[s.id]||[]).map(x=>personNode(x,stacked)).join('');
    return '<div class="org-node'+(ch&&stacked?' stack':'')+'">'+orgCard(s)+
      (ch?'<div class="org-children'+(stacked?' stacked':'')+'">'+ch+'</div>':'')+'</div>';
  };
  const teamNode=(t)=>{
    if(teamSeen[t.id]) return '';
    teamSeen[t.id]=1;
    const mem=membersByTeam[t.id]||[];
    const ch=mem.map(x=>personNode(x,true)).join('');
    return '<div class="org-node'+(ch?' stack':'')+'">'+orgTeamCard(t,mem.length)+
      (ch?'<div class="org-children stacked">'+ch+'</div>':'')+'</div>';
  };

    let html=(reports['__root']||[]).map(x=>personNode(x)).join('');
  html+=teams.filter(t=>!teamSeen[t.id] && (membersByTeam[t.id]||[]).length).map(t=>teamNode(t)).join('');
  const stranded=people.filter(s=>!seen[s.id]);
  if(stranded.length) html+=stranded.map(x=>personNode(x)).join('');

  const unmanaged=(reports['__root']||[]).length;
  return '<div class="panel" style="padding:4px 0"><div class="org-wrap"><div class="org-roots">'+html+'</div></div></div>'+
    '<div style="font-size:12.5px;color:var(--muted);margin-top:12px;text-align:center">'+
      people.length+' active staff'+(unmanaged>1?' · '+unmanaged+' not placed yet — set "Reports to" or a Team on their staff record':'')+
    '</div>';
}

function orgTeamsHtml(){
  const counts={};
  ORG.filter(s=>s.is_active!==false).forEach(s=>{ if(s.team_id) counts[s.team_id]=(counts[s.team_id]||0)+1; });
  const body=ORG_TEAMS.length? ORG_TEAMS.map(t=>{
    const lead=ORG.find(x=>x.id===t.lead_staff_id);
    return '<tr><td><strong>'+esc(t.name)+'</strong>'+(t.description?'<div style="font-size:12px;color:var(--muted)">'+esc(t.description)+'</div>':'')+'</td>'+

      '<td class="mono">'+(counts[t.id]||0)+'</td>'+
      '<td>'+(t.is_active!==false?badge('Active','var(--green)'):badge('Off','var(--muted)'))+'</td>'+
      '<td><div class="row-actions">'+
        ifCan('org','u','<button class="btn btn-ghost btn-sm" onclick=\'teamForm("'+t.id+'")\'>Edit</button>')+
        ifCan('org','d','<button class="btn btn-danger btn-sm" onclick=\'teamDelete("'+t.id+'")\'>Delete</button>')+
      '</div></td></tr>';
  }).join('')
  : '<tr><td colspan="5"><div class="empty"><h4>No teams yet</h4><p>Create a team, give it a lead, then set people\'s Team on their staff record.</p>'+ifCan('org','c','<button class="btn btn-primary" onclick="teamForm()">+ New team</button>')+'</div></td></tr>';
  return '<div class="panel"><div class="table-wrap"><table><thead><tr><th>Team</th><th>Lead</th><th>People</th><th>Status</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

  document.getElementById('content').innerHTML = tabs + (ONB_TAB==='template' ? onbTemplateHtml() : onbPeopleHtml(q));
  const sb=document.getElementById('searchBox'); if(sb&&q) sb.value=q;
  bindSearch(renderOnboarding);
}

function onbPeopleHtml(q){
  const rows=ONB.filter(r=>!q||[r.name,r.job_title].some(v=>(v||'').toLowerCase().includes(q)));
  const body=rows.length? rows.map(r=>{
    const done=Number(r.required_done||0), tot=Number(r.required_total||0);
    const status = r.onboarding_status==='completed' ? badge('Completed','var(--green)')
      : (tot>0 && done>=tot ? badge('Ready to finish','var(--sky)') : badge('In progress','var(--orange)'));
    return '<tr><td><strong>'+esc(r.name)+'</strong>'+(r.job_title?'<div style="font-size:12px;color:var(--muted)">'+esc(r.job_title)+'</div>':'')+'</td>'+
      '<td>'+fmtDate(r.start_date)+'</td>'+
      '<td style="min-width:180px">'+onbBar(done,tot)+'</td>'+
      '<td>'+status+'</td>'+
      '<td><div class="row-actions"><button class="btn btn-ghost btn-sm" onclick=\'onbDetail("'+r.staff_id+'")\'>Open</button></div></td></tr>';
  }).join('')
  : '<tr><td colspan="5"><div class="empty"><h4>Nobody in onboarding</h4><p>Anyone whose onboarding isn\'t marked complete shows up here. Convert a recruit to add someone.</p></div></td></tr>';
  return toolbar('Search people in onboarding…',
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto;cursor:pointer"><input type="checkbox"'+(ONB_DONE?' checked':'')+' onchange="onbToggleDone(this.checked)"> Show completed</label> <span class="count-pill">'+rows.length+'</span>')+
    '<div class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Start date</th><th>Required progress</th><th>Status</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

async function onbDetail(staffId){
  const row=ONB.find(r=>r.staff_id===staffId);
  const items=await onbItems(staffId)||[];
  modal({title:(row?row.name:'Onboarding'),wide:true,footer:false,body:onbDetailBody(staffId,items,row)});
}

function onbDetailBody(staffId,items,row){
  const reqTot=items.filter(i=>i.is_required).length;
  const reqDone=items.filter(i=>i.is_required&&i.is_complete).length;
  const optional=items.length-reqTot;
  const completed = row && row.onboarding_status==='completed';
  let html='<div style="margin-bottom:8px">'+
    (row&&row.email?'<div style="font-size:13px;color:var(--muted);margin:-6px 0 14px">'+esc(row.email)+'</div>':'')+
    (completed?'<div style="margin-bottom:12px">'+badge('Onboarding complete','var(--green)')+'</div>':'')+
    onbBar(reqDone,reqTot)+
    '<div style="font-size:12.5px;color:var(--muted);margin-top:7px">'+reqDone+' of '+reqTot+' required steps done'+(optional>0?' · '+optional+' optional':'')+'</div></div>';
  let cat=null;
  html+=items.map(i=>{
    let out='';
    const c=i.category||'Other';
    if(c!==cat){ cat=c; out+='<div class="onb-cat">'+esc(c)+'</div>'; }
    const resp=i.responsible_staff_id?onbStaffName(i.responsible_staff_id):null;
    const meta=[];
    if(resp) meta.push('Responsible: '+esc(resp));
    if(i.is_complete&&i.completed_at) meta.push('Done '+fmtDate(i.completed_at));
    out+='<div class="onb-item'+(i.is_complete?' done':'')+'">'+
      '<input type="checkbox"'+(i.is_complete?' checked':'')+(can('onboarding','u')?'':' disabled')+' onchange=\'onbToggle("'+i.id+'","'+staffId+'",this.checked)\'>'+
      '<div style="flex:1">'+
        '<div class="onb-t">'+esc(i.title)+(i.is_required?'':' <span class="chip" style="font-size:10px">Optional</span>')+'</div>'+
        (i.description?'<div class="onb-d">'+esc(i.description)+'</div>':'')+
        (meta.length?'<div class="onb-d">'+meta.join(' · ')+'</div>':'')+
        (i.notes?'<div class="onb-d" style="font-style:italic;color:var(--navy)">'+esc(i.notes)+'</div>':'')+
      '</div>'+
      (can('onboarding','u')?'<button class="btn btn-ghost btn-sm" onclick=\'onbNote("'+i.id+'","'+staffId+'")\'>Note</button>':'')+
      ((!i.template_item_id&&can('onboarding','d'))?'<button class="btn btn-danger btn-sm" onclick=\'onbItemDelete("'+i.id+'","'+staffId+'")\'>Remove</button>':'')+
    '</div>';
    return out;
  }).join('');
  if(!items.length) html+='<div class="empty" style="padding:26px"><p>No steps assigned. Build the base checklist on the Template tab.</p></div>';
  html+='<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">'+
    ifCan('onboarding','c','<button class="btn btn-ghost btn-sm" onclick=\'onbAddItem("'+staffId+'")\'>+ Add a step for this person</button>')+
    (can('onboarding','u') ? (completed
      ? '<button class="btn btn-ghost btn-sm" onclick=\'onbComplete("'+staffId+'",false)\'>Reopen onboarding</button>'
      : '<button class="btn btn-primary btn-sm" onclick=\'onbComplete("'+staffId+'",true)\'>Mark onboarding complete</button>') : '')+
  '</div>';
  return html;
}

async function onbRefresh(staffId){
  const items=await onbItems(staffId)||[];
  const row=ONB.find(r=>r.staff_id===staffId);
  if(row){
    const req=items.filter(i=>i.is_required);
    row.required_total=req.length; row.required_done=req.filter(i=>i.is_complete).length;
    row.total=items.length; row.done=items.filter(i=>i.is_complete).length;
  }
  const bg=document.querySelector('.modal-bg');
  if(bg){ const b=bg.querySelector('.modal-body'); if(b) b.innerHTML=onbDetailBody(staffId,items,row); }
}

async function onbToggle(itemId,staffId,checked){
  try{
    await dbPatch('staff_onboarding_items?id=eq.'+itemId,{
      is_complete:checked,
      completed_at:checked?new Date().toISOString():null,
      completed_by:checked?(ME?ME.id:null):null
    });
  }catch(e){ toast('Couldn\'t save that step: '+e.message,true); }
  await onbRefresh(staffId);
}

function onbNote(itemId,staffId){
  dbGet('staff_onboarding_items?select=title,notes&id=eq.'+itemId).then(rows=>{
    const it=rows&&rows[0]; if(!it) return;
    modal({title:'Note — '+it.title,saveLabel:'Save note',
      body:'<div class="field full"><label>Note</label><textarea name="notes">'+esc(it.notes||'')+'</textarea></div>',
      onSave:async(bg)=>{
        await dbPatch('staff_onboarding_items?id=eq.'+itemId,{notes:val(bg,'notes')||null});
        await onbRefresh(staffId); toast('Note saved');
      }});
  }).catch(e=>toast(e.message,true));
}

function onbAddItem(staffId){
  modal({title:'Add a step for this person',wide:true,saveLabel:'Add step',
    body:'<p style="margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5">This step applies to this person only. To add something everyone gets, use the Template tab.</p>'+
      '<div class="form-grid">'+
      '<div class="field full"><label>Title</label><input name="title"></div>'+
      '<div class="field full"><label>Description</label><textarea name="description"></textarea></div>'+
      '<div class="field"><label>Category</label><input name="category" placeholder="Paperwork, Access, Training…"></div>'+
      '<div class="field"><label>Required?</label><select name="is_required"><option value="true">Required</option><option value="false">Optional</option></select></div>'+
      '<div class="field full"><label>Responsible</label><select name="resp"><option value="">— unassigned —</option><option value="self">This person</option>'+
        ONB_STAFF.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div>'+
      '</div>',
    onSave:async(bg)=>{
      const title=val(bg,'title'); if(!title) throw new Error('Title is required');
      const r=bg.querySelector('[name="resp"]').value;
      await dbPost('staff_onboarding_items',{
        staff_id:staffId, title, description:val(bg,'description')||null, category:val(bg,'category')||null,
        is_required: bg.querySelector('[name="is_required"]').value==='true',
        responsible_staff_id: r==='self'?staffId:(r||null), sort_order:900
      });
      await onbRefresh(staffId); toast('Step added');
    }});
}

function onbItemDelete(itemId,staffId){
  confirmDelete('this step',async()=>{
    await dbDel('staff_onboarding_items?id=eq.'+itemId);
    await onbRefresh(staffId);
    toast('Step removed');
  });
}

async function onbComplete(staffId,complete){
  const finish=async()=>{
    document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
    await loadOnboarding();
    toast(complete?'Onboarding marked complete':'Onboarding reopened');
  };
  try{
    await rpc('set_onboarding_complete',{p_staff_id:staffId,p_complete:complete,p_force:false});
    await finish();
  }catch(e){
    if(complete && /required/i.test(e.message)){
      modal({title:'Required steps still open',saveLabel:'Complete anyway',
        body:'<p style="margin:0;line-height:1.6;color:var(--muted)">Some required steps aren\'t checked off yet. Mark this person\'s onboarding complete anyway?</p>',
        onSave:async()=>{
          await rpc('set_onboarding_complete',{p_staff_id:staffId,p_complete:true,p_force:true});
          await finish();
        }});
      return;
    }
    toast(e.message,true);
  }
}

function tplGroups(){
  const groups=[], idx={};
  ONB_TPL.forEach(t=>{
    const c=t.category||'Other';
    if(idx[c]===undefined){ idx[c]=groups.length; groups.push({label:c,items:[]}); }
    groups[idx[c]].items.push(t);
  });
  return groups;
}

function onbTemplateHtml(){
  const canOrder=can('onboarding_template','u');
  const body=ONB_TPL.length? tplGroups().map(g=>
    '<tr class="tbl-group"><td colspan="6">'+esc(g.label)+'</td></tr>'+
    g.items.map((t,i)=>{
      const resp = t.responsible_mode==='new_hire' ? 'The new hire'
        : (t.responsible_mode==='specific' ? (onbStaffName(t.responsible_staff_id)||'—') : '—');
      const move = canOrder
        ? '<div class="tpl-move"><button class="btn btn-ghost btn-sm"'+(i===0?' disabled':'')+' onclick=\'tplMove("'+t.id+'",-1)\' title="Move up">&uarr;</button>'+
          '<button class="btn btn-ghost btn-sm"'+(i===g.items.length-1?' disabled':'')+' onclick=\'tplMove("'+t.id+'",1)\' title="Move down">&darr;</button></div>'
        : '';
      return '<tr><td style="width:1%">'+move+'</td>'+
        '<td><strong>'+esc(t.title)+'</strong>'+(t.description?'<div style="font-size:12px;color:var(--muted)">'+esc(t.description)+'</div>':'')+'</td>'+
        '<td>'+(t.is_required?badge('Required','var(--orange)'):badge('Optional','var(--muted)'))+'</td>'+
        '<td>'+esc(resp)+'</td>'+
        '<td>'+(t.is_active?badge('Active','var(--green)'):badge('Off','var(--muted)'))+'</td>'+
        '<td><div class="row-actions">'+
          ifCan('onboarding_template','u','<button class="btn btn-ghost btn-sm" onclick=\'tplForm("'+t.id+'")\'>Edit</button>')+
          ifCan('onboarding_template','d','<button class="btn btn-danger btn-sm" onclick=\'tplDelete("'+t.id+'")\'>Delete</button>')+
        '</div></td></tr>';
    }).join('')
  ).join('')
  : '<tr><td colspan="6"><div class="empty"><h4>No template steps yet</h4><p>Build the base checklist that everyone gets when they join.</p>'+ifCan('onboarding_template','c','<button class="btn btn-primary" onclick="tplForm()">+ Add step</button>')+'</div></td></tr>';
  return '<div class="panel"><div class="panel-head"><h3>Base checklist</h3>'+
      '<span style="margin-left:auto;font-size:12.5px;color:var(--muted)">Adding a step here gives it to everyone still in onboarding</span></div>'+
    '<div class="table-wrap"><table><thead><tr><th></th><th>Step</th><th>Type</th><th>Responsible</th><th>Status</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

async function tplMove(id,dir){
  const t=ONB_TPL.find(x=>x.id===id); if(!t) return;
  const cat=t.category||'Other';
  const list=ONB_TPL.filter(x=>(x.category||'Other')===cat);
  const i=list.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=list.length) return;
  list.splice(j,0,list.splice(i,1)[0]);
  try{
    for(let k=0;k<list.length;k++){
      const want=(k+1)*10;
      if(list[k].sort_order!==want) await dbPatch('onboarding_template_items?id=eq.'+list[k].id,{sort_order:want});
    }
  }catch(e){ toast(e.message,true); }
  await loadOnboarding();
}

function tplForm(id){
  const t = id ? ONB_TPL.find(x=>x.id===id) : {is_required:true,is_active:true,responsible_mode:'unassigned',sort_order:(ONB_TPL.length+1)*10};
  const respSel='<select name="resp">'+
    '<option value="unassigned"'+((!t.responsible_mode||t.responsible_mode==='unassigned')?' selected':'')+'>— unassigned —</option>'+
    '<option value="new_hire"'+(t.responsible_mode==='new_hire'?' selected':'')+'>The new hire</option>'+
    ONB_STAFF.map(s=>'<option value="'+s.id+'"'+((t.responsible_mode==='specific'&&t.responsible_staff_id===s.id)?' selected':'')+'>'+esc(s.name)+'</option>').join('')+
    '</select>';
  modal({title:id?'Edit template step':'New template step',wide:true,saveLabel:id?'Save step':'Add step',
    body:'<div class="form-grid">'+
      '<div class="field full"><label>Title</label><input name="title" value="'+esc(t.title||'')+'"></div>'+
      '<div class="field full"><label>Description</label><textarea name="description">'+esc(t.description||'')+'</textarea></div>'+
      '<div class="field"><label>Category</label><input name="category" value="'+esc(t.category||'')+'" placeholder="Paperwork, Access, Training…"></div>'+
      '<div class="field"><label>Order</label><input name="sort_order" type="number" value="'+(t.sort_order||0)+'"></div>'+
      '<div class="field"><label>Required?</label><select name="is_required"><option value="true"'+(t.is_required!==false?' selected':'')+'>Required</option><option value="false"'+(t.is_required===false?' selected':'')+'>Optional</option></select></div>'+
      '<div class="field"><label>Status</label><select name="is_active"><option value="true"'+(t.is_active!==false?' selected':'')+'>Active</option><option value="false"'+(t.is_active===false?' selected':'')+'>Off</option></select></div>'+
      '<div class="field full"><label>Responsible</label>'+respSel+'</div>'+
      '</div>'+
      '<p style="margin:16px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5">'+
      (id?'Edits reach anyone who hasn\'t checked this step off yet. Steps already completed keep their original wording. Set it to Off instead of deleting if you want to retire it without touching existing checklists.'
         :'This step will be added to everyone currently in onboarding, and to everyone who joins from here on.')+'</p>',
    onSave:async(bg)=>{
      const title=val(bg,'title'); if(!title) throw new Error('Title is required');
      const r=bg.querySelector('[name="resp"]').value;
      const body={
        title, description:val(bg,'description')||null, category:val(bg,'category')||null,
        is_required: bg.querySelector('[name="is_required"]').value==='true',
        is_active: bg.querySelector('[name="is_active"]').value==='true',
        responsible_mode: (r==='unassigned'||r==='new_hire')?r:'specific',
        responsible_staff_id: (r==='unassigned'||r==='new_hire')?null:r
      };
      const movedCategory = !id || (t.category||null)!==body.category;
      if(movedCategory){
        const sibs=ONB_TPL.filter(x=>x.id!==id && (x.category||null)===body.category);
        body.sort_order = sibs.length ? Math.max.apply(null,sibs.map(x=>x.sort_order||0))+10 : 10;
      }
      if(id) await dbPatch('onboarding_template_items?id=eq.'+id,body);
      else await dbPost('onboarding_template_items',body);
      await loadOnboarding();
      toast(id?'Template step updated':'Step added to the template');
    }});
}

function tplDelete(id){
  const t=ONB_TPL.find(x=>x.id===id); if(!t) return;
  confirmDelete(esc(t.title),async()=>{
    await dbDel('onboarding_template_items?id=eq.'+id);
    await loadOnboarding();
    toast('Template step removed');
  });
}

async function loadMyOnboarding(){
  const items=await rpc('my_onboarding')||[];
  const status=items.length?items[0].onboarding_status:null;
  const reqTot=items.filter(i=>i.is_required).length;
  const reqDone=items.filter(i=>i.is_required&&i.is_complete).length;
  let cat=null;
  const list=items.map(i=>{
    let out='';
    const c=i.category||'Other';
    if(c!==cat){ cat=c; out+='<div class="onb-cat">'+esc(c)+'</div>'; }
    out+='<div class="onb-item'+(i.is_complete?' done':'')+'">'+
      '<input type="checkbox" disabled'+(i.is_complete?' checked':'')+'>'+
      '<div style="flex:1"><div class="onb-t">'+esc(i.title)+(i.is_required?'':' <span class="chip" style="font-size:10px">Optional</span>')+'</div>'+
      (i.description?'<div class="onb-d">'+esc(i.description)+'</div>':'')+
      (i.is_complete&&i.completed_at?'<div class="onb-d">Done '+fmtDate(i.completed_at)+'</div>':'')+
      '</div></div>';
    return out;
  }).join('');
  document.getElementById('content').innerHTML = items.length
    ? '<div class="panel" style="padding:22px 24px"><div style="max-width:660px">'+
        (status==='completed'?'<div style="margin-bottom:14px">'+badge('Onboarding complete','var(--green)')+'</div>':'')+
        onbBar(reqDone,reqTot)+
        '<div style="font-size:12.5px;color:var(--muted);margin:8px 0 2px">'+reqDone+' of '+reqTot+' required steps done. Your team checks these off as you go.</div>'+
        list+
      '</div></div>'
    : '<div class="empty"><h4>Nothing here yet</h4><p>You don\'t have any onboarding steps assigned.</p></div>';
}

document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
