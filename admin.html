<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — FantasyNow+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002863; --navy-2:#001a42; --navy-3:#0a3a80;
    --orange:#FFA515; --orange-2:#ED9405;
    --white:#ffffff; --paper:#F4F4F4; --ink:#111418; --muted:#606060;
    --line:#e7eaf1; --line-2:#dfe3ec;
    --red:#EA4E3D; --aqua:#42F4B0; --violet:#7C5CFC; --pink:#FF4D8D;
    --yellow:#FFD23F; --sky:#22C3E6; --green:#22C55E;
    --shadow:0 1px 2px rgba(0,40,99,.06), 0 8px 24px rgba(0,40,99,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Archivo',sans-serif;margin:0}
  .mono{font-family:'IBM Plex Mono',monospace}
  a{color:inherit}
  button{font-family:inherit}

  #gate{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;text-align:center;
    background:radial-gradient(120% 120% at 50% -10%, var(--navy-3), var(--navy) 55%, var(--navy-2));
    color:#fff;
  }
  #gate .card{max-width:420px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius);padding:36px 30px;backdrop-filter:blur(6px)}
  #gate h1{font-size:26px;letter-spacing:.02em}
  #gate .mark{display:inline-block;font-family:'Archivo';font-weight:800;font-size:15px;
    letter-spacing:.04em;background:var(--orange);color:var(--navy);padding:6px 12px;border-radius:8px;margin-bottom:18px}
  #gate p{color:#cdd7ea;line-height:1.55;margin:12px 0 22px}
  #gate a.btn{display:inline-block;background:var(--orange);color:var(--navy);font-weight:700;
    text-decoration:none;padding:11px 20px;border-radius:10px}
  .gate-login{display:flex;flex-direction:column;gap:10px;margin:20px 0 6px;text-align:left}
  .gate-login input{padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-family:inherit}
  .gate-login input::placeholder{color:#9fb0d0}
  .gate-login .btn{margin-top:4px;border:0;cursor:pointer;width:100%;background:var(--orange);color:var(--navy);font-weight:700;padding:11px 20px;border-radius:10px;font-size:14px}
  .gate-err{color:#ffb3ab;font-size:13px;font-weight:600;min-height:2px}
  .gate-alt{display:inline-block;margin-top:14px;color:#9fb0d0;font-size:13px;text-decoration:none}
  .gate-alt:hover{color:#fff}

  #app{display:none;min-height:100vh}

  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:248px;
    background:var(--navy);color:#dbe4f4;display:flex;flex-direction:column;
    border-right:1px solid var(--navy-2);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px}
  .brand .logo{font-family:'Archivo';font-weight:800;font-size:16px;letter-spacing:.03em;
    background:var(--orange);color:var(--navy);padding:6px 11px;border-radius:9px}
  .brand .sub{font-size:11px;color:#8ea3c9;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .nav{flex:1;overflow-y:auto;padding:8px 12px}
  .nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6f86b3;
    padding:16px 12px 8px;font-weight:700}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:#c3d0e8;font-size:14px;font-weight:500;
    padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px;transition:.12s;
  }
  .nav button:hover{background:var(--navy-3);color:#fff}
  .nav button.active{background:var(--orange);color:var(--navy);font-weight:700}
  .nav button .ic{width:18px;height:18px;flex:none}
  .side-foot{border-top:1px solid var(--navy-2);padding:14px 16px}
  .side-foot .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Archivo';flex:none}
  img.avatar{display:block;object-fit:cover;object-position:top center}
  .side-foot .name{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
  .side-foot .lvl{font-size:11px;color:#8ea3c9}
  .logout{width:100%;background:rgba(234,78,61,.14);color:#ffb3ab;border:1px solid rgba(234,78,61,.3);
    padding:8px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .logout:hover{background:var(--red);color:#fff}

  .main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:10;background:rgba(244,244,244,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-2);padding:16px 30px;display:flex;align-items:center;gap:16px;
  }
  .topbar h1{font-size:22px;color:var(--navy);letter-spacing:.01em}
  .topbar .spacer{flex:1}
  .content{padding:26px 30px 60px;max-width:1280px;width:100%}

  .btn{border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
  .btn-primary{background:var(--orange);color:var(--navy)}
  .btn-primary:hover{background:var(--orange-2)}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-navy:hover{background:var(--navy-3)}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line-2)}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c9c4}
  .btn-danger:hover{background:var(--red);color:#fff}
  .btn-sm{padding:6px 11px;font-size:12.5px}
  .btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--orange);outline-offset:2px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .stat .v{font-family:'Archivo';font-weight:800;font-size:34px;color:var(--navy);line-height:1.1;margin-top:6px}
  .stat .bar{height:4px;border-radius:3px;margin-top:14px}

  .proj-section{font-size:13px;font-weight:700;color:var(--navy);margin:26px 0 10px;text-transform:uppercase;letter-spacing:.04em}
  .done-row{cursor:pointer}
  .done-row:hover td{background:#f7f8fb}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:16px;color:var(--navy)}
  .panel-head .spacer{flex:1}
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px}
  @media(max-width:1000px){.grid-2{grid-template-columns:1fr}}

  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:220px;max-width:360px}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;background:#fff}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .count-pill{font-size:12.5px;color:var(--muted);font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);font-weight:600;padding:12px 16px;background:var(--navy);color:#b9c8e6;position:sticky;top:0}
  .panel thead th{background:#f7f8fb;color:var(--muted)}
  tbody td{padding:12px 16px;border-top:1px solid var(--line)}
  tbody tr:hover{background:#fbfcfe}
  td .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .table-wrap{overflow:auto;max-height:none}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    padding:3px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%}
  .chip{display:inline-block;font-size:12px;font-weight:600;color:var(--navy);background:#eef2fb;
    border:1px solid #dde5f6;padding:2px 8px;border-radius:7px;margin:2px 3px 2px 0}

  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .empty h4{font-size:17px;color:var(--navy);margin-bottom:6px}
  .empty p{margin:0 auto 16px;max-width:360px;line-height:1.55;font-size:14px}
  .loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,20,50,.5);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,20,50,.35);
    animation:pop .16s ease}
  .modal.wide{max-width:760px}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:18px;color:var(--navy);flex:1}
  .modal-head .x{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
  .modal-head .x:hover{background:var(--paper);color:var(--ink)}
  .modal-body{padding:22px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 16px 16px}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1 / -1}
  .field label{font-size:12px;font-weight:600;color:var(--navy)}
  .field input,.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .field textarea{resize:vertical;min-height:70px}
  .err{color:var(--red);font-size:13px;font-weight:600;margin-right:auto;align-self:center}
  .pick-list{max-height:340px;overflow-y:auto;border:1px solid var(--line-2);border-radius:11px}
  .pick{display:flex;align-items:center;gap:11px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .pick:last-child{border-bottom:0}
  .pick:hover{background:#fbfcfe}
  .pick input{width:16px;height:16px;accent-color:var(--orange);flex:none}
  .pick .pk-name{font-size:14px;font-weight:600;color:var(--ink)}
  .pick .pk-email{font-size:12.5px;color:var(--muted);margin-left:auto}
  .pk-more,.pk-empty{padding:14px;text-align:center;font-size:13px;color:var(--muted)}
  .linked-dot{color:var(--aqua);font-size:12px;margin-left:5px;cursor:default}
  .col-menu{position:absolute;z-index:120;background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 34px rgba(0,20,50,.18);padding:8px;min-width:190px}
  .col-menu-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 10px 8px}
  .col-menu-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .col-menu-item:hover{background:var(--paper)}
  .col-menu-item input{width:16px;height:16px;accent-color:var(--orange)}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;
    box-shadow:0 12px 30px rgba(0,20,50,.35);opacity:0;pointer-events:none;transition:.22s;z-index:200}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--red)}

  .board-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .board-top select{padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;background:#fff;font-weight:600;color:var(--navy)}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
  .col{background:#eef1f7;border:1px solid var(--line-2);border-radius:14px;min-height:120px;display:flex;flex-direction:column}
  .col.drag-over{outline:2px dashed var(--orange);outline-offset:-2px;background:#fff5e6}
  .col-head{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:13px;color:var(--navy)}
  .col-head .n{margin-left:auto;font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);background:#fff;padding:1px 8px;border-radius:20px;border:1px solid var(--line-2)}
  .col-body{padding:4px 10px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
  .task{background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:12px;cursor:grab;box-shadow:0 1px 2px rgba(0,40,99,.05)}
  .task:hover{border-color:var(--navy-3)}
  .task.dragging{opacity:.5}
  .task .t-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
  .task .t-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .task .t-assignee{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-left:auto}
  .mini-avatar{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-family:'Archivo'}
  .add-task{background:transparent;border:1px dashed var(--line-2);color:var(--muted);border-radius:10px;padding:9px;
    font-size:13px;font-weight:600;cursor:pointer;margin:2px 10px 12px}
  .add-task:hover{border-color:var(--orange);color:var(--navy)}

  .comment{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .comment .body{flex:1}
  .comment .who{font-size:12.5px;font-weight:700;color:var(--navy)}
  .comment .when{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
  .comment p{margin:3px 0 0;font-size:13.5px;line-height:1.5}
  .comment .del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px}
  .comment .del:hover{color:var(--red)}
  .add-comment{display:flex;gap:8px;margin-top:12px}
  .add-comment input{flex:1;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;font-size:14px}

  .yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .yt-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .yt-card h4{font-size:15px;color:var(--navy);margin-bottom:2px}
  .yt-card .yt-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .yt-stats{display:flex;gap:18px;margin-bottom:12px}
  .yt-stats .s .n{font-family:'Archivo';font-weight:800;font-size:22px;color:var(--navy)}
  .yt-stats .s .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .spark{width:100%;height:44px;display:block}

  @media(max-width:820px){
    .sidebar{position:static;width:100%;flex-direction:row;align-items:center;height:auto;overflow:auto}
    .brand{padding:12px 16px}.brand .sub{display:none}
    .nav{display:flex;padding:8px;gap:4px}.nav-label{display:none}
    .nav button{white-space:nowrap;margin:0}
    .side-foot{display:none}
    .main{margin-left:0}
    .form-grid{grid-template-columns:1fr}
  }

  .on-dot{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid #fff}
  .perm-matrix{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
  .perm-matrix th{background:#f7f8fb;color:var(--muted);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .perm-matrix th:first-child{text-align:left}
  .perm-matrix td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .perm-matrix input{width:17px;height:17px;accent-color:var(--orange)}
  td.pm{white-space:nowrap;text-align:center}
  .pm-on{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;color:var(--green);background:color-mix(in srgb,var(--green) 14%,#fff);border:1px solid color-mix(in srgb,var(--green) 30%,#fff);border-radius:5px;padding:1px 4px;margin:0 1px}
  .pm-off{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;color:#c2c7d0;background:#f4f5f8;border:1px solid #e7eaf1;border-radius:5px;padding:1px 4px;margin:0 1px}
  .perm-matrix tr.pm-group td{background:#f7f8fb;font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 10px}
  .role-matrix{width:100%;border-collapse:collapse}
  .role-matrix th{background:#f7f8fb;padding:14px 16px;text-align:center;vertical-align:top;border-bottom:1px solid var(--line)}
  .role-matrix th:first-child{text-align:left;position:sticky;left:0;z-index:2;color:var(--muted);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .role-matrix td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  .role-matrix td:first-child{text-align:left;font-size:13.5px;font-weight:600;color:var(--ink);position:sticky;left:0;background:#fff;z-index:1}
  .role-matrix tbody tr:hover td{background:#fafbfd}
  .role-matrix tr.role-group td{background:#f7f8fb;font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 16px}
  .role-name{font-family:'Archivo';font-size:14.5px;font-weight:800;color:var(--navy)}
  .role-desc{font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.45;margin:4px auto 0;max-width:180px}

  .tool-list{display:flex;flex-direction:column}
  .panel.tool-panel{overflow:visible}
  .tool-row{display:flex;gap:16px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line)}
  .tool-row:first-child{border-top:0}
  .tool-row.editing{background:#fbfcfe}
  .tr-main{flex:1;min-width:0}
  .tr-name{font-weight:700;font-size:14.5px;color:var(--navy)}
  .tr-url{display:inline-block;font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);text-decoration:none;margin-top:2px;word-break:break-all}
  .tr-url:hover{color:var(--navy);text-decoration:underline}
  .tr-desc{font-size:13.5px;line-height:1.5;margin-top:6px}
  .tr-chips{margin-top:7px}
  .tr-acts{display:flex;gap:6px;align-items:center;flex:none}
  .tr-fields{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tr-in{padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff;width:100%}
  .tr-active{grid-column:1 / -1;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--navy)}
  .tr-active input{width:16px;height:16px;accent-color:var(--orange)}
  .ms{position:relative}
  .ms-btn{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;background:#fff;font-size:13.5px;cursor:pointer;text-align:left}
  .ms-btn:hover{border-color:var(--navy-3)}
  .ms-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}

  @media (max-width:860px){

.cal-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}
.cal-toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}
.cal-month{font-weight:700;font-size:16px;min-width:170px;text-align:center}
.cal-legend{display:flex;gap:14px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal-dow{background:var(--navy);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 6px;text-align:center;font-weight:700}

.cal-add:hover{opacity:1!important}
.cal-ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--ev,var(--navy));background:#f4f6fa;border-radius:5px;padding:4px 6px;font:inherit;font-size:11.5px;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev:hover{background:#eaeef6}
.cal-ev.pre{background:#f6f7f8;border-left-style:dashed}

.cal-more{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px;text-align:left}
.cal-day{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.cal-day h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cal-row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.cal-row:first-of-type{border-top:0}

.cal-title{font-weight:600}
.cal-meta{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;vertical-align:1px}
.tag-live{background:#fdece9;color:#EA4E3D}
.tag-pre{background:#e7fbf3;color:#0b7a58}
.tag-status{background:#eef1f6;color:var(--muted)}
.ppl-pick{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.ppl-pick label{display:flex;gap:8px;align-items:center;padding:3px 2px;font-size:13.5px;cursor:pointer}
.ser-when{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <span class="mark">FantasyNow+</span>
    <h1 id="gateTitle">Admin access required</h1>
    <p id="gateMsg">You need to be signed in as an admin to view this portal.</p>
    <div class="gate-login">
      <input id="gEmail" type="email" placeholder="Email" autocomplete="username">
      <input id="gPass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateLogin()">
      <div id="gErr" class="gate-err"></div>
      <button id="gBtn" class="btn" onclick="gateLogin()">Sign in</button>
    </div>
    <a class="gate-alt" href="index.html">Or sign in on the main site &rarr;</a>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">FN+</span>
      <div><div style="font-size:14px;font-weight:800;font-family:'Archivo';color:#fff;line-height:1">Admin</div>
      <div class="sub">Portal</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">Overview</div>
      <button data-go="dashboard" class="active">Dashboard</button>
      <div class="nav-label">People</div>
      <button data-go="subscribers">Subscribers</button>
      <button class="nav-link" data-go="recruitment" onclick="go('recruitment')">Recruitment</button>
      <button data-go="onboarding">Onboarding</button>
      <button data-go="staff">Staff</button>
      <button data-go="org">Org chart</button>
      <button data-go="my_onboarding" id="navMyOnboarding" style="display:none">My Onboarding</button>
      <div class="nav-label">Content</div>
      <button data-go="channels">Channels</button>
      <button data-go="shows">Shows</button>
      <button data-go="calendar">Content calendar</button>
      <button data-go="gamepicks">Game Picks</button>
      <button data-go="startsit">Start/Sit Showdown</button>
      <div class="nav-label">Work</div>
      <button data-go="board">Project Board</button>
      <button data-go="youtube">YouTube Stats</button>
      <button data-go="tools">Tools &amp; links</button>
      <div class="nav-label">Access</div>
      <button data-go="roles">Roles &amp; permissions</button>
    </nav>
    <div class="side-foot">
      <div class="who">
        <div class="avatar" id="meAvatar">?</div>
        <div><div class="name" id="meName">—</div></div>
      </div>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="toast"></div>

<script src="javascript/auth.js"></script>
<script src="javascript/admin-gamepicks-section.js"></script>
<script>
const GATE_LEVEL = 7;

const NAV_TITLES = {
  dashboard:'Dashboard', staff:'Staff', subscribers:'Subscribers', recruitment:'Recruitment',
  onboarding:'Onboarding', my_onboarding:'My Onboarding', org:'Org chart',
  shows:'Shows', tools:'Tools & links', channels:'Channels', youtube:'YouTube Stats', board:'Project Board', roles:'Roles & permissions', startsit: 'Start/Sit Showdown', gamepicks: 'Game Picks', calendar: 'Content calendar'
};
const STATUS = {
  todo:{label:'To Do',color:'var(--muted)'},
  in_progress:{label:'In Progress',color:'var(--orange)'},
  review:{label:'Review',color:'var(--violet)'},
  done:{label:'Done',color:'var(--green)'},
  blocked:{label:'Blocked',color:'var(--red)'}
};
const PRIORITY = {
  low:{label:'Low',color:'var(--sky)'}, medium:{label:'Medium',color:'var(--muted)'},
  high:{label:'High',color:'var(--orange)'}, urgent:{label:'Urgent',color:'var(--red)'}
};
const ACCENTS = ['var(--violet)','var(--pink)','var(--sky)','var(--green)','var(--yellow)','var(--red)','var(--aqua)','var(--orange)'];

let ME = null;
let ADMINS = [];
let CHANNELS_CACHE = [];
let MY_STAFF_ID = null;

let PERMS = {};
let ROLES = [];
const RESOURCE_GROUPS = [
  {label:'People', keys:['staff','org','recruitment','onboarding','onboarding_template','subscribers']},
  {label:'Content', keys:['shows','calendar','tools','channels','youtube', 'startsit', 'gamepicks']},
  {label:'Work', keys:['board']},
  {label:'Access', keys:['roles']}
];
function resourceGroups(){
  const seen={};
  const groups=RESOURCE_GROUPS.map(g=>{
    const keys=g.keys.filter(k=>{ if(RESOURCES[k]){ seen[k]=1; return true; } return false; });
    return {label:g.label, keys};
  }).filter(g=>g.keys.length);
  const rest=Object.keys(RESOURCES).filter(k=>!seen[k]);
  if(rest.length) groups.push({label:'Other', keys:rest});
  return groups;
}
const RESOURCES = {
  staff:'Staff', subscribers:'Subscribers', shows:'Shows', tools:'Tools & links', recruitment:'Recruitment', 
  onboarding:'Onboarding', onboarding_template:'Onboarding template', org:'Org chart',
  channels:'Channels', youtube:'YouTube Stats', board:'Project Board', roles:'Roles & permissions', startsit: 'Start/Sit Showdown', gamepicks: 'Game Picks', calendar: 'Content calendar'
};
function can(resource, action){
  if(ME && ME.admin_level >= 9) return true;
  const p = PERMS[resource];
  return !!(p && p[action]);
}
function ifCan(resource, action, html){ return can(resource, action) ? html : ''; }

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name){if(!name)return '?';return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
const HEADSHOT_DIR = 'assets/staff/';
function headshotSrc(v){
  if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  return v.indexOf('/')>=0 ? v.replace(/^\/+/,'') : HEADSHOT_DIR + v;
}
function headshotAbs(v){ const s=headshotSrc(v); return s ? new URL(s, location.href).href : ''; }
function avatarHtml(person, cls, bg){
  const src = headshotSrc(person && person.headshot);
  const ini = initials(person && (person.name || person.email));
  return src
    ? '<img class="'+cls+'" src="'+esc(src)+'" alt="" data-ini="'+esc(ini)+'">'
    : '<span class="'+cls+'"'+(bg?' style="background:'+bg+'"':'')+'>'+ini+'</span>';
}
document.addEventListener('error', function(e){
  const img = e.target;
  if(!img || img.tagName !== 'IMG' || !img.dataset.ini) return;
  const sp = document.createElement('span');
  sp.className = img.className;
  sp.textContent = img.dataset.ini;
  img.replaceWith(sp);
}, true);
function accentFor(str){let h=0;for(const c of (str||'x'))h=(h*31+c.charCodeAt(0))>>>0;return ACCENTS[h%ACCENTS.length];}
function fmtDate(d){
  if(!d)return '—';
  let dt;
  if(typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    const p=d.split('-');
    dt=new Date(+p[0], +p[1]-1, +p[2]);
  } else {
    dt=new Date(d);
  }
  if(isNaN(dt))return '—';
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fmtNum(n){return n==null?'—':Number(n).toLocaleString();}
function timeAgo(d){if(!d)return '';const s=(Date.now()-new Date(d))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

function toast(msg,bad){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(bad?' bad':'');setTimeout(()=>t.className='',2600);}

function sbCfg(){
  return {
    url: (typeof SUPABASE_URL!=='undefined')?SUPABASE_URL:'',
    key: (typeof SUPABASE_ANON_KEY!=='undefined')?SUPABASE_ANON_KEY:'',
    token: localStorage.getItem('sb-auth-token')
  };
}
async function api(path, opts){
  opts=opts||{};
  const {url,key,token}=sbCfg();
  const headers=Object.assign({
    'apikey':key,'Authorization':'Bearer '+(token||key),'Content-Type':'application/json'
  }, opts.headers||{});
  const res=await fetch(url+'/rest/v1/'+path, Object.assign({},opts,{headers}));
  if(!res.ok){const txt=await res.text();throw new Error(res.status+' '+txt);}
  if(res.status===204)return null;
  const txt=await res.text();return txt?JSON.parse(txt):null;
}
const dbGet   =(p)=>api(p,{method:'GET'});
const dbPost  =(p,b)=>api(p,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(b)});
const dbPatch =(p,b)=>api(p,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(b)});
const dbDel   =(p)=>api(p,{method:'DELETE'});
async function rpc(name, body){
  const {url,key,token}=sbCfg();
  const res=await fetch(url+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':key,'Authorization':'Bearer '+(token||key),'Content-Type':'application/json'},
    body:JSON.stringify(body||{})
  });
  if(!res.ok){const t=await res.text();throw new Error(res.status+' '+t);}
  const t=await res.text();return t?JSON.parse(t):null;
}

async function gateLogin(){
  const email=document.getElementById('gEmail').value.trim();
  const pw=document.getElementById('gPass').value;
  const err=document.getElementById('gErr'); err.textContent='';
  if(!email||!pw){ err.textContent='Enter your email and password.'; return; }
  const btn=document.getElementById('gBtn'); btn.disabled=true; btn.textContent='Signing in…';
  try{
    if(typeof SUPABASE_URL==='undefined') throw new Error('noconfig');
    const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
      method:'POST', headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pw})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error_description||data.msg||data.message||'Login failed');
    if(!data.access_token) throw new Error('No token returned');
    localStorage.setItem('sb-auth-token', data.access_token);
    boot();
  }catch(e){
    err.textContent = e.message==='noconfig' ? 'Sign-in isn\'t available (auth.js didn\'t load).' : 'Sign in failed. Check your email and password.';
    btn.disabled=false; btn.textContent='Sign in';
  }
}

function gateMsg(title,msg){
  document.getElementById('gateTitle').textContent=title;
  document.getElementById('gateMsg').textContent=msg;
  document.getElementById('gate').style.display='flex';
  document.getElementById('app').style.display='none';
}
async function waitForConfig(timeout){
  timeout=timeout||5000;const start=Date.now();
  while(Date.now()-start<timeout){
    if(typeof SUPABASE_URL!=='undefined' && typeof SUPABASE_ANON_KEY!=='undefined') return true;
    await new Promise(r=>setTimeout(r,120));
  }
  return false;
}
function decodeJwt(tok){
  try{const seg=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(escape(atob(seg))));}catch(e){return null;}
}

async function boot(){
  if(!(await waitForConfig())){
    gateMsg('Auth didn\'t load',
      'This page couldn\'t find auth.js (SUPABASE_URL is undefined). Check the <script src="javascript/auth.js"> path is right for where admin.html sits, and open it through your site URL — not a local file:// path.');
    return;
  }
  const token = localStorage.getItem('sb-auth-token');
  if(!token){
    gateMsg('Staff Access Required',
      'Only FantasyNow+ staff has access to login.');
    return;
  }
  const claims = (window.auth && auth.user && auth.user.sub) ? auth.user : decodeJwt(token);
  const uid = claims && claims.sub;
  if(!uid){
    gateMsg('Session problem','Your saved sign-in couldn\'t be read. Log out and back in on the site, then return here.');
    return;
  }
  try{
    const rows = await dbGet('profiles?select=*&id=eq.'+uid);
    ME = rows && rows[0];
  }catch(e){
    gateMsg('Couldn\'t verify access','Signed in, but the profile lookup failed: '+e.message);
    return;
  }
  const lvl = ME && ME.admin_level ? ME.admin_level : 0;
  if(!ME){ gateMsg('Admin access required','Found a session but no matching profile row. Log out and back in on the site.'); return; }
  try{ if(ME.role_id){ const r = await dbGet('roles?select=permissions&id=eq.'+ME.role_id); if(r&&r[0]) PERMS = r[0].permissions||{}; } }catch(e){ PERMS = {}; }
  try{ MY_STAFF_ID = await rpc('my_staff_id'); }catch(e){ MY_STAFF_ID = null; }
  if(!(lvl>=9 || MY_STAFF_ID || Object.keys(RESOURCES).some(k=>can(k,'r')))){
    gateMsg('No access yet','Your account isn\'t linked to a staff record and has no dashboard permissions. Ask an owner to set you up.');
    return;
  }
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('meName').textContent = ME.name || ME.email || 'Admin';
  const meAv = document.getElementById('meAvatar');
  meAv.textContent = initials(ME.name||ME.email);
  if(MY_STAFF_ID){
    dbGet('staff?select=headshot&id=eq.'+MY_STAFF_ID).then(r=>{
      const hs = r && r[0] && r[0].headshot;
      const src = headshotSrc(hs);
      if(!src) return;
      const img = document.createElement('img');
      img.className = 'avatar';
      img.id = 'meAvatar';
      img.src = src;
      img.alt = '';
      img.dataset.ini = initials(ME.name||ME.email);
      meAv.replaceWith(img);
    }).catch(()=>{});
  }
  document.getElementById('logoutBtn').onclick = ()=>{ if(window.auth&&auth.logout)auth.logout(); else {localStorage.removeItem('sb-auth-token');location.href='index.html';} };

  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));

  try{ ADMINS = await dbGet('profiles?select=id,name,email&role_id=not.is.null&order=name.asc') || []; }catch(e){ ADMINS=[]; }
  try{ ROLES = await dbGet('roles?select=*&order=name.asc') || []; }catch(e){ ROLES=[]; }
  document.querySelectorAll('#nav button[data-go]').forEach(b=>{
    const k=b.dataset.go;
    if(RESOURCES[k] && !can(k,'r')) b.style.display='none';
  });
  const myOnbBtn=document.getElementById('navMyOnboarding');
  if(myOnbBtn) myOnbBtn.style.display = MY_STAFF_ID ? '' : 'none';

  dbPatch('profiles?id=eq.'+ME.id,{last_seen:new Date().toISOString()}).catch(()=>{});
  if(!window._fnpHeartbeat){ window._fnpHeartbeat=setInterval(()=>{ if(ME) dbPatch('profiles?id=eq.'+ME.id,{last_seen:new Date().toISOString()}).catch(()=>{}); }, 120000); }

  go('dashboard');
}

function go(name){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.go===name));
  document.getElementById('pageTitle').textContent = NAV_TITLES[name] || name;
  document.getElementById('topActions').innerHTML='';
  document.getElementById('content').innerHTML='<div class="loading">Loading…</div>';
  if(RESOURCES[name] && !can(name,'r')){
    document.getElementById('content').innerHTML='<div class="empty"><h4>No access</h4><p>You don\'t have permission to view this section.</p></div>';
    return;
  }
  const fn = {dashboard:loadDashboard, staff:loadStaff, subscribers:loadSubscribers, recruitment:loadRecruitment,
    onboarding:loadOnboarding, my_onboarding:loadMyOnboarding, org:loadOrg,
    shows:loadShows, tools:loadTools, channels:loadChannels, youtube:loadYouTube, board:loadBoard, roles:loadRoles, calendar:loadCalendar,
    startsit:loadStartsit, gamepicks:loadGamePicks}[name];
    
  fn().catch(err=>{
    document.getElementById('content').innerHTML =
      '<div class="empty"><h4>Couldn\'t load this</h4><p>'+esc(err.message)+'</p></div>';
  });
}

function topAction(html){document.getElementById('topActions').innerHTML=html;}

function badge(text,color){return '<span class="badge" style="color:'+color+';background:color-mix(in srgb,'+color+' 14%,#fff);border:1px solid color-mix(in srgb,'+color+' 30%,#fff)"><span class="dot" style="background:'+color+'"></span>'+esc(text)+'</span>';}

/* ---------------- MODAL ---------------- */
function modal(opts){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML =
    '<div class="modal'+(opts.wide?' wide':'')+'">'+
      '<div class="modal-head"><h3>'+esc(opts.title)+'</h3><button class="x" aria-label="Close">&times;</button></div>'+
      '<div class="modal-body">'+opts.body+'</div>'+
      (opts.footer===false?'':
        '<div class="modal-foot"><span class="err" id="mErr"></span>'+
        '<button class="btn btn-ghost" data-cancel>Cancel</button>'+
        '<button class="btn btn-primary" data-save>'+esc(opts.saveLabel||'Save')+'</button></div>')+
    '</div>';
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('.x').onclick=close;
  bg.addEventListener('click',e=>{if(e.target===bg)close();});
  const cancel=bg.querySelector('[data-cancel]');if(cancel)cancel.onclick=close;
  const saveBtn=bg.querySelector('[data-save]');
  if(saveBtn&&opts.onSave){
    saveBtn.onclick=async()=>{
      const err=bg.querySelector('#mErr');err.textContent='';
      saveBtn.disabled=true;saveBtn.textContent='Saving…';
      try{ await opts.onSave(bg); close(); }
      catch(e){ console.error(e); err.textContent=e.message; saveBtn.disabled=false;saveBtn.textContent=opts.saveLabel||'Save'; }
    };
  }
  if(opts.onReady)opts.onReady(bg);
  return {el:bg,close};
}
function val(bg,name){const el=bg.querySelector('[name="'+name+'"]');return el?el.value.trim():'';}
function confirmDelete(what,onYes){
  modal({title:'Delete '+what+'?',body:'<p style="margin:0;line-height:1.5;color:var(--muted)">This can\'t be undone.</p>',
    saveLabel:'Delete',onSave:async()=>{await onYes();}});
}

function detailRow(label,val){ return '<div style="display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)"><div style="min-width:120px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">'+esc(label)+'</div><div style="flex:1;font-size:14px">'+val+'</div></div>'; }
function viewShow(id){ document.querySelectorAll('.modal-bg').forEach(m=>m.remove()); showDetail(id); }
function viewStaff(id){ document.querySelectorAll('.modal-bg').forEach(m=>m.remove()); staffDetail(id); }
function viewChannel(id){ document.querySelectorAll('.modal-bg').forEach(m=>m.remove()); channelDetail(id); }

async function showDetail(id){
  const rows = await dbGet('shows?select=*,channel:channels(name),host_links:show_hosts(staff(id,name))&id=eq.'+id);
  const s = rows&&rows[0]; if(!s) return;
  const hosts=(s.host_links||[]).map(h=>h.staff).filter(Boolean);
  modal({title:s.name,wide:true,footer:false,
    body:'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+

        '<div class="table-wrap"><table><tbody>'+(elevated.length?elevated.map(a=>{

async function loadRoles(){
  if(!can('roles','r')){ document.getElementById('content').innerHTML='<div class="empty"><h4>No access</h4><p>You don\'t have permission to manage roles.</p></div>'; return; }
  topAction(ifCan('roles','c','<button class="btn btn-primary" onclick="roleForm()">+ New role</button>'));
  ROLES = await dbGet('roles?select=*&order=name.asc')||[];
  if(!ROLES.length){
    document.getElementById('content').innerHTML='<div class="empty"><h4>No roles yet</h4><p>Create a role and choose what it can do in each section.</p>'+ifCan('roles','c','<button class="btn btn-primary" onclick="roleForm()">+ New role</button>')+'</div>';
    return;
  }
  const cell=(perm,k,a)=> (perm&&perm[k]&&perm[k][a])?'<span class="pm-on">'+a.toUpperCase()+'</span>':'<span class="pm-off">'+a.toUpperCase()+'</span>';
  const head='<tr><th>Section</th>'+ROLES.map(r=>'<th>'+
      '<div class="role-name">'+esc(r.name)+'</div>'+
      (r.description?'<div class="role-desc">'+esc(r.description)+'</div>':'')+
      ((can('roles','u')||can('roles','d'))?'<div style="display:flex;gap:6px;justify-content:center;margin-top:9px">'+
        ifCan('roles','u','<button class="btn btn-ghost btn-sm" onclick=\'roleForm("'+r.id+'")\'>Edit</button>')+
        ifCan('roles','d','<button class="btn btn-danger btn-sm" onclick=\'roleDelete("'+r.id+'")\'>Delete</button>')+'</div>':'')+
    '</th>').join('')+'</tr>';
  const body=resourceGroups().map(g=>
    '<tr class="role-group"><td colspan="'+(ROLES.length+1)+'">'+esc(g.label)+'</td></tr>'+
    g.keys.map(k=>'<tr><td>'+esc(RESOURCES[k])+'</td>'+
      ROLES.map(r=>'<td>'+['c','r','u','d'].map(a=>cell(r.permissions,k,a)).join('')+'</td>').join('')+
    '</tr>').join('')
  ).join('');
  document.getElementById('content').innerHTML =
    '<div class="panel"><div class="table-wrap"><table class="role-matrix"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
}

function roleForm(id){
  const r = id? ROLES.find(x=>x.id===id) : {permissions:{}};
  const perm = r.permissions||{};
  const rows = resourceGroups().map(g=>
    '<tr class="pm-group"><td colspan="5">'+esc(g.label)+'</td></tr>'+
    g.keys.map(k=>{
      const p = perm[k]||{};
      return '<tr><td style="font-weight:600">'+RESOURCES[k]+'</td>'+
        ['c','r','u','d'].map(a=>'<td style="text-align:center"><input type="checkbox" data-res="'+k+'" data-act="'+a+'"'+(p[a]?' checked':'')+'></td>').join('')+'</tr>';
    }).join('')
  ).join('');
  modal({title:id?'Edit role':'New role',wide:true,saveLabel:id?'Save role':'Create role',
    body:'<div class="form-grid"><div class="field"><label>Role name</label><input name="name" value="'+esc(r.name||'')+'"></div>'+
      '<div class="field"><label>Description</label><input name="description" value="'+esc(r.description||'')+'"></div></div>'+
      '<table class="perm-matrix"><thead><tr><th>Section</th><th>Create</th><th>Read</th><th>Update</th><th>Delete</th></tr></thead><tbody>'+rows+'</tbody></table>',
    onSave:async(bg)=>{
      const name=val(bg,'name'); if(!name) throw new Error('Role name is required');
      const permissions={};
      bg.querySelectorAll('input[data-res]').forEach(cb=>{ if(cb.checked){ (permissions[cb.dataset.res]=permissions[cb.dataset.res]||{})[cb.dataset.act]=true; } });
      const body={name,description:val(bg,'description'),permissions};
      if(id) await dbPatch('roles?id=eq.'+id,body); else await dbPost('roles',body);
      loadRoles(); toast(id?'Role updated':'Role created');
    }});
}
function roleDelete(id){const r=ROLES.find(x=>x.id===id);confirmDelete('the "'+esc(r.name)+'" role',async()=>{
  await dbDel('roles?id=eq.'+id);loadRoles();toast('Role deleted');});}

const STAFF_COLS = [
  {key:'name', label:'Name', always:true, cell:s=>'<div style="display:flex;align-items:center;gap:9px">'+avatarHtml(s,'mini-avatar',accentFor(s.department))+'<strong>'+esc(s.name)+'</strong>'+(s.profile_id?'<span class="linked-dot" title="Linked to a login profile">\u25CF</span>':'')+'</div>'},
  {key:'role', label:'Role', cell:s=>esc(s.role||'—')},
  {key:'department', label:'Department', cell:s=>s.department?'<span class="chip">'+esc(s.department)+'</span>':'—'},
  {key:'email', label:'Email', cell:s=>esc(s.email||'—')},
  {key:'phone', label:'Phone', cell:s=>esc(s.phone||'—')},
  {key:'dob', label:'Date of birth', cell:s=>fmtDate(s.dob)},
  {key:'start_date', label:'Start', cell:s=>fmtDate(s.start_date)},

  {key:'is_active', label:'Status', cell:s=>s.is_active?badge('Active','var(--green)'):badge('Inactive','var(--muted)')},
];
function visibleStaffCols(){
  try{ const v=JSON.parse(localStorage.getItem('fnp-staff-cols')); if(Array.isArray(v)) return v; }catch(e){}
  return ['role','department','email','phone','start_date','is_active'];
}
function saveStaffCols(arr){ try{ localStorage.setItem('fnp-staff-cols', JSON.stringify(arr)); }catch(e){} }
function staffColumnsMenu(ev){
  document.querySelectorAll('.col-menu').forEach(m=>m.remove());
  const vis=visibleStaffCols();
  const menu=document.createElement('div'); menu.className='col-menu';
  menu.innerHTML='<div class="col-menu-h">Show columns</div>'+
    STAFF_COLS.filter(c=>!c.always).map(c=>'<label class="col-menu-item"><input type="checkbox" data-col="'+c.key+'"'+(vis.includes(c.key)?' checked':'')+'><span>'+esc(c.label)+'</span></label>').join('');
  document.body.appendChild(menu);
  const r=ev.currentTarget.getBoundingClientRect();
  menu.style.top=(r.bottom+6+window.scrollY)+'px';
  menu.style.left=Math.min(r.left+window.scrollX, window.innerWidth-200)+'px';
  menu.querySelectorAll('input[data-col]').forEach(cb=>cb.onchange=()=>{
    let cur=visibleStaffCols();
    if(cb.checked){ if(!cur.includes(cb.dataset.col)) cur.push(cb.dataset.col); } else cur=cur.filter(k=>k!==cb.dataset.col);
    saveStaffCols(cur);
    const sb=document.getElementById('searchBox');
    renderStaff(sb?sb.value.toLowerCase():'');
  });
  setTimeout(()=>{ const close=(e)=>{ if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('mousedown',close); } }; document.addEventListener('mousedown',close); },0);
}

async function createLoginForm(id){
  const rows = await dbGet('staff?select=id,name,email,profile_id&id=eq.'+id); const staff=rows&&rows[0]; if(!staff) return;
  if(staff.profile_id){ toast('This person already has a login',true); return; }
  const genPw = ()=>Math.random().toString(36).slice(2,8)+Math.floor(10+Math.random()*90)+'!';
  modal({title:'Create login for '+staff.name, saveLabel:'Create account',
    body:'<p style="margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5">Creates a login and links it to this staff record. Share the password with them — they can change it later.</p>'+
      '<div class="form-grid">'+
      '<div class="field full"><label>Email</label><input name="email" type="email" value="'+esc(staff.email||'')+'"></div>'+
      '<div class="field full"><label>Temporary password</label><input name="password" value="'+genPw()+'"></div>'+
      '</div>',
    onSave:async(bg)=>{
      const email=val(bg,'email'), password=val(bg,'password');
      if(!email||!password) throw new Error('Email and password are required');
      const res = await fetch(SUPABASE_URL+'/functions/v1/create-user',{
        method:'POST',
        headers:{'Authorization':'Bearer '+localStorage.getItem('sb-auth-token'),'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({email,password,name:staff.name})
      });
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||'Failed to create login');
      const newId=data.id||data.user_id;
      if(!newId) throw new Error('create-user returned no id: '+JSON.stringify(data).slice(0,150));
      await dbPatch('staff?id=eq.'+staff.id,{profile_id:newId});
      STAFF = await dbGet('staff?select=*&order=name.asc')||[];
      document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
      renderStaff('');
      toast('Login created for '+staff.name);
      modal({title:'Login created', footer:false,
        body:'<p style="line-height:1.6;font-size:14px">Share these with <strong>'+esc(staff.name)+'</strong>:</p>'+
          detailRow('Email', esc(data.email||email))+detailRow('Temp password','<span class="mono">'+esc(data.password||password)+'</span>')+
          '<p style="color:var(--muted);font-size:13px;margin-top:12px">They can log in right away and change their password later.</p>'});
    }});
}

function renderStaff(q){

  const head = cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'<th></th>';
  const body = rows.length? rows.map(s=>'<tr>'+cols.map(c=>'<td>'+c.cell(s)+'</td>').join('')+
      '<td><div class="row-actions"><button class="btn btn-ghost btn-sm" onclick=\'viewStaff("'+s.id+'")\'>View</button>'+ifCan('staff','u','<button class="btn btn-ghost btn-sm" onclick=\'staffForm("'+s.id+'")\'>Edit</button>')+ifCan('staff','d','<button class="btn btn-danger btn-sm" onclick=\'staffDelete("'+s.id+'")\'>Delete</button>')+'</div></td></tr>').join('')

    toolbar('Search staff by name, role, department…','<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="staffColumnsMenu(event)">Columns</button> <span class="count-pill">'+rows.length+' of '+STAFF.length+'</span>')+

  bindSearch(renderStaff);
}

  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');

  a.download='subscribers.csv';a.click();toast('Exported '+SUBS.length+' subscribers');

function parseSubscribers(text){
  const emailRe=/[^\s,;<>()"']+@[^\s,;<>()"']+\.[^\s,;<>()"']+/g;
  const seen=new Set(); const rows=[]; let skipped=0;
  (text||'').split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    const found=line.match(emailRe); if(!found) return;
    const add=(email,name)=>{ email=email.toLowerCase(); if(seen.has(email)){skipped++;return;} seen.add(email); rows.push({name:(name||'').trim()||null,email,source:'import'}); };
    if(found.length===1){
      const name=line.replace(found[0],'').replace(/[",;<>()]/g,' ').replace(/\s+/g,' ');
      add(found[0],name);
    } else { found.forEach(e=>add(e,'')); }
  });
  return {rows,skipped};
}
function subImport(){
  modal({title:'Import subscribers',wide:true,saveLabel:'Import',
    body:'<p style="margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.55">Upload a CSV or paste a list — one subscriber per line, as <strong>Name, email@example.com</strong> or just the email. Lines without a valid email are ignored, and duplicates are skipped automatically.</p>'+
      '<div class="field full" style="margin-bottom:14px"><label>CSV file</label><input type="file" id="impFile" accept=".csv,text/csv,text/plain"></div>'+
      '<div class="field full"><label>Or paste / review here</label><textarea id="impText" style="min-height:150px;font-family:\'IBM Plex Mono\',monospace;font-size:13px" placeholder="Jane Smith, jane@example.com&#10;john@example.com"></textarea></div>'+
      '<div id="impHint" style="font-size:13px;color:var(--muted);margin-top:10px;font-weight:600"></div>',
    onReady:(bg)=>{
      const ta=bg.querySelector('#impText'), hint=bg.querySelector('#impHint');
      const updateHint=()=>{ const {rows,skipped}=parseSubscribers(ta.value); hint.textContent=rows.length?(rows.length+' valid email'+(rows.length===1?'':'s')+' found'+(skipped?', '+skipped+' duplicate'+(skipped===1?'':'s')+' in list skipped':'')+'.'):''; };
      bg.querySelector('#impFile').onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ ta.value=r.result; updateHint(); }; r.readAsText(f); };
      ta.oninput=updateHint;
    },
    onSave:async(bg)=>{
      const {rows}=parseSubscribers(bg.querySelector('#impText').value);
      if(!rows.length) throw new Error('No valid emails found to import.');
      const inserted = await api('subscribers?on_conflict=email',{method:'POST',headers:{'Prefer':'resolution=ignore-duplicates,return=representation'},body:JSON.stringify(rows)}) || [];
      const existed = rows.length - inserted.length;
      SUBS = await dbGet('subscribers?select=*&order=subscribed_at.desc')||[];
      renderSubs('');
      toast('Imported '+inserted.length+' new'+(existed>0?' ('+existed+' already existed)':''));
    }});
}

/* ---------- Content calendar ---------- */
const CAL_TARGET = '#content';
function calMount(html){ document.querySelector(CAL_TARGET).innerHTML = html; }

const EV_SELECT = 'id,title,show_id,channel_id,series_id,format,status,starts_at,duration_minutes,location,video_url,notes,'
  + 'show:shows(id,name,channel_id),channel:channels(id,name),'
  + 'people:event_people(id,role,staff_id,guest_id,staff:staff(id,name),guest:guests(id,name))';
const SER_SELECT = 'id,title,show_id,format,freq,dow,day_of_month,start_time,duration_minutes,tz,starts_on,ends_on,is_active,notes,show:shows(id,name)';

let CAL_TAB = 'month';
let CAL_MONTH = (function(){ const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
let CAL_EVENTS = [], CAL_SERIES = [], CAL_GUESTS = [], CAL_SHOWS = [], CAL_CHANNELS = [], CAL_STAFF = [];
let CAL_FILTER = { show:'', channel:'', format:'' };
const CAL_EXPAND = {};

const calv = id => (document.getElementById(id)?.value || '').trim();
const calChecked = sel => Array.from(document.querySelectorAll(sel)).filter(c=>c.checked).map(c=>c.value);
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function calDayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function calTime(iso){ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function calLongDay(d){ return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
function calTitle(e){ return e.title || e.show?.name || 'Untitled'; }
function calHosts(e){ return (e.people||[]).filter(p=>p.role==='host'||p.role==='cohost'); }
function calGuestsOf(e){ return (e.people||[]).filter(p=>p.role==='guest'); }

async function loadCalendar(){
  const from = new Date(CAL_MONTH.getFullYear(), CAL_MONTH.getMonth()-1, 1).toISOString();
  const to   = new Date(CAL_MONTH.getFullYear(), CAL_MONTH.getMonth()+3, 1).toISOString();
  const safe = p => p.catch(()=>[]);
  const [evs, series, guests, shows, chans, staff] = await Promise.all([
    safe(dbGet(`content_events?select=${EV_SELECT}&starts_at=gte.${from}&starts_at=lt.${to}&order=starts_at.asc`)),
    safe(dbGet(`content_series?select=${SER_SELECT}&order=title.asc`)),
    safe(dbGet('guests?select=id,name,org,email,handle,notes&order=name.asc')),
    safe(dbGet('shows?select=id,name,channel_id&order=name.asc')),
    safe(dbGet('channels?select=id,name&order=name.asc')),
    safe(dbGet('staff?select=id,name&is_active=eq.true&order=name.asc'))
  ]);
  CAL_EVENTS = evs; CAL_SERIES = series; CAL_GUESTS = guests;
  CAL_SHOWS = shows; CAL_CHANNELS = chans; CAL_STAFF = staff;
  renderCalendar();
}

function calTab(t){ CAL_TAB = t; renderCalendar(); }
function calSetFilter(k, v){ CAL_FILTER[k] = v; renderCalendar(); }
function calShift(n){
  CAL_MONTH = new Date(CAL_MONTH.getFullYear(), CAL_MONTH.getMonth()+n, 1);
  loadCalendar();
}
function calToday(){
  const d = new Date(); d.setDate(1); d.setHours(0,0,0,0);
  CAL_MONTH = d; loadCalendar();
}

function calFiltered(){
  return CAL_EVENTS.filter(e =>
    (!CAL_FILTER.show    || e.show_id === CAL_FILTER.show) &&
    (!CAL_FILTER.channel || (e.channel_id || e.show?.channel_id) === CAL_FILTER.channel) &&
    (!CAL_FILTER.format  || e.format === CAL_FILTER.format));
}

function renderCalendar(){
  const tabs = [['month','Calendar'],['list','Upcoming'],['series','Recurring'],['guests','Guests']];
  const add = CAL_TAB === 'series' ? ifCan('calendar','c','<button class="btn btn-primary" onclick="seriesForm()">+ Add recurring show</button>')
            : CAL_TAB === 'guests' ? ifCan('calendar','c','<button class="btn btn-primary" onclick="guestForm()">+ Add guest</button>')
            : ifCan('calendar','c','<button class="btn btn-primary" onclick="eventForm()">+ Add episode</button>');
  const body = CAL_TAB === 'month'  ? calMonthHtml()
             : CAL_TAB === 'list'   ? calListHtml()
             : CAL_TAB === 'series' ? calSeriesHtml()
             : calGuestsHtml();
  topAction(add);
  calMount(`<div class="onb-tabs">${tabs.map(([k,l])=>`<button class="${CAL_TAB===k?'on':''}" onclick="calTab('${k}')">${l}</button>`).join('')}</div>${body}`);
}

function calFilterBar(withNav){
  const opt = (list, sel) => list.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
  return `<div class="cal-toolbar">
    ${withNav ? `<button class="btn btn-ghost btn-sm" onclick="calShift(-1)">‹</button>
      <span class="cal-month">${CAL_MONTH.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span>
      <button class="btn btn-ghost btn-sm" onclick="calShift(1)">›</button>
      <button class="btn btn-ghost btn-sm" onclick="calToday()">Today</button>` : ''}
    <select onchange="calSetFilter('show',this.value)"><option value="">All shows</option>${opt(CAL_SHOWS, CAL_FILTER.show)}</select>
    <select onchange="calSetFilter('channel',this.value)"><option value="">All channels</option>${opt(CAL_CHANNELS, CAL_FILTER.channel)}</select>
    <select onchange="calSetFilter('format',this.value)">
      <option value="">Live + pre-recorded</option>
      <option value="live" ${CAL_FILTER.format==='live'?'selected':''}>Live only</option>
      <option value="prerecorded" ${CAL_FILTER.format==='prerecorded'?'selected':''}>Pre-recorded only</option>
    </select>
    <span class="cal-legend"><span><i style="background:#EA4E3D"></i>Live</span><span><i style="background:#42F4B0"></i>Pre-recorded</span></span>
  </div>`;
}

function calMonthHtml(){
  const y = CAL_MONTH.getFullYear(), m = CAL_MONTH.getMonth();
  const first = new Date(y, m, 1);
  const days = new Date(y, m+1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + days) / 7);
  const start = new Date(y, m, 1 - first.getDay());
  const todayKey = calDayKey(new Date());
  const byDay = {};
  calFiltered().forEach(e => { const k = calDayKey(new Date(e.starts_at)); (byDay[k] = byDay[k] || []).push(e); });

  let cells = '';
  for (let i = 0; i < weeks*7; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const key = calDayKey(d);
    const list = byDay[key] || [];
    const show = CAL_EXPAND[key] ? list : list.slice(0,3);
    cells += `<div class="cal-cell ${d.getMonth()!==m?'out':''} ${key===todayKey?'today':''}">
      <div class="cal-date"><span>${d.getDate()}</span>
        ${ifCan('calendar','c',`<button class="cal-add" title="Add episode" onclick="eventForm(null,'${key}')">+</button>`)}</div>
      ${show.map(e=>`<button class="cal-ev ${e.format==='live'?'live':'pre'} ${e.status==='canceled'?'canceled':''}"
          style="--ev:${e.format==='live'?'#EA4E3D':'#42F4B0'}" onclick="eventDetail('${e.id}')">
          <span class="cal-t">${calTime(e.starts_at)}</span>${esc(calTitle(e))}</button>`).join('')}
      ${list.length>3 && !CAL_EXPAND[key] ? `<button class="cal-more" onclick="calExpand('${key}')">+${list.length-3} more</button>` : ''}
    </div>`;
  }
  return calFilterBar(true) + `<div class="cal-grid">
    ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells}</div>`;
}
function calExpand(k){ CAL_EXPAND[k] = true; renderCalendar(); }

function calListHtml(){
  const now = Date.now();
  const list = calFiltered().filter(e => new Date(e.starts_at).getTime() > now - 6*3600e3)
                            .sort((a,b)=> new Date(a.starts_at) - new Date(b.starts_at));
  if (!list.length) return calFilterBar(false) + '<div class="empty">Nothing scheduled ahead.</div>';
  const byDay = {};
  list.forEach(e => { const k = calDayKey(new Date(e.starts_at)); (byDay[k] = byDay[k] || []).push(e); });
  return calFilterBar(false) + Object.keys(byDay).sort().map(k => {
    const d = new Date(k + 'T12:00:00');
    return `<div class="cal-day"><h4>${calLongDay(d)}</h4>${byDay[k].map(calRowHtml).join('')}</div>`;
  }).join('');
}

function calRowHtml(e){
  const hosts = calHosts(e).map(p => p.staff?.name || p.guest?.name).filter(Boolean);
  const gs = calGuestsOf(e).map(p => p.guest?.name || p.staff?.name).filter(Boolean);
  return `<div class="cal-row" onclick="eventDetail('${e.id}')">
    <div class="cal-when">${calTime(e.starts_at)}</div>
    <div class="cal-body">
      <div class="cal-title">${esc(calTitle(e))}
        <span class="tag ${e.format==='live'?'tag-live':'tag-pre'}">${e.format==='live'?'Live':'Pre-rec'}</span>
        ${e.status!=='scheduled'?`<span class="tag tag-status">${esc(e.status)}</span>`:''}</div>
      <div class="cal-meta">
        ${e.show?esc(e.show.name):'No show'}${e.channel?' · '+esc(e.channel.name):''}
        ${hosts.length?' · Host: '+esc(hosts.join(', ')):''}
        ${gs.length?' · Guests: '+esc(gs.join(', ')):''}
      </div>
    </div>
  </div>`;
}

/* ----- event create / edit ----- */
function eventForm(id, dayKey){
  const e = id ? CAL_EVENTS.find(x=>x.id===id) : null;
  const d = e ? new Date(e.starts_at) : (dayKey ? new Date(dayKey+'T19:00:00') : new Date());
  const dv = calDayKey(d);
  const tv = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const hostIds = e ? calHosts(e).map(p=>p.staff_id).filter(Boolean) : [];
  const guestIds = e ? calGuestsOf(e).map(p=>p.guest_id).filter(Boolean) : [];
  const opts = (list, sel) => list.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('');

  const m = modal({
    title: e ? 'Edit episode' : 'Add episode',
    wide: true,
    saveLabel: 'Save episode',
    body: `<div class="form-grid">
      <div class="field full"><label>Episode title</label>
        <input id="evTitle" value="${e?esc(e.title||''):''}" placeholder="Leave blank to use the show name"></div>
      <div class="field"><label>Show</label>
        <select id="evShow" onchange="evShowPick(this.value)"><option value="">— none —</option>${opts(CAL_SHOWS, e?.show_id)}</select></div>
      <div class="field"><label>Channel</label>
        <select id="evChannel"><option value="">— none —</option>${opts(CAL_CHANNELS, e?.channel_id || e?.show?.channel_id)}</select></div>
      <div class="field"><label>Type</label>
        <select id="evFormat">
          <option value="live" ${e?.format!=='prerecorded'?'selected':''}>Live</option>
          <option value="prerecorded" ${e?.format==='prerecorded'?'selected':''}>Pre-recorded</option>
        </select></div>
      <div class="field"><label>Status</label>
        <select id="evStatus">${['scheduled','recorded','published','canceled'].map(s=>
          `<option value="${s}" ${e?.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
      <div class="field"><label>Date</label><input type="date" id="evDate" value="${dv}"></div>
      <div class="field"><label>Start time</label><input type="time" id="evTime" value="${tv}"></div>
      <div class="field"><label>Length (min)</label><input type="number" id="evLen" min="5" step="5" value="${e?e.duration_minutes:60}"></div>
      <div class="field"><label>Location / studio</label><input id="evLoc" value="${e?esc(e.location||''):''}"></div>
      <div class="field full"><label>Video / stream link</label><input id="evUrl" value="${e?esc(e.video_url||''):''}"></div>
      <div class="field"><label>Hosts (staff)</label>
        <div class="ppl-pick">${CAL_STAFF.length?CAL_STAFF.map(s=>
          `<label><input type="checkbox" class="evHost" value="${s.id}" ${hostIds.includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join(''):'<div class="empty">No staff visible.</div>'}</div></div>
      <div class="field"><label>Guests</label>
        <div class="ppl-pick" id="evGuestPick">${CAL_GUESTS.length?CAL_GUESTS.map(g=>
          `<label><input type="checkbox" class="evGuest" value="${g.id}" ${guestIds.includes(g.id)?'checked':''}>${esc(g.name)}${g.org?' <span class="mono">· '+esc(g.org)+'</span>':''}</label>`).join(''):'<div class="empty">No guests yet.</div>'}</div>
        ${ifCan('calendar','c','<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="guestQuickAdd()">+ New guest</button>')}</div>
      <div class="field full"><label>Notes</label><textarea id="evNotes" rows="3">${e?esc(e.notes||''):''}</textarea></div>
    </div>`,
    onSave: async () => {
      const date = calv('evDate'), time = calv('evTime');
      if (!date || !time) throw new Error('Pick a date and time');
      const payload = {
        title: calv('evTitle') || null,
        show_id: calv('evShow') || null,
        channel_id: calv('evChannel') || null,
        format: calv('evFormat'),
        status: calv('evStatus'),
        starts_at: new Date(`${date}T${time}`).toISOString(),
        duration_minutes: parseInt(calv('evLen')||'60', 10),
        location: calv('evLoc') || null,
        video_url: calv('evUrl') || null,
        notes: calv('evNotes') || null
      };
      const hosts = calChecked('.evHost'), guests = calChecked('.evGuest');
      let eid = id;
      if (id){
        await dbPatch(`content_events?id=eq.${id}`, payload);            // db call
      } else {
        const ins = await dbPost('content_events', payload);
        eid = Array.isArray(ins) ? ins[0]?.id : ins?.id;
      }
      if (eid){
        await dbDel(`event_people?event_id=eq.${eid}`);                  // db call
        const rows = hosts.map(s=>({event_id:eid, role:'host', staff_id:s}))
          .concat(guests.map(g=>({event_id:eid, role:'guest', guest_id:g})));
        if (rows.length) await dbPost('event_people', rows);
      }
      toast('Episode saved');
      loadCalendar();
    }
  });
}

function evShowPick(showId){
  const s = CAL_SHOWS.find(x=>x.id===showId);
  const sel = document.getElementById('evChannel');
  if (s && s.channel_id && sel && !sel.value) sel.value = s.channel_id;
}

async function guestQuickAdd(){
  const name = prompt('Guest name');
  if (!name) return;
  const ins = await dbPost('guests', { name: name.trim() });
  const g = Array.isArray(ins) ? ins[0] : ins;
  if (!g?.id) return toast('Could not add guest');
  CAL_GUESTS.push({ id:g.id, name:g.name });
  CAL_GUESTS.sort((a,b)=>a.name.localeCompare(b.name));
  const pick = document.getElementById('evGuestPick');
  if (pick) pick.insertAdjacentHTML('beforeend',
    `<label><input type="checkbox" class="evGuest" value="${g.id}" checked>${esc(g.name)}</label>`);
}

/* ----- event detail (cross-links) ----- */
async function eventDetail(id){
  const rows = await dbGet(`content_events?select=${EV_SELECT}&id=eq.${id}`);
  const e = rows[0];
  if (!e) return toast('Episode not found');
  const chip = (label, fn) => `<button class="chip chip-link" onclick="${fn}">${esc(label)}</button>`;
  const hosts = calHosts(e).map(p => p.staff
      ? chip(p.staff.name, `viewStaff('${p.staff.id}')`)
      : chip(p.guest?.name || '—', `guestDetail('${p.guest_id}')`)).join(' ') || '<span class="mono">—</span>';
  const gs = calGuestsOf(e).map(p => p.guest
      ? chip(p.guest.name, `guestDetail('${p.guest.id}')`)
      : chip(p.staff?.name || '—', `viewStaff('${p.staff_id}')`)).join(' ') || '<span class="mono">—</span>';
  const when = new Date(e.starts_at);

  const m = modal({
    title: calTitle(e),
    wide: true,
    footer: false,
    body: `<div>
      <p class="mono">${calLongDay(when)} · ${calTime(e.starts_at)} · ${e.duration_minutes} min</p>
      <p><span class="tag ${e.format==='live'?'tag-live':'tag-pre'}">${e.format==='live'?'Live':'Pre-recorded'}</span>
         <span class="tag tag-status">${esc(e.status)}</span>
         ${e.series_id?'<span class="tag tag-status">Recurring</span>':''}</p>
      ${detailRow('Show', e.show ? chip(e.show.name, `viewShow('${e.show.id}')`) : '—')}
      ${detailRow('Channel', e.channel ? chip(e.channel.name, `viewChannel('${e.channel.id}')`) : '—')}
      ${detailRow('Hosts', hosts)}
      ${detailRow('Guests', gs)}
      ${detailRow('Location', esc(e.location||'—'))}
      ${detailRow('Link', e.video_url?`<a href="${esc(e.video_url)}" target="_blank" rel="noopener">${esc(e.video_url)}</a>`:'—')}
      ${detailRow('Notes', esc(e.notes||'—'))}
      <div class="row-actions" style="margin-top:14px">
        ${ifCan('calendar','u',`<button class="btn btn-primary btn-sm" onclick="calCloseThen(()=>eventForm('${e.id}'))">Edit</button>`)}
        ${ifCan('calendar','d',`<button class="btn btn-danger btn-sm" onclick="eventDelete('${e.id}')">Delete</button>`)}
      </div>
    </div>`
  });
  window.__calModal = m;
}
function calCloseThen(fn){ if (window.__calModal?.close) window.__calModal.close(); fn(); }

async function eventDelete(id){
  if (!confirm('Delete this episode?')) return;
  await dbDel(`content_events?id=eq.${id}`);                            // db call
  if (window.__calModal?.close) window.__calModal.close();
  toast('Episode deleted');
  loadCalendar();
}

/* ----- recurring series ----- */
function calSeriesHtml(){
  if (!CAL_SERIES.length) return '<div class="empty">No recurring shows yet. Add one to auto-fill the calendar.</div>';
  return `<div class="table-wrap"><table><thead><tr>
      <th>Series</th><th>Show</th><th>Type</th><th>Repeats</th><th>Runs</th><th></th>
    </tr></thead><tbody>${CAL_SERIES.map(s=>`<tr>
      <td><strong>${esc(s.title)}</strong>${s.is_active?'':' <span class="tag tag-status">Paused</span>'}</td>
      <td>${s.show?esc(s.show.name):'—'}</td>
      <td><span class="tag ${s.format==='live'?'tag-live':'tag-pre'}">${s.format==='live'?'Live':'Pre-rec'}</span></td>
      <td class="ser-when">${calFreqText(s)}</td>
      <td class="ser-when">${fmtDate(s.starts_on)}${s.ends_on?' – '+fmtDate(s.ends_on):' – ongoing'}</td>
      <td class="row-actions">
        ${ifCan('calendar','c',`<button class="btn btn-ghost btn-sm" onclick="seriesGenerate('${s.id}',false)">Generate</button>`)}
        ${ifCan('calendar','u',`<button class="btn btn-ghost btn-sm" onclick="seriesForm('${s.id}')">Edit</button>`)}
        ${ifCan('calendar','d',`<button class="btn btn-danger btn-sm" onclick="seriesDelete('${s.id}')">Delete</button>`)}
      </td></tr>`).join('')}</tbody></table></div>`;
}

function calFreqText(s){
  const t = s.start_time ? s.start_time.slice(0,5) : '';
  if (s.freq === 'daily') return `Every day at ${t}`;
  if (s.freq === 'monthly') return `Monthly on day ${s.day_of_month||'—'} at ${t}`;
  return `${s.freq==='biweekly'?'Every other':'Every'} ${DOW[s.dow??0]} at ${t}`;
}

function seriesForm(id){
  const s = id ? CAL_SERIES.find(x=>x.id===id) : null;
  const opts = list => list.map(x=>`<option value="${x.id}" ${s?.show_id===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
  const m = modal({
    title: s ? 'Edit recurring show' : 'New recurring show',
    wide: true,
    saveLabel: 'Save & generate',
    body: `<div class="form-grid">
      <div class="field full"><label>Series title</label><input id="srTitle" value="${s?esc(s.title):''}" placeholder="e.g. Monday Night Waivers"></div>
      <div class="field"><label>Show</label><select id="srShow"><option value="">— none —</option>${opts(CAL_SHOWS)}</select></div>
      <div class="field"><label>Type</label><select id="srFormat">
        <option value="live" ${s?.format!=='prerecorded'?'selected':''}>Live</option>
        <option value="prerecorded" ${s?.format==='prerecorded'?'selected':''}>Pre-recorded</option></select></div>
      <div class="field"><label>Repeats</label><select id="srFreq" onchange="srFreqToggle()">
        ${['weekly','biweekly','daily','monthly'].map(f=>`<option value="${f}" ${s?.freq===f?'selected':''}>${f[0].toUpperCase()+f.slice(1)}</option>`).join('')}</select></div>
      <div class="field" id="srDowWrap"><label>Day of week</label><select id="srDow">
        ${DOW.map((d,i)=>`<option value="${i}" ${(s?.dow??1)===i?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field" id="srDomWrap" style="display:none"><label>Day of month</label>
        <input type="number" id="srDom" min="1" max="31" value="${s?.day_of_month||1}"></div>
      <div class="field"><label>Start time (CT)</label><input type="time" id="srTime" value="${s?s.start_time.slice(0,5):'19:00'}"></div>
      <div class="field"><label>Length (min)</label><input type="number" id="srLen" min="5" step="5" value="${s?s.duration_minutes:60}"></div>
      <div class="field"><label>First date</label><input type="date" id="srStart" value="${s?s.starts_on:calDayKey(new Date())}"></div>
      <div class="field"><label>End date (optional)</label><input type="date" id="srEnd" value="${s?.ends_on||''}"></div>
      <div class="field"><label>Active</label><select id="srActive">
        <option value="true" ${s?.is_active!==false?'selected':''}>Yes</option>
        <option value="false" ${s?.is_active===false?'selected':''}>Paused</option></select></div>
      <div class="field full"><label>Notes</label><textarea id="srNotes" rows="2">${s?esc(s.notes||''):''}</textarea></div>
      ${s?`<div class="field full"><label><input type="checkbox" id="srReset"> Rebuild future episodes (wipes upcoming occurrences of this series and re-creates them)</label></div>`:''}
    </div>`,
    onSave: async () => {
      const payload = {
        title: calv('srTitle'),
        show_id: calv('srShow') || null,
        format: calv('srFormat'),
        freq: calv('srFreq'),
        dow: calv('srFreq')==='monthly' || calv('srFreq')==='daily' ? null : parseInt(calv('srDow'),10),
        day_of_month: calv('srFreq')==='monthly' ? parseInt(calv('srDom'),10) : null,
        start_time: calv('srTime'),
        duration_minutes: parseInt(calv('srLen')||'60',10),
        starts_on: calv('srStart'),
        ends_on: calv('srEnd') || null,
        is_active: calv('srActive') === 'true',
        notes: calv('srNotes') || null
      };
      if (!payload.title) throw new Error('Give the series a title');
      let sid = id;
      if (id){
        await dbPatch(`content_series?id=eq.${id}`, payload);           // db call
      } else {
        const ins = await dbPost('content_series', payload);
        sid = Array.isArray(ins) ? ins[0]?.id : ins?.id;
      }
      const reset = !!document.getElementById('srReset')?.checked;
      if (sid) await seriesGenerate(sid, reset, true);
      if (m.close) m.close();
      loadCalendar();
    },
    onReady: () => srFreqToggle()
  });
}

function srFreqToggle(){
  const f = calv('srFreq');
  const dow = document.getElementById('srDowWrap'), dom = document.getElementById('srDomWrap');
  if (dow) dow.style.display = (f==='weekly'||f==='biweekly') ? '' : 'none';
  if (dom) dom.style.display = (f==='monthly') ? '' : 'none';
}

async function seriesGenerate(id, reset, quiet){
  try {
    const n = await rpc('generate_series_events', { p_series:id, p_through:null, p_reset:!!reset });
    toast(`${n||0} episode${n===1?'':'s'} scheduled`);
  } catch(err){ toast('Could not generate episodes'); }
  if (!quiet) loadCalendar();
}

async function seriesDelete(id){
  if (!confirm('Delete this recurring show? Episodes already on the calendar are kept.')) return;
  await dbDel(`content_series?id=eq.${id}`);                            // db call
  toast('Recurring show deleted');
  loadCalendar();
}

/* ----- guests ----- */
function calGuestsHtml(){
  if (!CAL_GUESTS.length) return '<div class="empty">No guests yet.</div>';
  const count = {};
  CAL_EVENTS.forEach(e => calGuestsOf(e).forEach(p => { if (p.guest_id) count[p.guest_id] = (count[p.guest_id]||0)+1; }));
  return `<div class="table-wrap"><table><thead><tr>
      <th>Name</th><th>Org</th><th>Contact</th><th>Appearances</th><th></th>
    </tr></thead><tbody>${CAL_GUESTS.map(g=>`<tr>
      <td><button class="chip chip-link" onclick="guestDetail('${g.id}')">${esc(g.name)}</button></td>
      <td>${esc(g.org||'—')}</td>
      <td class="mono">${esc(g.email||g.handle||'—')}</td>
      <td>${count[g.id]||0}</td>
      <td class="row-actions">
        ${ifCan('calendar','u',`<button class="btn btn-ghost btn-sm" onclick="guestForm('${g.id}')">Edit</button>`)}
        ${ifCan('calendar','d',`<button class="btn btn-danger btn-sm" onclick="guestDelete('${g.id}')">Delete</button>`)}
      </td></tr>`).join('')}</tbody></table></div>`;
}

function guestForm(id){
  const g = id ? CAL_GUESTS.find(x=>x.id===id) : null;
  const m = modal({
    title: g ? 'Edit guest' : 'Add guest',
    saveLabel: 'Save guest',
    body: `<div class="form-grid">
      <div class="field full"><label>Name</label><input id="gsName" value="${g?esc(g.name):''}"></div>
      <div class="field"><label>Organization</label><input id="gsOrg" value="${g?esc(g.org||''):''}"></div>
      <div class="field"><label>Handle</label><input id="gsHandle" value="${g?esc(g.handle||''):''}" placeholder="@"></div>
      <div class="field"><label>Email</label><input id="gsEmail" value="${g?esc(g.email||''):''}"></div>
      <div class="field"><label>Phone</label><input id="gsPhone" value="${g?esc(g.phone||''):''}"></div>
      <div class="field full"><label>Notes</label><textarea id="gsNotes" rows="3">${g?esc(g.notes||''):''}</textarea></div>
    </div>`,
    onSave: async () => {
      const payload = { name: calv('gsName'), org: calv('gsOrg')||null, handle: calv('gsHandle')||null,

      if (!payload.name) throw new Error('Name is required');
      if (id) await dbPatch(`guests?id=eq.${id}`, payload);             // db call

      toast('Guest saved');
