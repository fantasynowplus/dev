<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FantasyNow+</title><meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="toggle-link">
      <div class="fn-modal-alt"><a href="forgot-password">Forgot password?</a></div>
      </div>
      <button type="submit">Login</button>
      <div id="error" class="error"></div>
    </form>

    <div class="toggle-link">
      <span id="toggle-text">Don't have an account? <a id="toggle-btn">Sign up</a></span>
    </div>
  </div>

  <script src="javascript/auth.js"></script>
  <script src="javascript/login.js"></script>
</body>
</html>
